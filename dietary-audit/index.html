<style>
:root{--primary:#1a3c5e;--primary-light:#2980b9;--accent:#e67e22;--success:#27ae60;--danger:#e74c3c;--warn:#f39c12;--bg:#f0f2f5;--card:#fff;--text:#2c3e50;--text-light:#7f8c8d;--border:#dce1e6;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:80px}
.header{background:linear-gradient(135deg,#0d2137,var(--primary));color:#fff;padding:14px 18px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:17px;font-weight:800;letter-spacing:.3px}
.header .sub{font-size:11px;opacity:.75;margin-top:2px}
.who{font-size:12px;background:rgba(255,255,255,.15);padding:5px 10px;border-radius:16px;cursor:pointer;white-space:nowrap}
.page{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--border)}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-light{background:#fff;color:var(--primary);border:1.5px solid var(--border)}
.btn:disabled{opacity:.5}
label{display:block;font-size:12px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;background:#fff;color:var(--text);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-light)}
.hint{font-size:12px;color:var(--text-light);margin-top:6px;line-height:1.4}
.section-title{font-size:12px;font-weight:800;color:var(--text-light);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 8px}
.back{color:var(--primary-light);font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px;display:inline-block}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#2c3e50;color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.big{font-size:40px;font-weight:800;line-height:1}
.pass{color:var(--success)}.alert{color:var(--danger)}
.pill{display:inline-block;font-size:11px;font-weight:800;border-radius:10px;padding:2px 8px;vertical-align:2px}
.pill.ok{background:#e8f6ee;color:var(--success)}.pill.bad{background:#fdeceb;color:var(--danger)}.pill.draft{background:#fef9e7;color:#a07708}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #f0f2f5;cursor:pointer}
.row:last-child{border-bottom:none}
.row .nm{flex:1}.row .nm b{display:block;font-size:15px;color:var(--primary)}.row .nm span{font-size:12px;color:var(--text-light)}
.row .st{font-size:13px;font-weight:700;text-align:right}
.bar{height:6px;background:#eef1f4;border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--primary-light)}
.item{padding:12px 0;border-bottom:1px solid #f0f2f5}
.item:last-child{border-bottom:none}
.item .lbl{font-size:15px;line-height:1.35;font-weight:600}
.item .lbl .n{color:var(--text-light);font-weight:800;margin-right:4px}
.item .note{font-size:12.5px;color:var(--text-light);margin-top:3px;line-height:1.35}
.mn{display:flex;gap:8px;margin-top:8px}
.mn button{flex:1;padding:10px 4px;border-radius:9px;border:1.5px solid var(--border);background:#fff;font-size:14px;font-weight:700;color:var(--text-light);cursor:pointer;font-family:inherit}
.mn button.met.on{background:var(--success);border-color:var(--success);color:#fff}
.mn button.not_met.on{background:var(--danger);border-color:var(--danger);color:#fff}
.mn button.na.on{background:#95a5a6;border-color:#95a5a6;color:#fff}
.item textarea,.item input{margin-top:8px;font-size:15px;padding:10px}
.cap{background:#fdf3f2;border:1px solid #f5c6c2;border-radius:10px;padding:10px;margin-top:8px}
.cap label{margin-top:6px;color:var(--danger)}
.temps{font-size:12.5px;border-collapse:collapse;margin-top:6px;width:100%}
.temps td{border-bottom:1px solid #f0f2f5;padding:3px 4px;color:var(--text)}
.sub-h{font-size:13px;font-weight:800;color:var(--primary);margin:14px 0 2px}
.banner{padding:12px 16px;border-radius:10px;font-size:14px;font-weight:700;margin-bottom:12px;text-align:center}
.banner.warn{background:#fef9e7;color:#a07708}.banner.bad{background:#fdeceb;color:var(--danger)}.banner.ok{background:#e8f6ee;color:var(--success)}
.sticky{position:sticky;bottom:64px;z-index:50;margin-top:12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:600;margin-top:10px}
.chk input{width:22px;height:22px;flex:none;margin-top:1px}
.saved{font-size:11.5px;color:var(--text-light);text-align:right;margin-top:-4px;margin-bottom:8px}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ph{position:relative;width:84px;height:84px;border-radius:9px;overflow:hidden;background:#eef1f4;border:1px solid var(--border)}
.ph img{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block}
.ph .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:12px;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:14px;font-weight:800;cursor:pointer;line-height:24px;padding:0}
.ph.busy{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-light);font-weight:700}
.addph{width:84px;height:84px;border-radius:9px;border:1.5px dashed var(--danger);background:#fff;color:var(--danger);font-size:12px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit}
.addph b{font-size:22px;line-height:1}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.viewer img{max-width:100%;max-height:100%;border-radius:6px}
.seg{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;min-width:0;padding:10px 6px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:13.5px;font-weight:700;color:var(--text-light);cursor:pointer;font-family:inherit;white-space:nowrap}
.seg button.on{background:var(--primary);border-color:var(--primary);color:#fff}
@media (max-width:480px){.seg{display:grid;grid-template-columns:1fr 1fr}}
.kpis{display:flex;gap:8px;margin-bottom:4px}
.kpi{flex:1;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
.kpi b{display:block;font-size:24px;color:var(--primary)}.kpi span{font-size:11.5px;color:var(--text-light);font-weight:600}
.kpi.bad b{color:var(--danger)}
.grid{overflow-x:auto}
.grid table{border-collapse:collapse;font-size:13px;width:100%}
.grid th,.grid td{border:1px solid #eef1f4;padding:8px 4px;text-align:center;min-width:38px}
.grid th{color:var(--text-light);font-weight:700}
.grid td.h{text-align:left;font-weight:700;color:var(--primary);white-space:nowrap;padding-left:6px}
.grid td.ok,.grid td.bad,.grid td.dr,.grid td.none{cursor:pointer;font-weight:800}
.grid td.ok{background:#e8f6ee;color:var(--success)}.grid td.bad{background:#fdeceb;color:var(--danger)}
.grid td.dr{background:#fef9e7;color:#a07708}.grid td.none{color:#c3cad1}
.donebtn{margin-top:8px;padding:8px 12px;border-radius:9px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:700;color:var(--primary);cursor:pointer;font-family:inherit}
.donebtn.on{background:#e8f6ee;border-color:var(--success);color:var(--success)}
/* print */
#print{display:none}
@media print{
  body{background:#fff;padding:0}
  .header,.page,.toast,.viewer,.ms-nav,#msNav,nav{display:none!important}
  #print{display:block;font-size:10.5px;color:#000}
  #print h1{font-size:15px;margin-bottom:4px}
  #print h2{font-size:12px;margin:10px 0 3px;border-bottom:1px solid #000}
  #print table{width:100%;border-collapse:collapse}
  #print td,#print th{border:1px solid #888;padding:2px 4px;vertical-align:top;text-align:left}
  #print th{background:#eee}
  #print .c{text-align:center;width:38px}
  #print .pgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  #print .pgrid img{width:2.3in;height:1.75in;object-fit:cover;border:1px solid #888}
  #print .pitem{break-inside:avoid;margin-top:8px}
}

function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

function monthKey(off){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+(off||0));return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-01'}
function monthName(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}
function fmtDate(s){if(!s)return '';var p=s.split('-');return (+p[1])+'/'+(+p[2])+'/'+p[0].slice(2)}

// Score per the form: met ÷ (met + not met) × 100; N/A items leave the denominator.
function score(a){var m=0,n=0,x=0;ALL.forEach(function(i){var v=a.results[i.key];if(v==='met')m++;else if(v==='not_met')n++;else if(v==='na')x++});
  return {met:m,not:n,na:x,done:m+n+x,total:ALL.length,pct:(m+n)?Math.round(m/(m+n)*1000)/10:null}}
function secScore(a,sid){var m=0,n=0,d=0,t=0;ALL.forEach(function(i){if(i.sec!==sid)return;t++;var v=a.results[i.key];if(v)d++;if(v==='met')m++;if(v==='not_met')n++});return {m:m,n:n,d:d,t:t}}
function auditFor(k){return audits.find(function(a){return a.audit_month===k})||null}

function openFrom(f,m,done){setBuilding(f);if(done)openSummary(m);else openAudit(m)}
function capOpen(){
  // Not Met items from finished audits (last 6 months) that weren't fixed on the spot and aren't marked done.
  var out=[],t=today(),since=monthKey(-6);
  allAudits.forEach(function(a){
    if(a.status!=='complete'||a.audit_month<since)return;
    Object.keys(a.results||{}).forEach(function(k){
      if(a.results[k]!=='not_met')return;
      var c=(a.corrections||{})[k]||{};if(c.corrected||c.done)return;
      var it=ALL.find(function(i){return i.key===k});
      out.push({a:a,k:k,text:it?it.text:k,where:it?secLabel(it):'',action:c.action||'',goal:c.goal_date||'',over:!!(c.goal_date&&c.goal_date<t)});
    });
  });
  return out.sort(function(x,y){return (y.over-x.over)||String(x.goal||'9').localeCompare(String(y.goal||'9'))});
}

function itemHtml(k,num,text,extra){
  var v=cur.results[k],c=cur.corrections[k]||{};
  var h='<div class="item" id="it_'+k+'"><div class="lbl"><span class="n">'+esc(num)+'.</span>'+esc(text)+'</div>';
  if(extra&&extra.t==='temps'){h+='<table class="temps">'+TEMPS.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td><b>'+esc(r[1])+'</b></td><td>'+esc(r[2])+'</td></tr>'}).join('')+'</table>'}
  else if(extra){h+='<div class="note">'+esc(extra)+'</div>'}
  h+='<div class="mn">'+
    '<button class="met'+(v==='met'?' on':'')+'" onclick="setItem(\''+k+'\',\'met\')">✓ Met</button>'+
    '<button class="not_met'+(v==='not_met'?' on':'')+'" onclick="setItem(\''+k+'\',\'not_met\')">✗ Not Met</button>'+
    '<button class="na'+(v==='na'?' on':'')+'" onclick="setItem(\''+k+'\',\'na\')">N/A</button></div>';
  var showC=v==='not_met'||cur.comments[k]||(extra&&typeof extra==='string'&&/Record/.test(extra));
  if(showC)h+='<textarea rows="2" placeholder="Comments / readings (no resident names)" oninput="setComment(\''+k+'\',this.value)">'+esc(cur.comments[k]||'')+'</textarea>';
  else h+='<div class="hint" style="cursor:pointer;color:var(--primary-light);font-weight:700" onclick="cur.comments[\''+k+'\']=\' \';rerenderItem(\''+k+'\')">+ Add comment</div>';
  if(v==='not_met'){
    h+='<div class="cap"><label>Correction (what will be done)</label><textarea rows="2" placeholder="Corrective action" oninput="setCorr(\''+k+'\',\'action\',this.value)">'+esc(c.action||'')+'</textarea>'+
      '<label>Goal date</label><input type="date" value="'+esc(c.goal_date||'')+'" onchange="setCorr(\''+k+'\',\'goal_date\',this.value)">'+
      '<div class="chk"><input type="checkbox" '+(c.corrected?'checked':'')+' onchange="setCorr(\''+k+'\',\'corrected\',this.checked)"><span>Corrected on the spot</span></div>'+
      '<label>Photos</label>'+photoStrip(k,true)+'</div>';
  }
  return h+'</div>';
}

// ---- Photos for Not Met findings (bucket dietary-audit-photos, private; paths in .photos[key]) ----
var MAX_PHOTOS=4, urlCache={}, uploading={};
function photoStrip(k,editable){
  var list=(cur.photos&&cur.photos[k])||[];
  var h='<div class="photos" id="ph_'+k+'">';
  list.forEach(function(p,i){
    var u=urlCache[p];
    h+='<div class="ph">'+(u?'<img src="'+esc(u)+'" onclick="viewPhoto(\''+esc(p)+'\')" alt="Photo '+(i+1)+'">':'')+
      (editable?'<button class="x" title="Remove photo" onclick="removePhoto(\''+k+'\','+i+')">×</button>':'')+'</div>';
  });
  for(var n=0;n<(uploading[k]||0);n++)h+='<div class="ph busy">Uploading…</div>';
  if(editable&&list.length+(uploading[k]||0)<MAX_PHOTOS)
    h+='<label class="addph" style="margin:0;text-transform:none;letter-spacing:0"><b>📷</b>Add photo<input type="file" accept="image/*" capture="environment" style="display:none" onchange="addPhoto(\''+k+'\',this)"></label>';
  h+='</div>';
  if(editable)h+='<div class="hint">Kitchen and equipment only — no residents or faces. Up to '+MAX_PHOTOS+'.</div>';
  var missing=list.filter(function(p){return !urlCache[p]});
  if(missing.length)signPhotos(missing).then(function(){var el=document.getElementById('ph_'+k);if(el){var w=document.createElement('div');w.innerHTML=photoStrip(k,editable);el.replaceWith(w.firstChild)}});
  return h;
}
async function signPhotos(paths){
  paths=paths.filter(function(p){return !urlCache[p]});if(!paths.length)return;
  var r=await sb.storage.from('dietary-audit-photos').createSignedUrls(paths,3600);
  (r.data||[]).forEach(function(x){if(x.signedUrl)urlCache[x.path]=x.signedUrl});
}
function shrink(file){
  // Phone photos are 3–12 MB; resize to 1600 px JPEG before upload.
  return new Promise(function(res,rej){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){var m=1600,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,m/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error('Could not read photo'))},'image/jpeg',0.82)};
    img.onerror=function(){URL.revokeObjectURL(u);rej(new Error('Could not read photo'))};
    img.src=u;
  });
}
async function addPhoto(k,input){
  var f=input.files&&input.files[0];input.value='';if(!f)return;
  uploading[k]=(uploading[k]||0)+1;rerenderItem(k);
  try{
    var blob=await shrink(f);
    var path=cur.facility.toLowerCase().replace(/[^a-z]+/g,'-')+'/'+cur.audit_month.slice(0,7)+'/'+k+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
    var r=await sb.storage.from('dietary-audit-photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});
    if(r.error)throw r.error;
    urlCache[path]=URL.createObjectURL(blob);
    cur.photos=cur.photos||{};(cur.photos[k]=cur.photos[k]||[]).push(path);
    queueSave();
  }catch(e){toast('Photo upload failed — try again')}
  uploading[k]--;rerenderItem(k);
}
async function removePhoto(k,i){
  if(!confirm('Remove this photo?'))return;
  var p=cur.photos[k][i];cur.photos[k].splice(i,1);if(!cur.photos[k].length)delete cur.photos[k];
  rerenderItem(k);queueSave();
  sb.storage.from('dietary-audit-photos').remove([p]);
}
function viewPhoto(p){var u=urlCache[p];if(!u)return;var v=document.createElement('div');v.className='viewer';v.innerHTML='<img src="'+esc(u)+'" alt="Photo">';v.onclick=function(){v.remove()};document.body.appendChild(v)}
function rerenderItem(k){var it=ALL.find(function(i){return i.key===k});var el=document.getElementById('it_'+k);if(!el)return render();
  var w=document.createElement('div');w.innerHTML=itemHtml(it.key,it.num,it.text,it.extra);el.replaceWith(w.firstChild)}
function openSection(id){openSec=id;render();window.scrollTo(0,0)}
function setItem(k,v){if(cur.results[k]===v)delete cur.results[k];else cur.results[k]=v;rerenderItem(k);queueSave()}
function setComment(k,t){cur.comments[k]=t;queueSave()}
function setCorr(k,f,val){cur.corrections[k]=cur.corrections[k]||{};cur.corrections[k][f]=val;queueSave()}
function markRestMet(){ALL.forEach(function(i){if(i.sec===openSec&&!cur.results[i.key])cur.results[i.key]='met'});render();queueSave()}

function savedText(){return saving?'Saving…':dirty?'Unsaved changes':lastSaved?'Saved '+lastSaved.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):''}
function noteSaved(){var n=document.getElementById('savedNote');if(n)n.textContent=savedText()}
function queueSave(){dirty=true;noteSaved();clearTimeout(saveTimer);saveTimer=setTimeout(saveDraft,1500)}
function flushSave(){if(dirty){clearTimeout(saveTimer);saveDraft()}}
function cleanJson(o){var r={};Object.keys(o||{}).forEach(function(k){var v=o[k];if(typeof v==='string'){v=v.trim();if(v)r[k]=v}else if(v&&typeof v==='object'){var s=cleanJson(v);if(Object.keys(s).length)r[k]=s}else if(v===true)r[k]=v});return r}
function rowFrom(a,extra){
  var s=score(a);
  return Object.assign({facility:a.facility||FACILITY,audit_month:a.audit_month,status:a.status,results:a.results,comments:cleanJson(a.comments),corrections:cleanJson(a.corrections),photos:a.photos||{},
    met_count:s.met,not_met_count:s.not,na_count:s.na,score_pct:s.pct,evaluator:a.evaluator||me.name,completed_date:a.completed_date||null,
    administrator_notified:!!a.administrator_notified,source:'staff-app',updated_at:new Date().toISOString()},extra||{});
}
async function saveDraft(){
  if(!cur)return;
  if(saving){queueSave();return}
  saving=true;dirty=false;noteSaved();
  var res=await sb.from('dietary_sanitation_audits').upsert(rowFrom(cur),{onConflict:'facility,audit_month'});
  saving=false;
  if(res.error){dirty=true;noteSaved();toast('Save failed — check connection');return}
  lastSaved=new Date();noteSaved();
}
async function finish(){
  var s=score(cur);
  if(s.done<s.total){
    var miss=ALL.filter(function(i){return !cur.results[i.key]});
    var secs=[];miss.forEach(function(i){if(secs.indexOf(i.sec)<0)secs.push(i.sec)});
    toast(miss.length+' item'+(miss.length>1?'s':'')+' left — Section '+secs.join(', '));return;
  }
  var noCap=ALL.filter(function(i){return cur.results[i.key]==='not_met'&&!((cur.corrections[i.key]||{}).action||'').trim()});
  if(noCap.length){openSec=noCap[0].sec;render();var el=document.getElementById('it_'+noCap[0].key);if(el)el.scrollIntoView({block:'center'});toast('Add a correction for each Not Met item');return}
  var noDate=ALL.filter(function(i){var c=cur.corrections[i.key]||{};return cur.results[i.key]==='not_met'&&!c.corrected&&!c.goal_date});
  if(noDate.length){openSec=noDate[0].sec;render();var el2=document.getElementById('it_'+noDate[0].key);if(el2)el2.scrollIntoView({block:'center'});toast('Add a goal date (or check "Corrected on the spot")');return}
  clearTimeout(saveTimer);
  var btn=document.getElementById('finBtn');if(btn){btn.disabled=true;btn.textContent='Saving…'}
  cur.status='complete';cur.completed_date=cur.completed_date||today();if(!cur.evaluator)cur.evaluator=me.name;
  saving=true;
  // finished_at fires the Administrator summary email; the snapshot gives it the item wording.
  var snap={sections:SECTIONS.map(function(sec){var q=secScore(cur,sec.id);return {id:sec.id,title:sec.title,met:q.m,not_met:q.n}}),
    not_met:notMetList(cur).map(function(i){return {key:i.key,where:secLabel(i),text:i.text}})};
  var res=await sb.from('dietary_sanitation_audits').upsert(rowFrom(cur,{finished_at:new Date().toISOString(),finish_snapshot:snap}),{onConflict:'facility,audit_month'});
  saving=false;
  if(res.error){cur.status='draft';toast('Save failed: '+res.error.message);if(btn){btn.disabled=false;btn.textContent='Finish audit'}return}
  dirty=false;await loadData();openSummary(cur.audit_month);
  toast(s.pct>=PASSING?'✓ Audit saved — '+s.pct+'%':'Saved — '+s.pct+'% is a dietary alert');
}

// ---- Summary / corrective action plan ----
function openSummary(k){cur=JSON.parse(JSON.stringify(auditFor(k)));view='summary';render();window.scrollTo(0,0)}
function notMetList(a){return ALL.filter(function(i){return a.results[i.key]==='not_met'})}
function secLabel(i){var s=SECTIONS.find(function(x){return x.id===i.sec});return s.title.split(' — ')[0]+' · '+i.group+' #'+i.num}
function summaryView(){
  var a=cur,s=score(a),pass=s.pct>=PASSING,nm=notMetList(a);
  var h='<span class="back" onclick="msNavBack()">‹ Back</span>';
  h+='<div class="card"><div style="font-size:12px;font-weight:800;color:var(--primary-light);text-transform:uppercase;letter-spacing:.6px">'+esc(a.facility)+' · '+esc(monthName(a.audit_month))+'</div>'+
    '<div style="display:flex;align-items:flex-end;gap:12px;margin-top:8px"><div class="big '+(pass?'pass':'alert')+'">'+s.pct+'%</div><div class="hint" style="margin-bottom:4px">'+s.met+' met of '+(s.met+s.not)+' applicable · '+s.na+' N/A</div></div>'+
    '<div class="hint">Evaluator: '+esc(a.evaluator)+' · completed '+fmtDate(a.completed_date)+'</div></div>';
  if(!pass){
    h+='<div class="banner bad">Dietary alert — score is below 95%</div>';
    h+='<div class="card"><div style="font-weight:800;color:var(--danger)">Tell the '+esc(SHORT[a.facility]||a.facility)+' Administrator right away</div><div class="hint">Then make sure each Not Met item below has a correction and goal date. This list is the written corrective action plan.</div>'+
      '<div class="chk"><input type="checkbox" '+(a.administrator_notified?'checked':'')+' onchange="setNotified(this.checked)"><span>Administrator has been told</span></div></div>';
    h+='<div class="card" id="retakeCard"><div style="font-weight:800;color:var(--primary)">Refresher in-services</div><div class="hint">Checking what was assigned…</div></div>';
    setTimeout(loadRetakes,0);
  }else h+='<div class="banner ok">Pass — 95% or better</div>';
  h+='<div class="section-title">By section</div><div class="card" style="padding:4px 12px">';
  SECTIONS.forEach(function(sec){var q=secScore(a,sec.id),app=q.m+q.n;
    h+='<div class="row" style="cursor:default"><div class="nm"><b>'+esc(sec.title)+'</b></div><div class="st" style="color:'+(q.n?'var(--danger)':'var(--success)')+'">'+(app?Math.round(q.m/app*1000)/10+'%':'N/A')+(q.n?' · '+q.n+' not met':'')+'</div></div>'});
  h+='</div>';
  if(nm.length){
    h+='<div class="section-title">Corrective action plan — '+nm.length+' item'+(nm.length>1?'s':'')+'</div><div class="card" style="padding:4px 16px">';
    nm.forEach(function(i){var c=a.corrections[i.key]||{};
      h+='<div class="item"><div class="note" style="margin:0 0 2px;font-weight:700">'+esc(secLabel(i))+'</div><div class="lbl">'+esc(i.text)+'</div>'+
        (a.comments[i.key]?'<div class="note">Finding: '+esc(a.comments[i.key])+'</div>':'')+
        '<div class="note" style="color:var(--text)"><b>Correction:</b> '+esc(c.action||'—')+'</div>'+
        '<div class="note"><b>'+(c.corrected?'Corrected on the spot':'Goal date: '+esc(fmtDate(c.goal_date)||'—'))+'</b></div>'+
        (c.corrected?'':'<button class="donebtn'+(c.done?' on':'')+'" onclick="toggleCapDone(\''+i.key+'\')">'+(c.done?'✓ Done '+esc(fmtDate(c.done))+' — tap to undo':'Mark correction done')+'</button>')+
        (((a.photos||{})[i.key]||[]).length?photoStrip(i.key,false):'')+'</div>'});
    h+='</div>';
  }
  h+='<div style="display:flex;gap:8px;margin-top:6px"><button class="btn btn-light" onclick="printAudit()">🖨️ Print</button><button class="btn btn-light" onclick="openAudit(\''+a.audit_month+'\')">Edit</button></div>';
  return h;
}
// Refresher in-services: a database trigger assigns them when an audit is finished below 95%
// (dietary_retake_assignments → In-Service Quiz app; dietary-retake-notify emails part-time staff + Elizabeth/Stephen).
var MODULE_TITLES={2:'Personal Hygiene, Handwashing & Glove Use',3:'Safe Cooking Temperatures & Thermometer Use',4:'Cooling Foods, Holding & Leftovers',
  5:'Food Storage, Labeling & Preventing Cross-Contamination',10:'Sanitation: Dish Machine, 3-Compartment Sink & Sanitizers',11:'Infection Control: Employee Illness, PPE & Isolation Trays'};
async function loadRetakes(tries){
  var el=document.getElementById('retakeCard');if(!el||!cur)return;
  var r=await sb.rpc('dietary_audit_retakes',{p_facility:cur.facility,p_audit_month:cur.audit_month});
  if(!document.getElementById('retakeCard'))return;
  var rows=(r.data||[]);
  if((!rows.length||!rows[0].mode)&&(tries||0)<4){setTimeout(function(){loadRetakes((tries||0)+1)},2500);return}
  var h='<div style="font-weight:800;color:var(--primary)">Refresher in-services</div>';
  if(!rows.length){h+='<div class="hint">None assigned yet. If this stays empty, tell the Administrator.</div>'}
  else{
    var em=rows[0].emailed,ft=rows[0].full_time;
    h+='<div class="hint">Assigned '+fmtDate(rows[0].assigned_date)+' to the dietary team in the In-Service Quiz app. '+
      (rows[0].mode==='dry'?'Emails are in test mode — nobody was emailed.':rows[0].mode?em+' part-time staff emailed; '+ft+' full-time take them at work.':'Emails are being sent.')+'</div>'+
      '<ul style="margin:8px 0 0 18px;font-size:14px;line-height:1.5">'+rows.map(function(x){return '<li>'+esc(MODULE_TITLES[x.module_number]||('Module '+x.module_number))+'</li>'}).join('')+'</ul>';
  }
  document.getElementById('retakeCard').innerHTML=h;
}
async function toggleCapDone(k){
  var c=cur.corrections[k]=cur.corrections[k]||{};
  if(c.done)delete c.done;else c.done=today();
  var r=await sb.from('dietary_sanitation_audits').update({corrections:cleanJson(cur.corrections),updated_at:new Date().toISOString()}).eq('facility',cur.facility).eq('audit_month',cur.audit_month);
  if(r.error){toast('Save failed — check connection');return}
  var a=auditFor(cur.audit_month);if(a)a.corrections=JSON.parse(JSON.stringify(cur.corrections));
  var y=window.scrollY;render();window.scrollTo(0,y);toast(c.done?'Marked done':'Reopened');
}
async function setNotified(v){
  cur.administrator_notified=v;
  var r=await sb.from('dietary_sanitation_audits').update({administrator_notified:v,updated_at:new Date().toISOString()}).eq('facility',cur.facility).eq('audit_month',cur.audit_month);
  if(r.error){toast('Save failed — check connection');return}
  var a=auditFor(cur.audit_month);if(a)a.administrator_notified=v;toast(v?'Noted — Administrator told':'Updated');
}
function mark(v){return v==='met'?'✓':v==='not_met'?'✗':v==='na'?'N/A':''}
async function printAudit(){
  var a=cur,s=score(a),ph=a.photos||{};
  var withPh=notMetList(a).filter(function(i){return (ph[i.key]||[]).length});
  var allP=[];withPh.forEach(function(i){allP=allP.concat(ph[i.key])});
  if(allP.length){toast('Getting photos ready…');await signPhotos(allP)}
  var h='<h1>'+esc(a.facility)+' — Dietary Sanitation / Infection Control Audit — '+esc(monthName(a.audit_month))+'</h1>'+
    '<div>Date of completion: <b>'+esc(fmtDate(a.completed_date))+'</b> &nbsp; Evaluator: <b>'+esc(a.evaluator)+'</b> &nbsp; Final score: <b>'+s.pct+'%</b> ('+s.met+' met / '+(s.met+s.not)+' applicable; '+s.na+' N/A) &nbsp; '+(s.pct>=PASSING?'PASS':'DIETARY ALERT'+(a.administrator_notified?' — Administrator notified':''))+'</div>';
  SECTIONS.forEach(function(sec){
    h+='<h2>'+esc(sec.title)+'</h2>';
    sec.groups.forEach(function(g){
      h+='<table><tr><th style="width:30px">#</th><th>'+esc(g.title)+'</th><th class="c">Met</th><th class="c">Not Met</th><th style="width:22%">Comments</th><th style="width:22%">Corrections</th></tr>';
      g.items.forEach(function(it){var k=it[0],v=a.results[k],c=a.corrections[k]||{};
        h+='<tr><td>'+esc(it[1])+'</td><td>'+esc(it[2])+'</td><td class="c">'+(v==='met'?'✓':v==='na'?'N/A':'')+'</td><td class="c">'+(v==='not_met'?'✗':'')+'</td><td>'+esc(a.comments[k]||'')+'</td><td>'+
          (v==='not_met'?esc(c.action||'')+(c.corrected?' (corrected on the spot)':c.goal_date?' — goal '+esc(fmtDate(c.goal_date)):''):'')+'</td></tr>'});
      h+='</table>';
    });
  });
  if(withPh.length){
    h+='<h2>Photos — Not Met items</h2>';
    withPh.forEach(function(i){h+='<div class="pitem"><b>'+esc(secLabel(i))+'</b> — '+esc(i.text)+'<div class="pgrid">'+
      ph[i.key].map(function(p){return urlCache[p]?'<img src="'+esc(urlCache[p])+'">':''}).join('')+'</div></div>'});
  }
  h+='<div style="margin-top:8px">Form revised 10/15/25 · Printed '+esc(new Date().toLocaleDateString('en-US'))+' from the Morning Star Staff Apps</div>';
  var box=document.getElementById('print');box.innerHTML=h;
  // Wait for photos to load so they show on paper.
  await Promise.all(Array.prototype.map.call(box.querySelectorAll('img'),function(im){return im.complete?0:new Promise(function(r){im.onload=im.onerror=r;setTimeout(r,8000)})}));
  window.print();
}

async function refresh(){await loadData();render()}
window.addEventListener('beforeunload',function(){flushSave()});
document.addEventListener('visibilitychange',function(){if(document.hidden)flushSave()});
(function init(){
  var u=window.MS&&MS.identity&&MS.identity.get();
  if(u)me.name=u.name;
  refresh();
})();
</script>
