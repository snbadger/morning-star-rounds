<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morning Star — Standup Screen</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* One-page card grid for a 65" TV at 10–15 ft (1920×1080). QAPI-dashboard look: white cards on grey,
   large type, status by color + icon + word (never color alone), grey + clock when the data is stale. */
:root{--bg:#eef0f3;--card:#fff;--text:#1d1d1f;--muted:#5c6470;--line:#e2e5ea;--navy:#052b49;--gold:#cf8c2a;
 --series:#2d6cb5;--good:#1f8a5b;--good-bg:#e6f4ec;--warn:#b35900;--warn-bg:#fdf0dd;--bad:#c62828;--bad-bg:#fde8e8;
 --stale:#6b7280;--stale-bg:#eceef1;--radius:18px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
#root{height:100vh;display:flex;flex-direction:column}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:20px;overflow:hidden}
header{height:84px;background:var(--navy);color:#fff;padding:0 28px;display:flex;align-items:center;gap:28px}
header h1{font-size:30px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
header .sub{font-size:17px;opacity:.78;margin-top:2px}
.hk{display:flex;gap:12px;flex:1;justify-content:center}
.hk div{background:rgba(255,255,255,.1);border-radius:12px;padding:6px 18px;text-align:center;min-width:140px}
.hk b{display:block;font-size:30px;font-weight:800;line-height:1.05}
.hk span{font-size:13px;letter-spacing:.5px;text-transform:uppercase;opacity:.8}
.hk .bad{background:rgba(255,99,99,.32)}.hk .warn{background:rgba(207,140,42,.38)}
.clock{text-align:right;white-space:nowrap}
.clock b{font-size:34px;font-weight:800;display:block;line-height:1}
.timer{font-size:16px;opacity:.85;cursor:pointer;font-variant-numeric:tabular-nums}
.timer.over{color:#ffb4ab;opacity:1}
.att{height:46px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;padding:0 28px;overflow:hidden}
.att .lbl{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-right:8px}
.att button{border:1.5px solid var(--line);background:#fff;color:var(--muted);font:inherit;font-size:15px;font-weight:600;padding:4px 12px;border-radius:18px;cursor:pointer;white-space:nowrap}
.att button.p{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.att button.l{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.att .sp{flex:1}.att .hint{font-size:13px;color:var(--muted)}
main{flex:1;min-height:0;padding:16px 28px 18px;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:1fr;gap:14px}
.card{background:var(--card);border-radius:var(--radius);padding:14px 18px 12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-top:8px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.card.good{border-top-color:var(--good)}.card.warn{border-top-color:var(--warn)}.card.bad{border-top-color:var(--bad)}
.card.stale{border-top-color:var(--stale);background:#f6f7f9}
.card.stale .hero,.card.stale .chart{opacity:.55}
.card.wide{grid-column:span 2}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ch h3{font-size:19px;font-weight:700;color:var(--muted);line-height:1.15}
.ch h3 small{display:block;font-size:13px;font-weight:600;color:#8a93a0;margin-top:2px}
.badge{font-size:14px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap;line-height:1.1}
.b-good{background:var(--good-bg);color:var(--good)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-stale{background:var(--stale-bg);color:var(--stale)}.b-none{background:#eef0f3;color:var(--muted)}
.hero{display:flex;align-items:baseline;gap:10px;margin-top:6px;flex-wrap:wrap}
.hero b{font-size:60px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.hero b.sm{font-size:44px}
.hero span{font-size:19px;color:var(--muted);font-weight:600}
.sub{font-size:17px;color:var(--muted);margin-top:4px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{flex:1;min-height:0;margin-top:6px;display:flex;align-items:flex-end}
.chart svg{width:100%;height:100%;display:block}
.rows{margin-top:6px;overflow:hidden;flex:1;min-height:0}
.row{display:flex;justify-content:space-between;gap:8px;font-size:17px;padding:3px 0;border-top:1px solid #f0f2f5;line-height:1.25}
.row:first-child{border-top:0}
.row .l{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .v{font-weight:700;white-space:nowrap}
.row.flag .v,.row.flag .l{color:var(--bad)}
.hb{display:grid;grid-template-columns:118px 1fr 54px;align-items:center;gap:8px;font-size:16px;padding:3px 0}
.hb .l{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .bar{height:12px;background:#eef0f3;border-radius:6px;position:relative;overflow:visible}
.hb .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--series)}
.hb .bar i.over{background:var(--bad)}
.hb .bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.6}
.hb .v{font-weight:700;text-align:right}
.dept{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 12px;margin-top:8px;overflow:hidden;flex:1;min-height:0;align-content:start}
.dept .d{display:flex;align-items:center;gap:7px;font-size:16px;padding:4px 0;border-bottom:1px solid #f0f2f5;min-width:0}
.dept .ic{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0}
.dept .ok .ic{background:var(--good-bg);color:var(--good)}.dept .miss .ic{background:var(--stale-bg);color:var(--stale)}.dept .part .ic{background:var(--warn-bg);color:var(--warn)}
.dept .n{font-weight:700;white-space:nowrap}.dept .r{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dept .miss .n{color:var(--stale)}
.foot{position:absolute;right:16px;bottom:8px;font-size:12px;color:#9aa3ae}
.sp{flex:1}
/* Flow view: the SWI's six sections one at a time, in meeting order (← → / 1–6 / clicker PageUp-PageDown). */
.steps{display:flex;gap:8px;padding:12px 28px 0}
.steps .st{flex:1;display:flex;align-items:center;gap:10px;border:0;background:#fff;border-radius:14px;padding:10px 14px;font:inherit;color:var(--muted);cursor:pointer;text-align:left;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.steps .st.done{opacity:.55}
.steps .st.on{background:var(--navy);color:#fff}
.steps .num{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;background:var(--stale-bg);color:var(--stale)}
.steps .s-good{background:var(--good-bg);color:var(--good)}.steps .s-warn{background:var(--warn-bg);color:var(--warn)}.steps .s-bad{background:var(--bad-bg);color:var(--bad)}
.steps .t{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.steps .et{font-size:16px;font-variant-numeric:tabular-nums;opacity:.85}.steps .et.over{color:#ffb4ab;opacity:1}
.flow main{grid-template-columns:repeat(var(--n),1fr);grid-auto-rows:1fr;gap:20px;padding:16px 28px}
.flow .card{padding:22px 26px 18px;border-top-width:10px}
.flow .card.wide{grid-column:auto}
.flow .ch h3{font-size:26px;color:var(--text)}.flow .ch h3 small{font-size:16px}
.flow .badge{font-size:17px;padding:6px 14px}
.flow .hero b{font-size:104px}.flow .hero b.sm{font-size:76px}.flow .hero span{font-size:23px}
.flow .sub{font-size:21px;white-space:normal}
.flow .row{font-size:21px;padding:6px 0}
.flow .hb{font-size:20px;grid-template-columns:170px 1fr 70px;padding:6px 0}.flow .hb .bar{height:16px}
.flow .dept{grid-template-columns:repeat(2,1fr)}.flow .dept .d{font-size:19px;padding:6px 0}
.flow .foot{font-size:14px}
.flow .chart{flex:0 1 240px;margin-top:18px}
.row .ei{display:inline-block;width:1.4em;font-weight:800}.row.k-warn .ei{color:var(--warn)}.row.k-stale .ei,.row.k-stale .v{color:var(--stale)}
.row small{color:var(--muted);font-size:.75em;font-weight:600;margin-left:6px}
.fb{height:56px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 28px 12px}
.fb button{border:0;background:none;font:inherit;font-size:18px;font-weight:700;color:var(--navy);cursor:pointer;padding:8px 4px}
.fb button.nx{margin-left:auto;background:var(--navy);color:#fff;border-radius:12px;padding:10px 22px}
.fb .hint{font-size:14px;color:var(--muted)}
.vt{background:rgba(255,255,255,.12);border:0;color:#fff;font:inherit;font-size:14px;font-weight:700;padding:6px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.pinbox{max-width:360px;margin:12vh auto;background:#fff;border-radius:14px;padding:26px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.pinbox input{width:100%;font-size:24px;letter-spacing:5px;text-align:center;padding:10px;border:1.5px solid var(--line);border-radius:10px;margin:14px 0}
.pinbox button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.err{color:var(--bad);font-size:13px;margin-top:8px}
@media (max-width:1500px){main{grid-template-columns:repeat(4,1fr)}.hero b{font-size:48px}.flow .hero b{font-size:80px}.flow .hero b.sm{font-size:60px}.steps .t{font-size:15px}}
@media (max-width:1000px){body{overflow:auto}#root{height:auto;min-height:100vh}.flow main{grid-template-columns:1fr;grid-auto-rows:minmax(300px,auto)}.steps{flex-wrap:wrap}.steps .st{flex:1 1 30%}main{height:auto;grid-template-columns:repeat(2,1fr);grid-auto-rows:260px}.card.wide{grid-column:span 2}header{height:auto;padding:12px 16px;flex-wrap:wrap}.hk{order:3;width:100%}.att{height:auto;flex-wrap:wrap;padding:8px 16px}}
@media (max-width:600px){main{grid-template-columns:1fr}.card.wide{grid-column:span 1}}
</style>
</head>
<body>
<div id="root"><div class="pinbox">Loading…</div></div>
<script>
var SUPABASE_URL='https://pmnudshutxwidxdtouqj.supabase.co';
var SUPABASE_KEY='sb_publishable_wzX5nLx18cfErNTRPO671w_sH4ED7ET';
var sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;

// Same roster and roles as the Standup Log app (index.html).
var ROSTER=[
 {name:'Donna Rogers',role:'don'},{name:'Savanna McCormick',role:'adon'},{name:'Amandeep Brar',role:'mds'},
 {name:'Yessi Flores',role:'dsd'},{name:'Randy Bago',role:'adm'},{name:'Belem Gonzalez',role:'bom'},
 {name:'Valerie Estrada',role:'ssd'},{name:'Michael Miller',role:'act'},{name:'Lucy Malcolm',role:'act'},
 {name:'Kim Beatrez',role:'diet'},{name:'Annie Vang',role:'mr'},{name:'Kelsey Kennington',role:'hr'},
 {name:'Sebastian Lopez',role:'mnt'},{name:'Joe Fronteras',role:'rehab'},{name:'Stephen Badger',role:'admin'}
];
var ROLES={don:'DON',adon:'ADON',mds:'MDS',dsd:'DSD / IP',adm:'Admissions',bom:'Business Office',ssd:'Social Services',act:'Activities',
 diet:'Dietary',mr:'Medical Records',hr:'HR',mnt:'Maintenance / EVS',rehab:'Rehab',admin:'Administrator'};
var FORM_KINDS=['log','count','list','falls'];
var DEADLINE='09:15';   // department tabs are due before standup

var S={view:ls('su_view')||'flow',sec:0,secStart:null,pin:null,tabs:[],byKey:{},today:null,day:null,live:null,started:null,att:{},attId:null,busy:false,loadedAt:null};

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function md(d){if(!d)return '';var p=String(d).slice(0,10).split('-');return (+p[1])+'/'+(+p[2])}
function addDays(d,n){var x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function num(v,dp){return v==null||isNaN(v)?'—':(+v).toFixed(dp==null?0:dp)}
function pastDeadline(){var n=new Date(),h=n.getHours()*60+n.getMinutes();return h>=9*60+15}
async function rpc(fn,args){
  if(!sb)throw new Error('offline');
  var r=await sb.rpc(fn,args);
  if(r.error){if(String(r.error.message).indexOf('bad_pin')>=0){ls('su_pin',null);S.pin=null;showPin('That PIN did not work.');throw new Error('bad_pin')}throw new Error(r.error.message)}
  return r.data;
}

// ---------- start ----------
function showPin(msg){
  document.getElementById('root').innerHTML='<div class="pinbox"><div style="font-size:20px;font-weight:800;color:var(--navy)">Standup Screen</div>'+
    '<div style="font-size:14px;color:var(--muted);margin-top:6px">Leadership PIN</div>'+
    '<input id="pinIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><button onclick="submitPin()">Open</button>'+(msg?'<div class="err">'+esc(msg)+'</div>':'')+'</div>';
  var i=document.getElementById('pinIn');i.focus();i.onkeydown=function(e){if(e.key==='Enter')submitPin()};
}
async function submitPin(){
  var v=document.getElementById('pinIn').value.trim();if(!v)return;
  try{await rpc('standup_bootstrap',{p_pin:v});ls('su_pin',v);S.pin=v;await boot()}catch(e){if(e.message!=='bad_pin')showPin('Could not connect: '+e.message)}
}
async function boot(){
  var b=await rpc('standup_bootstrap',{p_pin:S.pin});
  S.tabs=b.tabs;S.today=b.today;S.byKey={};S.tabs.forEach(function(t){S.byKey[t.tab_key]=t});
  await load();render();
  setInterval(poll,60000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&(!S.loadedAt||Date.now()-S.loadedAt>60000))poll()});
  setInterval(tick,1000);
}
// one call at a time, never while hidden, and not overnight (8 PM–5 AM) — a stacked-up poll stalled the database 10/23
function poll(){
  var h=new Date().getHours();
  if(S.busy||S.polling||document.hidden||h>=20||h<5)return;
  S.polling=true;
  load().then(render).catch(function(){}).then(function(){S.polling=false});
}
async function load(){
  var r=await Promise.all([rpc('standup_today',{p_pin:S.pin,p_date:null}),rpc('standup_live',{p_pin:S.pin})]);
  S.day=r[0];S.live=r[1];S.loadedAt=new Date();
  var a=(S.day.entries||[]).filter(function(e){return e.tab_key==='attendance'})[0];
  S.att={};S.attId=a?a.id:null;
  if(a){(a.data.present||[]).forEach(function(n){S.att[n]='p'});(a.data.late||[]).forEach(function(n){S.att[n]='l'})}
}

// ---------- data helpers ----------
function auto(k){return S.live&&S.live.auto&&S.live.auto[k]}
function trends(){return (S.live&&S.live.auto&&S.live.auto._trends)||{}}
function cov(k){return (S.day&&S.day.coverage&&S.day.coverage[k])||{}}
function entries(k){return ((S.day&&S.day.entries)||[]).filter(function(e){return e.tab_key===k&&e.status!=='closed'})}
function rowsOf(k){var a=auto(k);return a?(a.rows||[]).filter(function(r){return r.status!=='done'}):[]}
// A feed is stale when its as_of is older than the tab's cadence allows (daily feeds may be from yesterday).
// STRICT feeds carry the data date (not the run date) and must be from today: the HIM workbook's PCC forms row.
var STRICT={uda_overdue:1};
function staleDate(k){
  var a=auto(k),t=S.byKey[k];if(!a||!a.as_of)return null;
  var grace=STRICT[k]?0:({weekly:7,monthly:31}[t&&t.cadence]||1);
  return a.as_of<addDays(S.today,-grace)?a.as_of:null;
}
// Manual tab freshness: covered today (entered or marked nothing-to-report) within its cadence window.
function covered(k){var c=cov(k);return c.status==='entered'||c.status==='nothing'||(c.today_entries||0)>0}
function leadNum(s){var m=String(s||'').match(/-?\d+(\.\d+)?/);return m?+m[0]:null}

// ---------- tiny SVG charts (single series, one axis, goal line as reference) ----------
function lineChart(pts,o){
  o=o||{};var W=o.w||300,H=o.h||90,px=4,py=10;
  var vals=pts.map(function(p){return p.v}).filter(function(v){return v!=null});
  if(!vals.length)return '<div class="sub">No history yet</div>';
  var lo=Math.min.apply(null,vals.concat(o.goal!=null?[o.goal]:[])),hi=Math.max.apply(null,vals.concat(o.goal!=null?[o.goal]:[]));
  if(o.min!=null)lo=Math.min(lo,o.min);if(o.max!=null)hi=Math.max(hi,o.max);
  if(hi===lo){hi+=1;lo-=1}
  var n=pts.length,x=function(i){return px+(n>1?i*(W-2*px)/(n-1):(W-2*px)/2)},y=function(v){return py+(H-2*py)*(1-(v-lo)/(hi-lo))};
  var d='',last=null;
  pts.forEach(function(p,i){if(p.v==null)return;d+=(d?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)+' ';last={i:i,v:p.v}});
  var h='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  if(o.goal!=null)h+='<line x1="'+px+'" x2="'+(W-px)+'" y1="'+y(o.goal).toFixed(1)+'" y2="'+y(o.goal).toFixed(1)+'" stroke="#9aa3ae" stroke-width="1.5" stroke-dasharray="5 4"/>';
  if(o.floor!=null)h+='<line x1="'+px+'" x2="'+(W-px)+'" y1="'+y(o.floor).toFixed(1)+'" y2="'+y(o.floor).toFixed(1)+'" stroke="#c62828" stroke-width="1" stroke-dasharray="2 4" opacity=".7"/>';
  h+='<path d="'+d+'" fill="none" stroke="var(--series)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
  if(last)h+='<circle cx="'+x(last.i).toFixed(1)+'" cy="'+y(last.v).toFixed(1)+'" r="5" fill="var(--series)" stroke="#fff" stroke-width="2" vector-effect="non-scaling-stroke"/>';
  h+='</svg>';
  return h;
}
function barChart(pts,o){
  o=o||{};var W=o.w||300,H=o.h||90,py=6,gap=2;
  var hi=Math.max.apply(null,pts.map(function(p){return p.v||0}).concat([o.max||1]));
  var n=pts.length,bw=(W-gap*(n-1))/n;
  var h='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  pts.forEach(function(p,i){
    var v=p.v||0,bh=Math.max(v?3:0,(H-py)*v/hi),x0=i*(bw+gap);
    if(v)h+='<rect x="'+x0.toFixed(1)+'" y="'+(H-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="'+(p.hl?'var(--bad)':'var(--series)')+'"/>';
    else h+='<rect x="'+x0.toFixed(1)+'" y="'+(H-1.5)+'" width="'+bw.toFixed(1)+'" height="1.5" fill="#d7dbe1"/>';
  });
  h+='</svg>';
  return h;
}
function hbars(rows){
  return rows.map(function(r){
    var pct=r.max?Math.min(100,100*r.v/r.max):0,tick=r.max&&r.std!=null?Math.min(100,100*r.std/r.max):null;
    return '<div class="hb"><span class="l">'+esc(r.l)+'</span><span class="bar"><i class="'+(r.over?'over':'')+'" style="width:'+pct.toFixed(1)+'%"></i>'+(tick!=null?'<u style="left:'+tick.toFixed(1)+'%"></u>':'')+'</span><span class="v">'+esc(r.txt!=null?r.txt:num(r.v,2))+'</span></div>';
  }).join('');
}

// ---------- cards ----------
// Each card: {title, sub(small under title), status:'good'|'warn'|'bad'|null, label, hero:[big, unit], line, body(html), stale:date|null, missing:bool}
function badge(c){
  if(c.stale)return '<span class="badge b-stale">⏱ data from '+md(c.stale)+'</span>';
  if(c.missing)return '<span class="badge b-stale">⏱ not updated</span>';
  var m={good:['✓','On track'],warn:['▲','Watch'],bad:['✕','Action']}[c.status];
  return m?'<span class="badge b-'+c.status+'">'+m[0]+' '+esc(c.label||m[1])+'</span>':'';
}
function cardHtml(c){
  var cls='card'+(c.wide?' wide':'')+(c.stale||c.missing?' stale':(c.status?' '+c.status:''));
  var hero=c.hero?'<div class="hero"><b'+(String(c.hero[0]).length>4?' class="sm"':'')+'>'+esc(c.hero[0])+'</b>'+(c.hero[1]?'<span>'+esc(c.hero[1])+'</span>':'')+'</div>':'';
  return '<div class="'+cls+'"><div class="ch"><h3>'+esc(c.title)+(c.sub?'<small>'+esc(c.sub)+'</small>':'')+'</h3>'+badge(c)+'</div>'+hero+

// ---------- flow: SWI v2.0 sections in meeting order ----------
var SECTIONS=[
 {t:'Safety & Compliance',cards:['Falls','Grievances','Care Plan (POC) Compliance','PCC Forms Due']},
 {t:'Census & Admissions',cards:['Census','Admissions & Discharges','Admission Mini Packets','Medicare Day-4 Rates']},
 {t:'Clinical Highlights',cards:['Hospital Send-outs','Open Clinical & BO Lists','Leader Resident Rounds']},
 {t:'Staffing & Scheduling',cards:['Nursing Hours PPD','Overtime','Hours PPD by Dept']},
 {t:'Operational Updates',cards:['Floor Rounds & Environment','Google Rating']},
 {t:'Action Items & Escalations',cards:['Needs an Owner Today','Department Updates']}
];
var SEC_SECS=100;   // 10 minutes ÷ 6 sections
var ESC='Needs an Owner Today';
function kindOf(c){return c.stale||c.missing?'stale':c.status||'none'}
function cardBy(cards,t){return cards.filter(function(c){return c.title===t})[0]}
function secStatus(cards,i){
  var k=SECTIONS[i].cards.map(function(t){var c=cardBy(cards,t);return c?kindOf(c):'none'});
  return k.indexOf('bad')>=0?'bad':k.indexOf('warn')>=0?'warn':k.indexOf('stale')>=0?'stale':'good';
}
// Recap for the last section: everything red, then watch, then stale, with the section it came from.
function escalationCard(cards){
  var rank={bad:0,warn:1,stale:2},items=[];
  SECTIONS.slice(0,5).forEach(function(s){s.cards.forEach(function(t){
    var c=cardBy(cards,t),k=c&&kindOf(c);
    if(k in rank)items.push({k:k,t:t,s:s.t,l:k==='stale'?(c.stale?'data from '+md(c.stale):'not updated'):c.label});
  })});
  items.sort(function(a,b){return rank[a.k]-rank[b.k]});
  var nb=items.filter(function(i){return i.k==='bad'}).length,nw=items.filter(function(i){return i.k==='warn'}).length;
  return {title:ESC,sub:'red first, then watch, then stale feeds',status:nb?'bad':nw?'warn':'good',label:nb?nb+' need action':nw?nw+' to watch':'Nothing open',
    body:items.length?items.map(function(i){return '<div class="row k-'+i.k+(i.k==='bad'?' flag':'')+'"><span class="l"><span class="ei">'+({bad:'✕',warn:'▲',stale:'⏱'}[i.k])+'</span>'+esc(i.t)+'<small>'+esc(i.s)+'</small></span><span class="v">'+esc(i.l||'')+'</span></div>'}).join('')
      :'<div class="sub">Every section is on track.</div>'};
}
function stepsHtml(cards){
  return '<nav class="steps">'+SECTIONS.map(function(s,i){
    var st=secStatus(cards,i),on=i===S.sec;
    return '<button class="st'+(on?' on':'')+(i<S.sec?' done':'')+'" onclick="go('+i+')"><span class="num s-'+st+'">'+(i+1)+'</span><span class="t">'+esc(s.t)+
      (st==='bad'?' ✕':st==='warn'?' ▲':'')+'</span>'+(on?'<span class="et" id="secT"></span>':'')+'</button>'}).join('')+'</nav>';
}
function footHtml(){
  var nx=SECTIONS[S.sec+1];
  return '<div class="fb">'+(S.sec>0?'<button onclick="go('+(S.sec-1)+')">← '+esc(SECTIONS[S.sec-1].t)+'</button>':'')+
    '<span class="hint">← → or 1–6 to move · S timer · O all cards</span>'+
    (nx?'<button class="nx" onclick="go('+(S.sec+1)+')">Next: '+esc(nx.t)+' →</button>':'<button class="nx" onclick="toggleTimer()">'+(S.started?'End standup':'Start timer')+'</button>')+'</div>';
}
function go(i){
  if(i<0||i>=SECTIONS.length||i===S.sec)return;
  S.sec=i;if(S.started)S.secStart=Date.now();render();
}
function setView(v){S.view=v;ls('su_view',v);render()}

// ---------- render ----------
function headerKpis(cards){
  var stale=cards.filter(function(c){return c.stale||c.missing}).length,action=cards.filter(function(c){return !c.stale&&!c.missing&&c.status==='bad'}).length,watch=cards.filter(function(c){return !c.stale&&!c.missing&&c.status==='warn'}).length;
  var dept=cards.filter(function(c){return c.wide})[0],present=Object.keys(S.att).length;
  var k=function(v,l,cls){return '<div class="'+(cls||'')+'"><b>'+esc(v)+'</b><span>'+esc(l)+'</span></div>'};
  return k(action,'Need action',action?'bad':'')+k(watch,'Watch',watch?'warn':'')+k(stale,'Stale / not updated',stale?'warn':'')+k(dept?dept.label.replace(' complete',''):'—','Depts updated','')+k(present+'/'+ROSTER.length,'Present','');
}
function attHtml(){
  return '<div class="att"><span class="lbl">Attendance</span>'+ROSTER.map(function(p,i){
    var s=S.att[p.name];return '<button class="'+(s||'')+'" onclick="toggleAtt('+i+')" title="Tap: on time → late → absent">'+esc(p.name.split(' ')[0])+(s==='l'?' · late':'')+'</button>'}).join('')+
    '<span class="sp"></span><span class="hint">S timer · R refresh · rooms by room-bed only</span></div>';
}
function render(){
  var cards=buildCards(),flow=S.view==='flow',root=document.getElementById('root');
  cards.push(escalationCard(cards));
  var head='<header><div><h1>Morning Star Standup</h1><div class="sub">'+new Date(S.today+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+
    ' · refreshed '+(S.loadedAt?S.loadedAt.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'')+'</div></div>'+
    (flow?'<span class="sp"></span>':'<div class="hk">'+headerKpis(cards.filter(function(c){return c.title!==ESC}))+'</div>')+
    '<button class="vt" onclick="setView(\''+(flow?'all':'flow')+'\')">'+(flow?'All cards':'Section view')+'</button>'+
    '<div class="clock"><b id="clk"></b><span class="timer" id="tmr" onclick="toggleTimer()">▶ Start 10:00</span></div></header>';
  root.className=flow?'flow':'';
  if(flow){
    var sc=SECTIONS[S.sec].cards.map(function(t){return cardBy(cards,t)}).filter(Boolean);
    root.innerHTML=head+stepsHtml(cards)+(S.sec===0?attHtml():'')+'<main style="--n:'+sc.length+'">'+sc.map(cardHtml).join('')+'</main>'+footHtml();
  }else root.innerHTML=head+attHtml()+'<main>'+cards.filter(function(c){return c.title!==ESC}).map(cardHtml).join('')+'</main>';
  tick();
}

// ---------- timer / clock ----------
function toggleTimer(){S.started=S.started?null:Date.now();S.secStart=S.started;if(S.view==='flow')render();else tick()}
function tick(){
  var c=document.getElementById('clk');if(c)c.textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  var st=document.getElementById('secT');
  if(st){if(S.started&&S.secStart){var se=Math.floor((Date.now()-S.secStart)/1000);st.textContent=Math.floor(se/60)+':'+('0'+se%60).slice(-2);st.className='et'+(se>SEC_SECS?' over':'')}else st.textContent=''}
  var t=document.getElementById('tmr');if(!t)return;
  if(!S.started){t.textContent='▶ Start 10:00';t.className='timer';return}
  var el=Math.floor((Date.now()-S.started)/1000),left=600-el,a=Math.abs(left);
  t.textContent=(left<0?'+':'')+Math.floor(a/60)+':'+('0'+a%60).slice(-2);
  t.className='timer'+(left<0?' over':'');
}

// ---------- attendance ----------
var attTimer=null;
function toggleAtt(i){
  var n=ROSTER[i].name,s=S.att[n];
  if(!s)S.att[n]='p';else if(s==='p')S.att[n]='l';else delete S.att[n];
  render();clearTimeout(attTimer);attTimer=setTimeout(saveAtt,1200);
}
async function saveAtt(){
  S.busy=true;
  var present=[],late=[];Object.keys(S.att).forEach(function(n){(S.att[n]==='p'?present:late).push(n)});
  var data={present:present,late:late};
  try{
    if(S.attId)await rpc('standup_update',{p_pin:S.pin,p_id:S.attId,p_room:null,p_bed:null,p_data:data,p_name:'Standup screen',p_role:'Administrator'});
    else{await rpc('standup_submit',{p_pin:S.pin,p_tab_key:'attendance',p_room:null,p_bed:null,p_data:data,p_name:'Standup screen',p_role:'Administrator',p_entry_date:null});await load()}
  }catch(e){if(e.message!=='bad_pin')alert('Attendance not saved: '+e.message)}
  finally{S.busy=false}
}

document.addEventListener('keydown',function(e){
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  if(e.key==='s'||e.key==='S')toggleTimer();
  else if(e.key==='r'||e.key==='R')load().then(render);
  else if(e.key==='o'||e.key==='O')setView(S.view==='flow'?'all':'flow');
  else if(S.view==='flow'&&(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')){e.preventDefault();go(S.sec+1)}
  else if(S.view==='flow'&&(e.key==='ArrowLeft'||e.key==='PageUp')){e.preventDefault();go(S.sec-1)}
  else if(S.view==='flow'&&e.key>='1'&&e.key<='6')go(+e.key-1);
});

(async function(){
  S.pin=ls('su_pin');
  if(!S.pin)return showPin();
  try{await boot()}catch(e){if(e.message!=='bad_pin')document.getElementById('root').innerHTML='<div class="pinbox">Could not load. Check the connection and refresh.<div class="err">'+esc(e.message)+'</div></div>'}
})();
</script>
