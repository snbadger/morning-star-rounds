<style>
/* One-page card grid for a 65" TV at 10–15 ft (1920×1080). QAPI-dashboard look: white cards on grey,
   large type, status by color + icon + word (never color alone), grey + clock when the data is stale. */
:root{--bg:#eef0f3;--card:#fff;--text:#1d1d1f;--muted:#5c6470;--line:#e2e5ea;--navy:#052b49;--gold:#cf8c2a;
 --series:#2d6cb5;--good:#1f8a5b;--good-bg:#e6f4ec;--warn:#b35900;--warn-bg:#fdf0dd;--bad:#c62828;--bad-bg:#fde8e8;
 --stale:#6b7280;--stale-bg:#eceef1;--radius:18px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
#root{height:100vh;display:flex;flex-direction:column}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:20px;overflow:hidden}
header{height:84px;background:var(--navy);color:#fff;padding:0 28px;display:flex;align-items:center;gap:28px}
header h1{font-size:30px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
header .sub{font-size:17px;opacity:.78;margin-top:2px}
.hk{display:flex;gap:12px;flex:1;justify-content:center}
.hk div{background:rgba(255,255,255,.1);border-radius:12px;padding:6px 18px;text-align:center;min-width:140px}
.hk b{display:block;font-size:30px;font-weight:800;line-height:1.05}
.hk span{font-size:13px;letter-spacing:.5px;text-transform:uppercase;opacity:.8}
.hk .bad{background:rgba(255,99,99,.32)}.hk .warn{background:rgba(207,140,42,.38)}
.clock{text-align:right;white-space:nowrap}
.clock b{font-size:34px;font-weight:800;display:block;line-height:1}
.timer{font-size:16px;opacity:.85;cursor:pointer;font-variant-numeric:tabular-nums}
.timer.over{color:#ffb4ab;opacity:1}
.att{height:46px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;padding:0 28px;overflow:hidden}
.att .lbl{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-right:8px}
.att button{border:1.5px solid var(--line);background:#fff;color:var(--muted);font:inherit;font-size:15px;font-weight:600;padding:4px 12px;border-radius:18px;cursor:pointer;white-space:nowrap}
.att button.p{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.att button.l{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.att .sp{flex:1}.att .hint{font-size:13px;color:var(--muted)}
main{flex:1;min-height:0;padding:16px 28px 18px;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:1fr;gap:14px}
.card{background:var(--card);border-radius:var(--radius);padding:14px 18px 12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-top:8px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.card.good{border-top-color:var(--good)}.card.warn{border-top-color:var(--warn)}.card.bad{border-top-color:var(--bad)}
.card.stale{border-top-color:var(--stale);background:#f6f7f9}
.card.stale .hero,.card.stale .chart{opacity:.55}
.card.wide{grid-column:span 2}
/* week grid (leader rounds, floor rounds): M–F cells, green = done, red = missed, MTD % of weekdays */
.wg{display:grid;grid-template-columns:minmax(0,1fr) repeat(5,30px) 52px;gap:3px 6px;align-items:center;font-size:15px;margin-top:6px}
.wg .h{font-size:12px;color:var(--muted);text-align:center;font-weight:700}.wg .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.wg .c{height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.wg .y{background:var(--good-bg);color:var(--good)}.wg .x{background:var(--bad-bg);color:var(--bad)}.wg .f{background:#f1f3f6}.wg .p{text-align:right;font-weight:700}
.flow .wg{font-size:19px;grid-template-columns:minmax(0,1fr) repeat(5,40px) 64px}.flow .wg .c{height:32px}
/* per-role run charts (PCC forms) */
.pr .v.bad{color:var(--bad)}.pr{display:grid;grid-template-columns:86px 1fr 64px;gap:4px 10px;align-items:center;font-size:15px}.pr .v{text-align:right;font-weight:700}.pr svg{width:100%;height:28px;display:block}
.flow .pr{font-size:19px;grid-template-columns:110px 1fr 80px}.flow .pr svg{height:36px}
/* two-column card (Census): headline + chart on the left, lists on the right */
.card.twocol{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto 1fr auto;column-gap:28px}
.card.twocol .ch{grid-column:1/-1}.par .hb,.flow .par .hb{grid-template-columns:minmax(0,170px) 1fr 100px;padding:3px 0}.twocol .rows .chart,.flow .twocol .rows .chart{flex:none;height:96px;margin-top:4px}.par .hb .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card.twocol .rows{grid-column:2;grid-row:2/6;margin-top:0}.card.twocol .chart{min-height:160px}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ch h3{font-size:19px;font-weight:700;color:var(--muted);line-height:1.15}
.ch h3 small{display:block;font-size:13px;font-weight:600;color:#8a93a0;margin-top:2px}
.badge{font-size:14px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap;line-height:1.1}
.b-good{background:var(--good-bg);color:var(--good)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-stale{background:var(--stale-bg);color:var(--stale)}.b-none{background:#eef0f3;color:var(--muted)}
.hero{display:flex;align-items:baseline;gap:10px;margin-top:6px;flex-wrap:wrap}
.hero b{font-size:60px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.hero b.sm{font-size:44px}
.hero span{font-size:19px;color:var(--muted);font-weight:600}
.sub{font-size:17px;color:var(--muted);margin-top:4px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{flex:1;min-height:0;margin-top:6px;display:flex;align-items:flex-end}
.chart svg{width:100%;height:100%;display:block}
.dc{width:100%;align-self:stretch;display:flex;flex-direction:column;padding-bottom:14px}
.dp{position:relative;flex:1;min-height:0}.dp svg{position:absolute;inset:0}
.vd{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--series);border:2px solid #fff;transform:translate(-50%,-50%)}
.vl{position:absolute;transform:translate(-50%,-140%);font-size:13px;font-weight:700;display:none}.vl.last{display:block}
.dl{position:relative;height:18px;font-size:12px;color:var(--muted);margin-top:4px}.dl span{position:absolute;transform:translateX(-50%);white-space:nowrap}
#root:not(.flow) .dl span:nth-last-child(even){visibility:hidden}
.rows{margin-top:6px;overflow:hidden;flex:1;min-height:0}
.row{display:flex;justify-content:space-between;gap:8px;font-size:17px;padding:3px 0;border-top:1px solid #f0f2f5;line-height:1.25}
.row:first-child{border-top:0}
.row .l{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .v{font-weight:700;white-space:nowrap}
.row.flag .v,.row.flag .l{color:var(--bad)}
.hb{display:grid;grid-template-columns:118px 1fr 54px;align-items:center;gap:8px;font-size:16px;padding:3px 0}
.hb .l{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .bar{height:12px;background:#eef0f3;border-radius:6px;position:relative;overflow:visible}
.hb .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--series)}
.hb .bar i.over{background:var(--bad)}
.hb .bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.6}
.hb .v{font-weight:700;text-align:right}
.dept{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 12px;margin-top:8px;overflow-y:auto;flex:1;min-height:0;align-content:start}
.dept .d{display:flex;align-items:center;gap:7px;font-size:16px;padding:4px 0;border-bottom:1px solid #f0f2f5;min-width:0}
.dept .ic{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0}
.dept .ok .ic{background:var(--good-bg);color:var(--good)}.dept .miss .ic{background:var(--stale-bg);color:var(--stale)}.dept .part .ic{background:var(--warn-bg);color:var(--warn)}
.dept .n{font-weight:700;white-space:nowrap}.dept .r{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dept .miss .n{color:var(--stale)}
.dept .d{cursor:pointer}.dept .d.open{background:#f3f5f8;border-radius:8px}
.dtasks{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr);gap:2px 16px;padding:6px 10px 8px;background:#f8f9fb;border-radius:10px;margin:2px 0 6px}
.dtasks .dt{display:flex;align-items:center;gap:7px;font-size:14px;padding:3px 0;min-width:0}
.dtasks .ic{width:20px;height:20px;font-size:12px}
.dtasks .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dtasks .miss .l{color:var(--stale)}
.dtasks .r{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.foot{position:absolute;right:16px;bottom:8px;font-size:12px;color:#9aa3ae}
.sp{flex:1}
/* Flow view: the SWI's six sections one at a time, in meeting order (← → / 1–6 / clicker PageUp-PageDown). */
.steps{display:flex;gap:8px;padding:12px 28px 0}
.steps .st{flex:1;display:flex;align-items:center;gap:10px;border:0;background:#fff;border-radius:14px;padding:10px 14px;font:inherit;color:var(--muted);cursor:pointer;text-align:left;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.steps .st.done{opacity:.55}
.steps .st.on{background:var(--navy);color:#fff}
.steps .num{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;background:var(--stale-bg);color:var(--stale)}
.steps .s-good{background:var(--good-bg);color:var(--good)}.steps .s-warn{background:var(--warn-bg);color:var(--warn)}.steps .s-bad{background:var(--bad-bg);color:var(--bad)}
.steps .t{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.steps .et{font-size:16px;font-variant-numeric:tabular-nums;opacity:.85}.steps .et.over{color:#ffb4ab;opacity:1}
.flow main{grid-template-columns:repeat(var(--n),1fr);grid-auto-rows:1fr;gap:20px;padding:16px 28px}
.flow .card{padding:22px 26px 18px;border-top-width:10px}
.flow .card.wide{grid-column:auto}
.flow .ch h3{font-size:26px;color:var(--text)}.flow .ch h3 small{font-size:16px}
.flow .badge{font-size:17px;padding:6px 14px}
.flow .hero b{font-size:104px}.flow .hero b.sm{font-size:76px}.flow .hero span{font-size:23px}
.flow .sub{font-size:21px;white-space:normal}
.flow .row{font-size:21px;padding:6px 0}
.flow .hb{font-size:20px;grid-template-columns:170px 1fr 70px;padding:6px 0}.flow .hb .bar{height:16px}
.flow .dept{grid-template-columns:repeat(2,1fr)}.flow .dept .d{font-size:19px;padding:6px 0}
.flow .foot{font-size:14px}
.flow .chart{flex:0 1 240px;margin-top:18px}
.flow .vl{display:block;font-size:17px}.flow .dl{height:24px;font-size:15px}
.row .ei{display:inline-block;width:1.4em;font-weight:800}.row.k-warn .ei{color:var(--warn)}.row.k-stale .ei,.row.k-stale .v{color:var(--stale)}
.row small{color:var(--muted);font-size:.75em;font-weight:600;margin-left:6px}
.rows.split{display:flex;flex-direction:column}.split .blk{flex:1;min-height:0;overflow:hidden}
.blk+.blk{border-top:2px solid var(--line);margin-top:8px;padding-top:10px}
.bh{display:flex;align-items:baseline;gap:10px;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--navy);margin-bottom:4px}
.bh b{font-size:44px;letter-spacing:-1px;color:var(--text)}.bh small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;text-transform:none}
.bh2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-top:10px;padding-top:8px;border-top:2px solid var(--line)}
.more{font-size:14px;color:var(--muted);padding-top:2px}
.flow .bh{font-size:20px}.flow .bh b{font-size:72px}.flow .bh small{font-size:16px}.flow .bh2{font-size:16px}.flow .more{font-size:17px}
.fb{height:56px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 28px 12px}
.fb button{border:0;background:none;font:inherit;font-size:18px;font-weight:700;color:var(--navy);cursor:pointer;padding:8px 4px}
.fb button.nx{margin-left:auto;background:var(--navy);color:#fff;border-radius:12px;padding:10px 22px}
.fb .hint{font-size:14px;color:var(--muted)}
.vt{background:rgba(255,255,255,.12);border:0;color:#fff;font:inherit;font-size:14px;font-weight:700;padding:6px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.pinbox{max-width:360px;margin:12vh auto;background:#fff;border-radius:14px;padding:26px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.pinbox input{width:100%;font-size:24px;letter-spacing:5px;text-align:center;padding:10px;border:1.5px solid var(--line);border-radius:10px;margin:14px 0}
.pinbox button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.err{color:var(--bad);font-size:13px;margin-top:8px}
@media (max-width:1500px){main{grid-template-columns:repeat(4,1fr)}.hero b{font-size:48px}.flow .hero b{font-size:80px}.flow .hero b.sm{font-size:60px}.steps .t{font-size:15px}}
@media (max-width:1000px){body{overflow:auto}#root{height:auto;min-height:100vh}.flow main{grid-template-columns:1fr;grid-auto-rows:minmax(300px,auto)}.steps{flex-wrap:wrap}.steps .st{flex:1 1 30%}main{height:auto;grid-template-columns:repeat(2,1fr);grid-auto-rows:260px}.card.wide{grid-column:span 2}header{height:auto;padding:12px 16px;flex-wrap:wrap}.hk{order:3;width:100%}.att{height:auto;flex-wrap:wrap;padding:8px 16px}}
@media (max-width:600px){main{grid-template-columns:1fr}.card.wide{grid-column:span 1}}
</style>
<style>
/* ms-ui look (11/4/26): screen tokens mapped onto ms-ui; hairline cards, status icon tiles, Lucide badges.
   TV type sizes unchanged. Status ink stays the darker screen greens/reds for contrast at 10–15 ft. */
:root{--bg:var(--background);--text:var(--foreground);--line:var(--border);--navy:var(--ms-navy);--radius:var(--radius-lg)}
body{font-family:var(--font);background:var(--bg)}
header{background:linear-gradient(180deg,#0a3558 0%,var(--ms-navy) 100%);border-bottom:3px solid var(--ms-gold);height:88px}
header h1{letter-spacing:-.5px}
.hk div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:var(--radius)}
.hk .bad{background:rgba(198,40,40,.38);border-color:rgba(255,140,140,.5)}.hk .warn{background:rgba(207,140,42,.34);border-color:rgba(240,190,110,.5)}
.vt{border:1px solid rgba(255,255,255,.22);border-radius:var(--radius-pill);padding:7px 16px;display:inline-flex;align-items:center;gap:6px}
.att{background:var(--card);border-bottom:1px solid var(--border)}
.att button{border:1px solid var(--border);border-radius:var(--radius-pill);background:var(--card)}
.card{border:1px solid var(--border);border-top:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:14px 18px 12px}
.card.bad{border-color:#f0b4b4;box-shadow:0 0 0 1px #f0b4b4,var(--shadow-sm)}
.card.warn{border-color:#f1d3a6}
.card.good,.card.warn,.card.bad,.card.stale{border-top-width:1px}.card.good{border-top-color:var(--border)}.card.warn{border-top-color:#f1d3a6}.card.bad{border-top-color:#f0b4b4}.card.stale{border-top-color:var(--border);background:#f7f8fa}
.flow .card{border-top-width:1px;padding:22px 26px 18px}
.ch{align-items:center;flex-wrap:wrap;row-gap:6px}
.ch .ti{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 300px}
.ch .ti h3{min-width:0}
/* all-cards view: 19 narrow cards on one screen — no tile, badge beside the title, as on the live screen */
#root:not(.flow) .ch{flex-wrap:nowrap;align-items:flex-start}#root:not(.flow) .ch .ti{flex:1 1 auto}
#root:not(.flow) .ch .ic2{display:none}
.ch .ic2{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--secondary);color:var(--ms-navy)}
.ch .ic2 svg{width:22px;height:22px;stroke-width:2.2}
.card.good .ic2{background:var(--good-bg);color:var(--good)}.card.warn .ic2{background:var(--warn-bg);color:var(--warn)}.card.bad .ic2{background:var(--bad-bg);color:var(--bad)}.card.stale .ic2{background:var(--stale-bg);color:var(--stale)}
.flow .ch .ic2{width:54px;height:54px;border-radius:16px}.flow .ch .ic2 svg{width:30px;height:30px}
html.no-icons .ch .ic2{display:none}
.ch h3{color:var(--foreground);font-weight:700}
.ch h3 small{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:var(--radius-pill)}
.badge svg{width:16px;height:16px;stroke-width:2.6}.flow .badge svg{width:20px;height:20px}
.b-good{border-color:#bfe3cf}.b-warn{border-color:#f1d3a6}.b-bad{border-color:#f0b4b4}.b-stale{border-color:#d9dde3}
.row{align-items:baseline;border-top:1px solid #eef1f4}
.bh2{border-top:1px solid var(--border);color:var(--muted)}
.blk+.blk{border-top:1px solid var(--border)}
.wg .c{border-radius:8px}
.steps .st{border:1px solid var(--border);box-shadow:none;border-radius:var(--radius)}
.steps .st.on{background:var(--ms-navy);border-color:var(--ms-navy)}
.fb button.nx{border-radius:var(--radius-pill);padding:10px 24px}
.pinbox{border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)}
.pinbox input{border:1px solid var(--input);border-radius:var(--radius)}
.pinbox button{border-radius:var(--radius-pill)}
/* Repairs & Room Changes: department chips — ✓ green when the department's tasks are all done, ✕ red when not */
.rc{padding:5px 0;border-top:1px solid #eef1f4}.rc:first-child{border-top:0}
.rc .top{display:flex;justify-content:space-between;gap:8px;font-size:17px;font-weight:600}.rc .top .v{font-weight:700;white-space:nowrap}
.rc .top small{color:var(--muted);font-size:.75em;font-weight:600;margin-left:6px}
.dks{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}

.flow .rc{padding:8px 0}.flow .rc .top{font-size:21px}.flow .dk{font-size:16px;padding:3px 11px}
</style>

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function md(d){if(!d)return '';var p=String(d).slice(0,10).split('-');return (+p[1])+'/'+(+p[2])}
function addDays(d,n){var x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function num(v,dp){return v==null||isNaN(v)?'—':(+v).toFixed(dp==null?0:dp)}
function pastDeadline(){var n=new Date(),h=n.getHours()*60+n.getMinutes();return h>=9*60+15}
async function rpc(fn,args){
  if(!sb)throw new Error('offline');
  var r=await sb.rpc(fn,args);
  if(r.error){if(String(r.error.message).indexOf('bad_pin')>=0){ls('su_pin',null);S.pin=null;showPin('That PIN did not work.');throw new Error('bad_pin')}throw new Error(r.error.message)}
  return r.data;
}

// ---------- start ----------
function showPin(msg){
  document.getElementById('root').innerHTML='<div class="pinbox"><div style="font-size:20px;font-weight:800;color:var(--navy)">Standup Screen</div>'+
    '<div style="font-size:14px;color:var(--muted);margin-top:6px">Leadership PIN</div>'+
    '<input id="pinIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><button onclick="submitPin()">Open</button>'+(msg?'<div class="err">'+esc(msg)+'</div>':'')+'</div>';
  var i=document.getElementById('pinIn');i.focus();i.onkeydown=function(e){if(e.key==='Enter')submitPin()};
}
async function submitPin(){
  var v=document.getElementById('pinIn').value.trim();if(!v)return;
  try{await rpc('standup_bootstrap',{p_pin:v});ls('su_pin',v);S.pin=v;await boot()}catch(e){if(e.message!=='bad_pin')showPin('Could not connect: '+e.message)}
}
async function boot(){
  var b=await rpc('standup_bootstrap',{p_pin:S.pin});
  S.tabs=b.tabs;S.today=b.today;S.byKey={};S.tabs.forEach(function(t){S.byKey[t.tab_key]=t});
  await load();render();
  setInterval(poll,60000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&(!S.loadedAt||Date.now()-S.loadedAt>60000))poll()});
  setInterval(tick,1000);
}
// one call at a time, never while hidden, and not overnight (8 PM–5 AM) — a stacked-up poll stalled the database 10/23
function poll(){
  var h=new Date().getHours();
  if(S.busy||S.polling||document.hidden||h>=20||h<5)return;
  S.polling=true;
  load().then(render).catch(function(){}).then(function(){S.polling=false});
}
async function load(){
  var r=await Promise.all([rpc('standup_today',{p_pin:S.pin,p_date:null}),rpc('standup_live',{p_pin:S.pin}),
    rpc('trips_board',{p_key:S.pin,p_days:7}).catch(function(){return null}),
    rpc('admits_board',{p_key:S.pin,p_days:7}).catch(function(){return null})]);
  S.day=r[0];S.live=r[1];S.trips=r[2];S.admits=r[3];S.loadedAt=new Date();
  var a=(S.day.entries||[]).filter(function(e){return e.tab_key==='attendance'})[0];
  S.att={};S.attId=a?a.id:null;
  if(a){(a.data.present||[]).forEach(function(n){S.att[n]='p'});(a.data.late||[]).forEach(function(n){S.att[n]='l'})}
}

// ---------- data helpers ----------
function auto(k){return S.live&&S.live.auto&&S.live.auto[k]}
function trends(){return (S.live&&S.live.auto&&S.live.auto._trends)||{}}
function cov(k){return (S.day&&S.day.coverage&&S.day.coverage[k])||{}}
function entries(k){return ((S.day&&S.day.entries)||[]).filter(function(e){return e.tab_key===k&&e.status!=='closed'})}
function rowsOf(k){var a=auto(k);return a?(a.rows||[]).filter(function(r){return r.status!=='done'}):[]}
// A feed is stale when its as_of is older than the tab's cadence allows (daily feeds may be from yesterday).
// STRICT feeds carry the data date (not the run date) and must be from today: the HIM workbook's PCC forms row.
var STRICT={uda_overdue:1};
function staleDate(k){
  var a=auto(k),t=S.byKey[k];if(!a||!a.as_of)return null;
  var grace=STRICT[k]?0:({weekly:7,monthly:31}[t&&t.cadence]||1);
  return a.as_of<addDays(S.today,-grace)?a.as_of:null;
}
// Manual tab freshness: covered today (entered or marked nothing-to-report) within its cadence window.
function covered(k){var c=cov(k);return c.status==='entered'||c.status==='nothing'||(c.today_entries||0)>0}
function leadNum(s){var m=String(s||'').match(/-?\d+(\.\d+)?/);return m?+m[0]:null}

// ---------- tiny SVG charts (single series, one axis, goal line as reference) ----------
function lineChart(pts,o){
  o=o||{};var W=o.w||300,H=o.h||90,px=4,py=10;
  var vals=pts.map(function(p){return p.v}).filter(function(v){return v!=null});
  if(!vals.length)return '<div class="sub">No history yet</div>';
  var lo=Math.min.apply(null,vals.concat(o.goal!=null?[o.goal]:[])),hi=Math.max.apply(null,vals.concat(o.goal!=null?[o.goal]:[]));
  if(o.min!=null)lo=Math.min(lo,o.min);if(o.max!=null)hi=Math.max(hi,o.max);
  if(hi===lo){hi+=1;lo-=1}
  var n=pts.length,x=function(i){return px+(n>1?i*(W-2*px)/(n-1):(W-2*px)/2)},y=function(v){return py+(H-2*py)*(1-(v-lo)/(hi-lo))};
  var d='',last=null;
  pts.forEach(function(p,i){if(p.v==null)return;d+=(d?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)+' ';last={i:i,v:p.v}});
  var h='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  if(o.goal!=null)h+='<line x1="'+px+'" x2="'+(W-px)+'" y1="'+y(o.goal).toFixed(1)+'" y2="'+y(o.goal).toFixed(1)+'" stroke="#9aa3ae" stroke-width="1.5" stroke-dasharray="5 4"/>';
  if(o.floor!=null)h+='<line x1="'+px+'" x2="'+(W-px)+'" y1="'+y(o.floor).toFixed(1)+'" y2="'+y(o.floor).toFixed(1)+'" stroke="#c62828" stroke-width="1" stroke-dasharray="2 4" opacity=".7"/>';
  h+='<path d="'+d+'" fill="none" stroke="var(--series)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
  if(last)h+='<circle cx="'+x(last.i).toFixed(1)+'" cy="'+y(last.v).toFixed(1)+'" r="5" fill="var(--series)" stroke="#fff" stroke-width="2" vector-effect="non-scaling-stroke"/>';
  h+='</svg>';
  return h;
}
// Line with the count above each point and its date underneath (labels are HTML so the stretched SVG doesn't distort them).
function datedLine(pts,o){
  o=o||{};var W=300,H=100,px=18,py=18;
  var vals=pts.map(function(p){return p.v}).concat(o.ref||[]).filter(function(v){return v!=null});
  if(!vals.length)return '<div class="sub">No history yet</div>';
  var lo=Math.min.apply(null,vals.concat(o.goal!=null?[o.goal]:[])),hi=Math.max.apply(null,vals.concat(o.goal!=null?[o.goal]:[]));
  if(o.min!=null)lo=Math.min(lo,o.min);if(o.max!=null)hi=Math.max(hi,o.max);
  if(hi===lo){hi+=1;lo-=1}
  var n=pts.length,x=function(i){return px+(n>1?i*(W-2*px)/(n-1):(W-2*px)/2)},y=function(v){return py+(H-2*py)*(1-(v-lo)/(hi-lo))};
  var xp=function(i){return (100*x(i)/W).toFixed(2)+'%'},yp=function(v){return (100*y(v)/H).toFixed(2)+'%'};
  var d='',lastI=-1;pts.forEach(function(p,i){if(p.v==null)return;d+=(d?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)+' ';lastI=i});
  var h='<div class="dc"><div class="dp"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  if(o.goal!=null)h+='<line x1="0" x2="'+W+'" y1="'+y(o.goal).toFixed(1)+'" y2="'+y(o.goal).toFixed(1)+'" stroke="#9aa3ae" stroke-width="1.5" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>';
  if(o.ref){var rd='';o.ref.forEach(function(v,i){if(v==null)return;rd+=(rd?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '});
    h+='<path d="'+rd+'" fill="none" stroke="#9aa3ae" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'}
  h+='<path d="'+d+'" fill="none" stroke="var(--series)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
  pts.forEach(function(p,i){if(p.v==null)return;
    h+='<span class="vd" style="left:'+xp(i)+';top:'+yp(p.v)+'"></span><span class="vl'+(i===lastI?' last':'')+'" style="left:'+xp(i)+';top:'+yp(p.v)+'">'+esc(p.v)+'</span>'});
  h+='</div><div class="dl">'+pts.map(function(p,i){return '<span style="left:'+xp(i)+'">'+(i===0||String(p.d).slice(8)==='01'?md(p.d):+String(p.d).slice(8))+'</span>'}).join('')+'</div></div>';
  return h;
}
// Falls: one stacked bar per day by shift (AM dark → NOC light), injury / send-out falls drawn red on top; date under each bar.
function shiftBars(pts){
  var W=300,H=90,gap=3,n=pts.length||1,bw=(W-gap*(n-1))/n,tot=function(p){return (p.am||0)+(p.pm||0)+(p.noc||0)+(p.unk||0)};
  var hi=Math.max.apply(null,pts.map(tot).concat([2])),col={am:'#1f4e8c',pm:'#5b8fd6',noc:'#a9c4ec',unk:'#c9ced6'};
  var h='<div class="dc"><div class="dp"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  pts.forEach(function(p,i){var x0=i*(bw+gap),t=tot(p),y=H,u=(H-6)/hi;
    if(!t){h+='<rect x="'+x0.toFixed(1)+'" y="'+(H-1.5)+'" width="'+bw.toFixed(1)+'" height="1.5" fill="#d7dbe1"/>';return}
    var red=Math.min(p.inj||0,t),left=t-red;
    ['am','pm','noc','unk'].forEach(function(k){var v=Math.min(p[k]||0,left);if(!v)return;left-=v;y-=v*u;h+='<rect x="'+x0.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(v*u).toFixed(1)+'" fill="'+col[k]+'"/>'});
    if(red){y-=red*u;h+='<rect x="'+x0.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(red*u).toFixed(1)+'" fill="var(--bad)"/>'}});
  h+='</svg></div><div class="dl">'+pts.map(function(p,i){return '<span style="left:'+(100*(i*(bw+gap)+bw/2)/W).toFixed(2)+'%">'+(i===0||String(p.d).slice(8,10)==='01'?md(p.d):+String(p.d).slice(8,10))+'</span>'}).join('')+'</div></div>';
  return h;
}
// Two-line sparkline (due solid red, in progress dotted grey) for the PCC forms run charts.
function spark2(a,b){
  var W=120,H=28,n=a.length,hi=Math.max.apply(null,a.concat(b).concat([1])),x=function(i){return n>1?i*W/(n-1):W/2},y=function(v){return H-2-(H-4)*v/hi};
  var line=function(v,st){return '<polyline fill="none" points="'+v.map(function(q,i){return x(i).toFixed(1)+','+y(q).toFixed(1)}).join(' ')+'" '+st+' vector-effect="non-scaling-stroke"/>'};
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+line(b,'stroke="#9aa3ae" stroke-width="2" stroke-dasharray="2 3"')+line(a,'stroke="var(--bad)" stroke-width="2.5"')+'</svg>';
}
// Current week Mon–Fri and month-to-date % of weekdays (today counts once done).
function weekDays(){var dow=(new Date(S.today+'T12:00:00').getDay()+6)%7,mon=addDays(S.today,-dow);return [0,1,2,3,4].map(function(i){return addDays(mon,i)})}
function mtdPct(days){var n=0,hit=0,d=S.today.slice(0,8)+'01';while(d<=S.today){var w=new Date(d+'T12:00:00').getDay(),on=days.indexOf(d)>=0;if(w>0&&w<6&&(d<S.today||on)){n++;if(on)hit++}d=addDays(d,1)}return n?Math.round(100*hit/n):null}
function weekGrid(rows){
  var wk=weekDays();
  return '<div class="wg"><span></span>'+['M','T','W','Th','F'].map(function(l){return '<span class="h">'+l+'</span>'}).join('')+'<span class="h">MTD</span>'+
    rows.map(function(r){var p=mtdPct(r.days);return '<span class="n">'+esc(r.name)+'</span>'+wk.map(function(d){var y=r.days.indexOf(d)>=0;return '<span class="c '+(y?'y':d<S.today?'x':'f')+'">'+(y?'✓':d<S.today?'✕':'')+'</span>'}).join('')+
      '<span class="p">'+(p==null?'—':p+'%')+'</span>'}).join('')+'</div>';
}
function barChart(pts,o){
  o=o||{};var W=o.w||300,H=o.h||90,py=6,gap=2;
  var hi=Math.max.apply(null,pts.map(function(p){return p.v||0}).concat([o.max||1]));
  var n=pts.length,bw=(W-gap*(n-1))/n;
  var h='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  pts.forEach(function(p,i){
    var v=p.v||0,bh=Math.max(v?3:0,(H-py)*v/hi),x0=i*(bw+gap);
    if(v)h+='<rect x="'+x0.toFixed(1)+'" y="'+(H-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="'+(p.hl?'var(--bad)':'var(--series)')+'"/>';
    else h+='<rect x="'+x0.toFixed(1)+'" y="'+(H-1.5)+'" width="'+bw.toFixed(1)+'" height="1.5" fill="#d7dbe1"/>';
  });
  h+='</svg>';
  return h;
}
function hbars(rows){
  return rows.map(function(r){
    var pct=r.max?Math.min(100,100*r.v/r.max):0,tick=r.max&&r.std!=null?Math.min(100,100*r.std/r.max):null;
    return '<div class="hb"><span class="l">'+esc(r.l)+'</span><span class="bar"><i class="'+(r.over?'over':'')+'" style="width:'+pct.toFixed(1)+'%"></i>'+(tick!=null?'<u style="left:'+tick.toFixed(1)+'%"></u>':'')+'</span><span class="v">'+esc(r.txt!=null?r.txt:num(r.v,2))+'</span></div>';
  }).join('');
}

// ---------- cards ----------
// Each card: {title, sub(small under title), status:'good'|'warn'|'bad'|null, label, hero:[big, unit], line, body(html), stale:date|null, missing:bool}
function badge(c){
  if(c.stale)return '<span class="badge b-stale"><i data-lucide="clock"></i>data from '+md(c.stale)+'</span>';
  if(c.missing)return '<span class="badge b-stale"><i data-lucide="clock"></i>not updated</span>';
  var m={good:['circle-check','On track'],warn:['triangle-alert','Watch'],bad:['circle-x','Action']}[c.status];
  return m?'<span class="badge b-'+c.status+'"><i data-lucide="'+m[0]+'"></i>'+esc(c.label||m[1])+'</span>':'';
}

function statusBy(v,good,warn,higherIsBetter){
  if(v==null)return null;
  if(higherIsBetter)return v>=good?'good':v>=warn?'warn':'bad';
  return v<=good?'good':v<=warn?'warn':'bad';
}

function buildCards(){
  var L=S.live||{},T=trends(),cards=[];
  var cen=L.census_now||(L.census||[])[0]||{},mtd=L.census_mtd||{},bud=L.budget_adc||T.budget_adc;
  var day7=addDays(S.today,-7),day30=addDays(S.today,-30);

  // 1 Census — ADC vs budget (SQCDP C)
  var cser=(T.census||[]).slice(-14);
  var adcDelta=bud!=null&&mtd.avg_total!=null?mtd.avg_total-bud:null;
  // Bed holds (24-hr report leave list, else census board watch list) and Randy's referral data (Standup Log #22).
  // Name code (11/4, Stephen): first 3 letters of last name + first initial, e.g. SMIJ, next to the room-bed on bed holds,
  // MTD admits/discharges and falls — leadership PIN screen only (standup_resident_codes). Shown only when the feed has one.
  var cenBody=function(cen){
    var bh=cen.bed_holds||[],rf=auto('referrals')||{},rfm=rf.mtd||{},rser=rf.series||[],rlast=rser[rser.length-1]||{},rgoal=rf.goal_minutes||10;
    var rsn=rf.reasons||[],rtot=rsn.reduce(function(a,x){return a+x.n},0),rcum=0;
    return '<div class="bh2">Bed holds · '+bh.length+'</div>'+(bh.length?bh.map(function(h){return '<div class="row'+(h.day>=6?' flag':'')+'"><span class="l">Rm '+esc(h.room||'—')+(h.code?' · '+esc(h.code):'')+(h.hospital?'<small>'+esc(h.hospital)+'</small>':'')+'</span><span class="v">day '+(h.day!=null?h.day:'?')+' of 7</span></div>'}).join(''):'<div class="sub">None</div>')+
      '<div class="bh2">Referrals · Randy</div><div class="row'+(rlast.min>20?' flag':'')+'"><span class="l">Response time'+(rlast.d?' '+md(rlast.d):'')+'<small>goal under '+rgoal+' · MTD avg '+num(rfm.avg_minutes)+'</small></span><span class="v">'+num(rlast.min)+' min</span></div>'+
      '<div class="row"><span class="l">MTD</span><span class="v">'+num(rfm.refs)+' referrals · '+num(rfm.accepted)+' accepted · '+num(rfm.admitted)+' admitted</span></div>'+
      (rser.length>1?'<div class="chart">'+datedLine(rser.map(function(p){return {d:p.d,v:p.min}}),{goal:rgoal,min:0})+'</div>':'')+
      (rtot?'<div class="bh2">Denial reasons MTD · '+rtot+' · cumulative %</div><div class="par">'+hbars(rsn.slice(0,4).map(function(x){rcum+=x.n;return {l:x.cat,v:x.n,max:rsn[0].n,txt:x.n+' · '+Math.round(100*rcum/rtot)+'%'}}))+'</div>':'');
  };
  // census_now = latest PCC census (or newer census board) moved forward by later 24-hr reports; open = 57 - total
  var cOpen=cen.open_beds!=null?cen.open_beds:cen.total_census!=null?57-cen.total_census:null,cEmpty=cen.beds_empty||[];
  cards.push({title:'Census',sub:cen.estimate?'PCC '+md(cen.base_date)+' + 24-hr report '+md(cen.report_date)+' · estimate'
      :(cen.base_source==='Jericho Census board'?'Census board':'PCC')+' · '+md(cen.date),
    status:adcDelta==null?null:adcDelta>=0?'good':adcDelta>=-1?'warn':'bad',
    label:adcDelta==null?'':'ADC '+num(mtd.avg_total,1)+' vs '+num(bud,1),
    hero:[cen.total_census!=null?(cen.estimate?'≈':'')+cen.total_census:'—','census incl. '+(cen.holds||0)+' bed hold'+(cen.holds==1?'':'s')+(cOpen!=null?' · '+cOpen+' open':'')],
    line:'Medicare A '+num(cen.mcra_count)+' · HMO '+num(cen.hmo_count)+' · Medi-Cal '+num(cen.mcal_count)+(cen.payer_date&&cen.payer_date!==cen.date?' ('+md(cen.payer_date)+')':''),
    chart:datedLine(cser,{goal:bud,min:45,max:57}),stale:cen.date&&cen.date<addDays(S.today,-1)?cen.date:null,

      (fLast&&fLast.items&&fLast.items.length?'<div class="bh2">Not passed · '+md(fLast.date)+'</div>'+fLast.items.slice(0,6).map(function(t){return '<div class="row flag"><span class="l">'+esc(t)+'</span></div>'}).join('')+more(fLast.items.length,6):'')});

  // 14b Repairs & Room Changes (Stephen 11/4) — every open repair (urgent first, days open) and every open room change with each department's sign-off
  var repO=((auto('painting')||{}).rows||[]).filter(function(r){return r.status!=='done'}),
      rcO=((auto('room_changes')||{}).rows||[]).filter(function(r){return r.status==='open'}),
      urg=repO.filter(function(r){return r.flag}).length;
  var repDays=function(r){var m=String(r.detail||'').match(/(\d+) days? open/);return m?+m[1]:null};
  var repRow=function(r){var dd=repDays(r),what=String(r.detail||'').split(' · ')[0];
    return '<div class="row'+(r.flag?' flag':'')+'"><span class="l">'+(r.flag?'⚑ ':'')+esc(r.title)+(what?'<small>'+esc(what)+'</small>':'')+'</span><span class="v">'+(dd!=null?dd+'d':md(r.date))+'</span></div>'};
  var rcRow=function(r){return '<div class="rc"><div class="top"><span>'+esc(r.title)+(r.detail?'<small>'+esc(String(r.detail).split(' · ')[0])+'</small>':'')+'</span><span class="v">'+(r.days!=null?r.days+'d':md(r.date))+'</span></div>'+
    '<div class="dks">'+(r.depts||[]).map(function(x){return '<span class="dk '+(x.done?'ok':'no')+'">'+(x.done?'✓ ':'✕ ')+esc(x.d)+(x.done?'':' · '+x.left+' left')+'</span>'}).join('')+'</div></div>'};
  cards.push({title:'Repairs & Room Changes',sub:'Repair + Room Changes apps · open',status:urg?'bad':(repO.length||rcO.length)?'warn':'good',
    label:urg?urg+' urgent':(repO.length+rcO.length)?(repO.length+rcO.length)+' open':'None open',split:true,span2:true,
    body:'<div class="blk"><div class="bh"><b>'+repO.length+'</b> open repairs'+(urg?'<small>'+urg+' urgent</small>':'')+'</div>'+
        (repO.length?repO.slice(0,8).map(repRow).join('')+more(repO.length,8):'<div class="sub">No open repairs</div>')+'</div>'+
      '<div class="blk"><div class="bh"><b>'+rcO.length+'</b> room changes open</div>'+
        (rcO.length?rcO.slice(0,5).map(rcRow).join('')+more(rcO.length,5):'<div class="sub">All room changes complete</div>')+'</div>'});

  // 15 Leader resident rounds (Stephen 11/3) — this week per rounder like the Room Rounds app, MTD % of weekdays; Stephen not listed
  var rg=auto('rounds_grid')||{},rToday=ROUNDERS.filter(function(n){return (rg[n]||[]).indexOf(S.today)>=0}).length,after10=new Date().getHours()>=10;
  cards.push({title:'Leader Resident Rounds',sub:'Room Rounds app · this week',status:rToday>=Math.ceil(ROUNDERS.length*0.6)?'good':rToday?'warn':(after10?'bad':'warn'),label:rToday+' of '+ROUNDERS.length+' today',
    body:weekGrid(ROUNDERS.map(function(n){return {name:n.split(' ')[0],days:rg[n]||[]}}))});

  // 16 Clinical lists — open items from the nursing / IP tabs
  var lists=[['isolation','Isolation'],['ebp','Enhanced barrier'],['sitter','Sitters'],['behaviors','Behaviors'],['wound_vac','Wound VAC'],['at_risk_rta','At risk of send-out'],['bedholds','Bed holds'],['medi_cal_pending','Medi-Cal pending']];
  var lrows=lists.map(function(x){var t=S.byKey[x[0]],es=entries(x[0]);return {k:x[0],l:x[1],n:es.length,miss:t&&!covered(x[0]),
    rooms:es.map(function(e){return e.room?String(e.room)+(e.bed?'-'+e.bed:''):null}).filter(Boolean)}});
  var lmiss=lrows.filter(function(r){return r.miss}).length;
  cards.push({title:'Open Clinical & BO Lists',sub:'Standup Log entries',status:lmiss?null:'good',label:'Updated',missing:lmiss>0&&pastDeadline(),
    body:lrows.map(function(r){return '<div class="row"><span class="l">'+esc(r.l)+(r.miss?' <span style="color:var(--stale);font-size:13px">not updated</span>':'')+(r.rooms.length?'<small>'+esc(r.rooms.join(', '))+'</small>':'')+'</span><span class="v">'+r.n+'</span></div>'}).join('')});

  // 17 Department updates (wide) — who has updated their tabs today
  var byRole={};
  S.tabs.forEach(function(t){
    if(FORM_KINDS.indexOf(t.kind)<0||t.cadence==='as_needed'||t.tab_key==='attendance'||t.active===false)return;
    var r=byRole[t.owner_role]=byRole[t.owner_role]||{total:0,done:0,last:null,tabs:[]};
    r.total++;var c=cov(t.tab_key),ok=covered(t.tab_key);if(ok)r.done++;if(c.check_date&&(!r.last||c.check_date>r.last))r.last=c.check_date;
    r.tabs.push({l:t.label,ok:ok,nothing:c.status==='nothing',last:c.check_date,cad:t.cadence});
  });
  var dw=auto('dept_week')||{},wkStreak=function(r){var w=dw[r]||[];return w.length?' · week '+w.filter(function(x){return x.total&&x.done===x.total}).length+'/'+w.length+' on time':''};
  var roles=Object.keys(byRole).filter(function(r){return r!=='admin'}).sort(function(a,b){return (ROLES[a]||a)<(ROLES[b]||b)?-1:1});
  var upd=roles.filter(function(r){return byRole[r].done===byRole[r].total}).length,none=roles.filter(function(r){return !byRole[r].done}).length;
  cards.push({title:'Department Updates',sub:'Standup Log · due before '+DEADLINE,wide:true,status:none===0?'good':upd>=roles.length/2?'warn':'bad',label:upd+' of '+roles.length+' complete',
    body:'<div class="dept">'+roles.map(function(r){
      var x=byRole[r],who=ROSTER.filter(function(p){return p.role===r}).map(function(p){return p.name.split(' ')[0]}).join(' & '),cls=x.done===x.total?'ok':x.done?'part':'miss';
      var cell='<div class="d '+cls+(S.deptOpen===r?' open':'')+'" onclick="toggleDept(\''+r+'\')"><span class="ic">'+(cls==='ok'?'✓':cls==='part'?'…':'○')+'</span><span class="n">'+esc(who)+'</span><span class="r">'+esc(ROLES[r]||r)+' · '+x.done+'/'+x.total+(cls==='miss'?(x.last?' · last '+md(x.last):' · nothing today'):'')+wkStreak(r)+'</span></div>';
      if(S.deptOpen!==r)return cell;
      // tapped name: drop down that person's tabs and whether each is updated
      return cell+'<div class="dtasks">'+x.tabs.map(function(t){return '<div class="dt '+(t.ok?'ok':'miss')+'"><span class="ic">'+(t.ok?'✓':'○')+'</span><span class="l">'+esc(t.l)+'</span><span class="r">'+
        (t.ok?(t.nothing?'nothing to report':'entered'):(t.last?'last '+md(t.last):'not updated'))+(t.cad&&t.cad!=='daily'?' · '+esc(t.cad):'')+'</span></div>'}).join('')+'</div>'}).join('')+'</div>'});
  return cards;
}

// ---------- flow: sections in meeting order (Stephen 11/3/26) ----------
var SECTIONS=[
 {t:'Census & Admissions',cards:['Census','Admissions & Discharges','Arriving','Admission Mini Packets','Medicare Day-4 Rates']},
 {t:'Staffing & Scheduling',cards:['Nursing Hours PPD','Overtime','Call-offs & HR']},
 {t:'Operational Updates',cards:['Floor Rounds & Environment','Repairs & Room Changes','Google Rating']},
 {t:'Action Items & Escalations',cards:['Needs an Owner Today','Department Updates']},
 {t:'Safety & Compliance',cards:['Falls','Grievances','Care Plan (POC) Compliance','PCC Forms Due']},
 {t:'Clinical Highlights',cards:['Hospital Send-outs','Leaving the Building','Open Clinical & BO Lists','Leader Resident Rounds']}
];
var SEC_SECS=100;   // 10 minutes ÷ 6 sections
var ESC='Needs an Owner Today';
function kindOf(c){return c.stale||c.missing?'stale':c.status||'none'}
function cardBy(cards,t){return cards.filter(function(c){return c.title===t})[0]}
function secStatus(cards,i){
  var k=SECTIONS[i].cards.map(function(t){var c=cardBy(cards,t);return c?kindOf(c):'none'});
  return k.indexOf('bad')>=0?'bad':k.indexOf('warn')>=0?'warn':k.indexOf('stale')>=0?'stale':'good';
}
// Recap for the last section: everything red, then watch, then stale, with the section it came from.
function escalationCard(cards){
  var rank={bad:0,warn:1,stale:2},items=[];
  SECTIONS.filter(function(s){return s.t!=='Action Items & Escalations'}).forEach(function(s){s.cards.forEach(function(t){
    var c=cardBy(cards,t),k=c&&kindOf(c);
    if(k in rank)items.push({k:k,t:t,s:s.t,l:k==='stale'?(c.stale?'data from '+md(c.stale):'not updated'):c.label});
  })});
  items.sort(function(a,b){return rank[a.k]-rank[b.k]});
  var nb=items.filter(function(i){return i.k==='bad'}).length,nw=items.filter(function(i){return i.k==='warn'}).length;
  return {title:ESC,sub:'red first, then watch, then stale feeds',status:nb?'bad':nw?'warn':'good',label:nb?nb+' need action':nw?nw+' to watch':'Nothing open',
    body:items.length?items.map(function(i){return '<div class="row k-'+i.k+(i.k==='bad'?' flag':'')+'"><span class="l"><span class="ei">'+({bad:'✕',warn:'▲',stale:'⏱'}[i.k])+'</span>'+esc(i.t)+'<small>'+esc(i.s)+'</small></span><span class="v">'+esc(i.l||'')+'</span></div>'}).join('')
      :'<div class="sub">Every section is on track.</div>'};
}
function stepsHtml(cards){
  return '<nav class="steps">'+SECTIONS.map(function(s,i){
    var st=secStatus(cards,i),on=i===S.sec;
    return '<button class="st'+(on?' on':'')+(i<S.sec?' done':'')+'" onclick="go('+i+')"><span class="num s-'+st+'">'+(i+1)+'</span><span class="t">'+esc(s.t)+
      (st==='bad'?' ✕':st==='warn'?' ▲':'')+'</span>'+(on?'<span class="et" id="secT"></span>':'')+'</button>'}).join('')+'</nav>';
}
function footHtml(){
  var nx=SECTIONS[S.sec+1];
  return '<div class="fb">'+(S.sec>0?'<button onclick="go('+(S.sec-1)+')">← '+esc(SECTIONS[S.sec-1].t)+'</button>':'')+
    '<span class="hint">← → or 1–6 to move · S timer · O all cards</span>'+
    (nx?'<button class="nx" onclick="go('+(S.sec+1)+')">Next: '+esc(nx.t)+' →</button>':'<button class="nx" onclick="toggleTimer()">'+(S.started?'End standup':'Start timer')+'</button>')+'</div>';
}
function go(i){
  if(i<0||i>=SECTIONS.length||i===S.sec)return;
  S.sec=i;if(S.started)S.secStart=Date.now();render();
}
function setView(v){S.view=v;ls('su_view',v);render()}

// ---------- render ----------
function headerKpis(cards){
  var stale=cards.filter(function(c){return c.stale||c.missing}).length,action=cards.filter(function(c){return !c.stale&&!c.missing&&c.status==='bad'}).length,watch=cards.filter(function(c){return !c.stale&&!c.missing&&c.status==='warn'}).length;
  var dept=cards.filter(function(c){return c.wide})[0],present=Object.keys(S.att).length;
  var k=function(v,l,cls){return '<div class="'+(cls||'')+'"><b>'+esc(v)+'</b><span>'+esc(l)+'</span></div>'};
  return k(action,'Need action',action?'bad':'')+k(watch,'Watch',watch?'warn':'')+k(stale,'Stale / not updated',stale?'warn':'')+k(dept?dept.label.replace(' complete',''):'—','Depts updated','')+k(present+'/'+ROSTER.length,'Present','');
}
function attHtml(){
  return '<div class="att"><span class="lbl">Attendance</span>'+ROSTER.map(function(p,i){
    var s=S.att[p.name];return '<button class="'+(s||'')+'" onclick="toggleAtt('+i+')" title="Tap: on time → late → absent">'+esc(p.name.split(' ')[0])+(s==='l'?' · late':'')+'</button>'}).join('')+
    '<span class="sp"></span><span class="hint">S timer · R refresh · rooms by room-bed only</span></div>';
}
function render(){
  var cards=buildCards(),flow=S.view==='flow',root=document.getElementById('root');
  cards.push(escalationCard(cards));
  var head='<header><div><h1>Morning Star Standup</h1><div class="sub">'+new Date(S.today+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+
    ' · refreshed '+(S.loadedAt?S.loadedAt.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'')+'</div></div>'+
    (flow?'<span class="sp"></span>':'<div class="hk">'+headerKpis(cards.filter(function(c){return c.title!==ESC}))+'</div>')+
    '<button class="vt" onclick="setView(\''+(flow?'all':'flow')+'\')">'+(flow?'All cards':'Section view')+'</button>'+
    '<div class="clock"><b id="clk"></b><span class="timer" id="tmr" onclick="toggleTimer()">▶ Start 10:00</span></div></header>';
  root.className=flow?'flow':'';
  if(flow){
    var sc=SECTIONS[S.sec].cards.map(function(t){return cardBy(cards,t)}).filter(Boolean);
    root.innerHTML=head+stepsHtml(cards)+(S.sec===0?attHtml():'')+'<main style="--n:'+sc.reduce(function(a,c){return a+(c.twocol||c.span2?2:1)},0)+'">'+sc.map(cardHtml).join('')+'</main>'+footHtml();
  }else root.innerHTML=head+attHtml()+'<main>'+cards.filter(function(c){return c.title!==ESC}).map(cardHtml).join('')+'</main>';
  tick();
  if(window.MS&&MS.icons)MS.icons();
}

function toggleDept(r){S.deptOpen=S.deptOpen===r?null:r;render()}

// ---------- timer / clock ----------
function toggleTimer(){S.started=S.started?null:Date.now();S.secStart=S.started;if(S.view==='flow')render();else tick()}
function tick(){
  var c=document.getElementById('clk');if(c)c.textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  var st=document.getElementById('secT');
  if(st){if(S.started&&S.secStart){var se=Math.floor((Date.now()-S.secStart)/1000);st.textContent=Math.floor(se/60)+':'+('0'+se%60).slice(-2);st.className='et'+(se>SEC_SECS?' over':'')}else st.textContent=''}
  var t=document.getElementById('tmr');if(!t)return;
  if(!S.started){t.textContent='▶ Start 10:00';t.className='timer';return}
  var el=Math.floor((Date.now()-S.started)/1000),left=600-el,a=Math.abs(left);
  t.textContent=(left<0?'+':'')+Math.floor(a/60)+':'+('0'+a%60).slice(-2);
  t.className='timer'+(left<0?' over':'');
}

// ---------- attendance ----------
var attTimer=null;
function toggleAtt(i){
  var n=ROSTER[i].name,s=S.att[n];
  if(!s)S.att[n]='p';else if(s==='p')S.att[n]='l';else delete S.att[n];
  render();clearTimeout(attTimer);attTimer=setTimeout(saveAtt,1200);
}
async function saveAtt(){
  S.busy=true;
  var present=[],late=[];Object.keys(S.att).forEach(function(n){(S.att[n]==='p'?present:late).push(n)});
  var data={present:present,late:late};
  try{
    if(S.attId)await rpc('standup_update',{p_pin:S.pin,p_id:S.attId,p_room:null,p_bed:null,p_data:data,p_name:'Standup screen',p_role:'Administrator'});
    else{await rpc('standup_submit',{p_pin:S.pin,p_tab_key:'attendance',p_room:null,p_bed:null,p_data:data,p_name:'Standup screen',p_role:'Administrator',p_entry_date:null});await load()}
  }catch(e){if(e.message!=='bad_pin')alert('Attendance not saved: '+e.message)}
  finally{S.busy=false}
}

document.addEventListener('keydown',function(e){
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  if(e.key==='s'||e.key==='S')toggleTimer();
  else if(e.key==='r'||e.key==='R')load().then(render);
  else if(e.key==='o'||e.key==='O')setView(S.view==='flow'?'all':'flow');
  else if(S.view==='flow'&&(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')){e.preventDefault();go(S.sec+1)}
  else if(S.view==='flow'&&(e.key==='ArrowLeft'||e.key==='PageUp')){e.preventDefault();go(S.sec-1)}
  else if(S.view==='flow'&&e.key>='1'&&e.key<='6')go(+e.key-1);
});

(async function(){
  S.pin=ls('su_pin');
  if(!S.pin)return showPin();
  try{await boot()}catch(e){if(e.message!=='bad_pin')document.getElementById('root').innerHTML='<div class="pinbox">Could not load. Check the connection and refresh.<div class="err">'+esc(e.message)+'</div></div>'}
})();
</script>
