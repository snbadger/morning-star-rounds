<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Morning Star — Staff Reliability</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#1a3c5e;--primary-light:#2980b9;--success:#1f8a5b;--success-bg:#e7f5ee;--danger:#b3261e;--danger-bg:#fdeceb;--warn:#b57b00;--warn-bg:#fdf3e0;--bg:#f0f2f5;--card:#fff;--text:#2c3e50;--text-light:#6b7785;--border:#dce1e6;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:48px}
.header{background:linear-gradient(135deg,#0d2137,var(--primary));color:#fff;padding:14px 18px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);display:flex;justify-content:space-between;align-items:center;gap:10px}
.header h1{font-size:17px;font-weight:800;letter-spacing:.3px}
.header .sub{font-size:11px;opacity:.8;margin-top:2px}
.header .sub a{color:#9ec5e8;text-decoration:none}
.who{font-size:12px;background:rgba(255,255,255,.15);padding:5px 10px;border-radius:16px;cursor:pointer;white-space:nowrap;border:0;color:#fff;font-family:inherit}
.page{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--border)}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;text-align:center;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-quiet{background:#eef1f4;color:var(--text)}
.btn-sm{display:inline-block;width:auto;padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;background:#fff;color:var(--text);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-light)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:20px;background:#fff;border:1.5px solid var(--border);color:var(--text-light);cursor:pointer;user-select:none;font-family:inherit}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.seg{display:flex;background:#e3e8ee;border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;font-size:13.5px;font-weight:700;color:var(--text-light);border-radius:8px;cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.p-ok{background:var(--success-bg);color:var(--success)} .p-no{background:#eef1f4;color:var(--text-light)}
.p-warn{background:var(--warn-bg);color:var(--warn)} .p-red{background:var(--danger-bg);color:var(--danger)}
.h2{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--text-light);margin:18px 2px 8px}
.big{font-size:26px;font-weight:800;color:var(--primary)}
.muted{color:var(--text-light);font-size:13px}
.note{font-size:12.5px;line-height:1.5;margin-top:10px;padding:8px 10px;border-radius:8px;background:#eef6fb;border:1px solid #cfe3f1;color:#1f4e79}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:#f7f9fb;border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.tile b{display:block;font-size:22px;color:var(--primary)}
.tile span{font-size:11px;color:var(--text-light);font-weight:600}
.person{border-top:1px solid var(--border);padding:10px 2px}
.person:first-child{border-top:0}
.person .top{display:flex;align-items:center;gap:8px;cursor:pointer}
.person .nm{flex:1;min-width:0}
.person .nm b{font-size:14.5px;display:block}
.person .nm span{font-size:12px;color:var(--text-light)}
.marks{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.detail{margin-top:8px;padding:10px;background:#fbfcfd;border:1px solid var(--border);border-radius:10px;font-size:13px;line-height:1.55}
.detail h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-light);margin:8px 0 3px}
.detail h4:first-child{margin-top:0}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
.clean-dept{margin-top:10px}
.clean-dept b{font-size:13px;color:var(--primary)}
.clean-dept div{font-size:14px;line-height:1.6}
.appr{border-top:1px solid var(--border);padding:10px 2px;display:flex;gap:10px;align-items:flex-start}
.appr:first-child{border-top:0}
.appr .nm{flex:1}
.appr .nm b{font-size:14.5px}
.appr .nm div{font-size:12.5px;color:var(--text-light);margin-top:2px}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roster button{padding:12px 10px;border-radius:10px;border:1.5px solid var(--border);background:#fff;text-align:left;cursor:pointer;font-family:inherit}
.roster button b{display:block;font-size:14.5px;color:var(--text)}
.roster button span{font-size:12px;color:var(--text-light)}
.toast button{margin-left:14px;background:none;border:0;color:#7fd3ff;font:inherit;font-weight:800;cursor:pointer;padding:0}
.toast.act{pointer-events:auto}
.otc{border-top:1px solid var(--border);padding:12px 2px}
.otc:first-child{border-top:0}
.otc .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.otc .hd b{font-size:15px}
.otc .hd .sub2{font-size:12.5px;color:var(--text-light);margin-top:2px}
.otc .hrs{font-size:15px;font-weight:800;color:var(--warn);white-space:nowrap}
.otc .chips{margin-top:9px}
.otc .no{margin-top:8px;background:none;border:1.5px solid var(--danger);color:var(--danger);border-radius:18px;padding:6px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.badge{display:inline-block;min-width:18px;padding:1px 6px;margin-left:6px;border-radius:10px;background:var(--danger);color:#fff;font-size:11.5px;font-weight:800}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2c3e50;color:#fff;padding:11px 22px;border-radius:24px;font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.load{text-align:center;color:var(--text-light);padding:34px;font-size:14px}
@media (max-width:480px){.roster{grid-template-columns:1fr}.row2{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>⭐ Staff Reliability</h1>
    <div class="sub"><a href="../">← All Apps</a> · Morning Star Post Acute</div>
  </div>
  <button class="who" id="whoChip" onclick="switchUser()">Sign in</button>
</div>
<div class="page" id="app"><div class="load">Loading…</div></div>
<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL='https://pmnudshutxwidxdtouqj.supabase.co';
var SUPABASE_KEY='sb_publishable_wzX5nLx18cfErNTRPO671w_sH4ED7ET';
var sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;

// OT approvers = department heads + DON (Room Rounds ROSTER is the source of truth).
var ROSTER=[
 {name:'Donna Rogers',role:'Director of Nursing',depts:'*'},{name:'Savanna McCormick',role:'ADON',depts:['Nursing','Respiratory']},{name:'Amandeep Brar',role:'MDS',depts:['Nursing']},
 {name:'Yessi Flores',role:'DSD / Infection Prevention',depts:['Nursing']},{name:'Randy Bago',role:'Admissions',depts:[]},{name:'Belem Gonzalez',role:'Business Office',depts:[]},
 {name:'Valerie Estrada',role:'Social Services',depts:[]},{name:'Michael Miller',role:'Activities',depts:[]},{name:'Lucy Malcolm',role:'Activities',depts:[]},
 {name:'Kim Beatrez',role:'Dietary',depts:['Dietary']},{name:'Annie Vang',role:'Medical Records',depts:[]},{name:'Kelsey Kennington',role:'HR / AP / Payroll',depts:'*'},
 {name:'Sebastian Lopez',role:'Maintenance / EVS',depts:['Housekeeping / Maintenance']},{name:'Joe Fronteras',role:'Rehab',depts:['Rehab']},{name:'Stephen Badger',role:'Administrator',depts:'*'}
];
// Excusing a call-out (schedule error, approved swap) is limited to DON / HR / Administrator. Sick time is never an excuse.
var EXCUSERS=['Donna Rogers','Kelsey Kennington','Stephen Badger'];
var REASONS=['Short-staffed / call-off coverage','Census or acuity','Admission or discharge','Meeting or training','Finishing care / report'];

var UNDO_MS=6000;
var S={queue:null,showAhead:false,pin:null,name:null,role:null,boot:null,tab:'month',month:null,data:null,open:{},filter:'all',dept:'',sort:'name',form:{eecode:'',date:'',hours:'',reason:'',note:''},busy:false};

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(m,btn,fn,ms){var t=document.getElementById('toast');t.textContent=m;t.classList.toggle('act',!!btn);
  if(btn){var b=document.createElement('button');b.textContent=btn;b.onclick=function(){t.classList.remove('show','act');fn()};t.appendChild(b)}
  t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show','act')},ms||2600)}
function md(d){if(!d)return '';var p=String(d).slice(0,10).split('-');return (+p[1])+'/'+(+p[2])}
function monLabel(d){var p=String(d).slice(0,10).split('-');return ['January','February','March','April','May','June','July','August','September','October','November','December'][+p[1]-1]+' '+p[0]}
// Paycom names are "LAST, FIRST M" → "First Last"
function nice(n){if(!n)return '';var p=String(n).split(',');var cap=function(s){return s.toLowerCase().replace(/(^|[\s'-])([a-z])/g,function(m,a,b){return a+b.toUpperCase()})};
  return p.length<2?cap(n.trim()):cap(p[1].trim().split(' ')[0])+' '+cap(p[0].trim())}
function app(){return document.getElementById('app')}
function setWho(){document.getElementById('whoChip').textContent=S.name?S.name.split(' ')[0]+' · switch':'Sign in'}

async function rpc(fn,args){
  if(!sb)throw new Error('offline');
  var r=await sb.rpc(fn,args);
  if(r.error){
    if(String(r.error.message).indexOf('bad_pin')>=0){ls('su_pin',null);S.pin=null;showPin('That PIN did not work.');throw new Error('bad_pin')}
    throw new Error(r.error.message);
  }
  return r.data;
}
async function guard(fn){if(S.busy)return;S.busy=true;try{await fn()}catch(e){if(e.message!=='bad_pin')toast(e.message)}finally{S.busy=false}}

// ---------- start / sign-in (shares the Standup Log's leadership PIN + name) ----------
async function start(){
  S.pin=ls('su_pin');S.name=ls('rl_name');
  var p=ROSTER.filter(function(x){return x.name===S.name})[0];S.role=p?p.role:null;setWho();
  if(!S.pin)return showPin();
  try{await boot()}catch(e){if(e.message!=='bad_pin')app().innerHTML='<div class="card load">Could not load. Check the connection and refresh.<br><span class="muted">'+esc(e.message)+'</span></div>'}
}
async function boot(){
  S.boot=await rpc('reliability_bootstrap',{p_pin:S.pin});
  if(!S.name||!S.role)return showWho();
  if(!S.form.date)S.form.date=S.boot.today;
  if(!S.month){var t=S.boot.today.slice(0,8)+'01';S.month=t}
  await Promise.all([loadMonth(),loadQueue()]);render();
}
function showPin(msg){
  app().innerHTML='<div class="card"><div class="big" style="font-size:20px">Leadership PIN</div><p class="muted" style="margin-top:6px">Same PIN as the leadership tools on the hub.</p>'+
    (msg?'<p style="color:var(--danger);margin-top:8px;font-size:13px">'+esc(msg)+'</p>':'')+
    '<input id="pinIn" type="tel" inputmode="numeric" maxlength="8" autocomplete="off" style="margin-top:12px;font-size:22px;letter-spacing:4px;text-align:center" placeholder="PIN">'+
    '<button class="btn btn-primary" style="margin-top:12px" onclick="submitPin()">Continue</button></div>';
  var i=document.getElementById('pinIn');i.focus();i.onkeydown=function(e){if(e.key==='Enter')submitPin()};
}
async function submitPin(){
  var v=(document.getElementById('pinIn').value||'').trim();if(!v)return;
  S.pin=v;
  try{await rpc('reliability_bootstrap',{p_pin:v});ls('su_pin',v);await boot()}catch(e){if(e.message!=='bad_pin')toast('Could not connect: '+e.message)}
}
function showWho(){
  app().innerHTML='<div class="card"><div class="big" style="font-size:20px">Who are you?</div><p class="muted" style="margin-top:6px">Your name goes on every OT approval you enter.</p>'+
    '<div class="roster" style="margin-top:12px">'+ROSTER.map(function(p,i){return '<button onclick="pickWho('+i+')"><b>'+esc(p.name)+'</b><span>'+esc(p.role)+'</span></button>'}).join('')+'</div></div>';
}
async function pickWho(i){S.name=ROSTER[i].name;S.role=ROSTER[i].role;ls('rl_name',S.name);setWho();await boot()}
function switchUser(){if(!S.pin)return;S.name=null;S.role=null;ls('rl_name',null);setWho();showWho()}
function logOut(){ls('rl_name',null);ls('su_pin',null);location.href=new URL('../',location.href).href}

async function loadMonth(){S.data=await rpc('reliability_month',{p_pin:S.pin,p_month:S.month})}
async function loadQueue(){S.queue=await rpc('reliability_ot_queue',{p_pin:S.pin})}
// each reviewer sees their own department's OT; DON, HR/payroll, and the Administrator see all.
// depts:[] = views the clean-month list only (the database also enforces the approver list in reliability_config.ot_approvers)
function inScope(dept){var p=ROSTER.filter(function(x){return x.name===S.name})[0];if(!p)return false;return p.depts==='*'||p.depts.indexOf(dept||'')>=0}
function canApprove(){var p=ROSTER.filter(function(x){return x.name===S.name})[0];return !!p&&(p.depts==='*'||p.depts.length>0)}
function myPending(){return ((S.queue&&S.queue.pending)||[]).filter(function(i){return inScope(i.dept)})}

// ---------- render ----------
function render(){
  var h='<div class="seg"><button class="'+(S.tab==='month'?'on':'')+'" onclick="go(\'month\')">Clean Month</button>'+
        '<button class="'+(S.tab==='ot'?'on':'')+'" onclick="go(\'ot\')">Approve OT'+(myPending().length?'<span class="badge">'+myPending().length+'</span>':'')+'</button></div>';
  h+=S.tab==='ot'?renderOT():renderMonth();
  h+='<button class="btn btn-quiet" style="margin-top:18px" onclick="logOut()">Done — log out</button>';
  app().innerHTML=h;
}
function go(t){S.tab=t;render();window.scrollTo(0,0)}

// ----- Clean Month -----
function renderMonth(){
  var d=S.data,rows=d.rows||[],cfg=S.boot.config;
  var el=rows.filter(function(r){return r.eligible}),clean=el.filter(function(r){return r.clean});
  var zeroMiss=el.filter(function(r){return +r.missed===0}).length;
  var otScored=rows.length&&rows[0].ot_scored,missScored=rows.length&&rows[0].missed_scored,maxMiss=+cfg.max_missed_punches;
  var h='<div class="card"><div style="display:flex;gap:10px;align-items:center;justify-content:space-between">'+
    '<select style="width:auto;flex:1" onchange="pickMonth(this.value)">'+(d.months||[]).map(function(m){return '<option value="'+m+'"'+(m===d.month?' selected':'')+'>'+monLabel(m)+'</option>'}).join('')+'</select></div>'+
    '<div class="tiles" style="margin-top:12px">'+
    '<div class="tile"><b>'+clean.length+'</b><span>Clean month</span></div>'+
    '<div class="tile"><b>'+el.length+'</b><span>Eligible</span></div>'+
    '<div class="tile"><b>'+(el.length?Math.round(clean.length/el.length*100):0)+'%</b><span>Clean rate</span></div>'+
    '<div class="tile"><b>'+zeroMiss+'</b><span>0 missed punches</span></div></div>'+
    (d.month>=S.boot.today.slice(0,8)+'01'?'<div class="note">This month is still in progress. The list can change until the month closes.</div>':'')+
    (!otScored?'<div class="note">Unapproved OT is not scored for this month. The approval log starts '+md(cfg.ot_scoring_start)+'.</div>':'')+
    (d.month<cfg.timecard_scoring_start?'<div class="note">Timecard approval is not scored for this month. It starts '+md(cfg.timecard_scoring_start)+'.</div>':'')+
    (!missScored?'<div class="note">Missed punches are not scored for this month. Starting '+md(cfg.missed_scoring_start)+', more than '+maxMiss+' missed punch'+(maxMiss===1?'':'es')+' in a month costs the clean month.</div>':'')+
    '</div>';

  // the clean list, by department
  var byDept={};clean.forEach(function(r){(byDept[r.dept||'Other']=byDept[r.dept||'Other']||[]).push(r)});
  h+='<div class="h2">⭐ Clean month — '+clean.length+' people</div><div class="card">';
  if(!clean.length)h+='<div class="muted">No one has a clean month yet.</div>';
  Object.keys(byDept).sort().forEach(function(k){h+='<div class="clean-dept"><b>'+esc(k)+'</b><div>'+byDept[k].map(function(r){return esc(nice(r.name))}).join(' · ')+'</div></div>'});
  h+='</div>';

  // everyone
  var depts=Array.from(new Set(rows.map(function(r){return r.dept||'Other'}))).sort();
  var list=rows.filter(function(r){
    if(S.dept&&(r.dept||'Other')!==S.dept)return false;
    if(S.filter==='clean')return r.clean;
    if(S.filter==='notclean')return r.eligible&&!r.clean;
    if(S.filter==='inelig')return !r.eligible;
    return true});
  if(S.sort==='missed')list=list.slice().sort(function(a,b){return (+a.missed)-(+b.missed)||nice(a.name).localeCompare(nice(b.name))});
  else list=list.slice().sort(function(a,b){return nice(a.name).localeCompare(nice(b.name))});
  h+='<div class="h2">Everyone</div><div class="card">'+
    '<div class="chips">'+[['all','All'],['clean','Clean'],['notclean','Not clean'],['inelig','Under '+cfg.min_days_worked+' days']].map(function(f){return '<button class="chip'+(S.filter===f[0]?' on':'')+'" onclick="setF(\'filter\',\''+f[0]+'\')">'+f[1]+'</button>'}).join('')+'</div>'+
    '<div class="row2" style="margin-top:10px"><select onchange="setF(\'dept\',this.value)"><option value="">All departments</option>'+depts.map(function(x){return '<option'+(S.dept===x?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select>'+
    '<select onchange="setF(\'sort\',this.value)"><option value="name"'+(S.sort==='name'?' selected':'')+'>Sort by name</option><option value="missed"'+(S.sort==='missed'?' selected':'')+'>Fewest missed punches</option></select></div>'+
    '<div style="margin-top:8px">';
  if(!list.length)h+='<div class="muted" style="padding:10px 0">No one matches.</div>';
  list.forEach(function(r){h+=personRow(r)});
  h+='</div></div>';
  h+='<div class="note">A <b>clean month</b> means at least '+cfg.min_days_worked+' days worked, with zero unapproved OT, zero unexcused call-outs, zero meal penalties, and no more than '+cfg.max_missed_punches+' missed punch'+(+cfg.max_missed_punches===1?'':'es')+' (from '+md(cfg.missed_scoring_start)+'), and every timecard approved in Paycom by the end of each pay period (from '+md(cfg.timecard_scoring_start)+'). '+
     'Approval is checked once, about 2 days after the pay period closes (1st–15th and 16th–end of month); approving later does not change it. '+
     'A call-out is a Veras shift with no punch, or a Paycom sick, unpaid, or bereavement day with no punch. Any missed shift counts, whatever the reason, including protected sick, unpaid, and bereavement time; only pre-approved vacation or holiday does not.</div>';
  return h;
}
function mark(ok,label,scored){if(scored===false)return '<span class="pill p-no">'+label+' n/a</span>';return '<span class="pill '+(ok?'p-ok':'p-red')+'">'+label+'</span>'}
function missClass(r){if(+r.missed===0)return 'p-ok';if(!r.missed_scored)return 'p-warn';return +r.missed<=+S.boot.config.max_missed_punches?'p-warn':'p-red'}
function personRow(r){
  var st=!r.eligible?'<span class="pill p-no">'+r.days+' days</span>':r.clean?'<span class="pill p-ok">⭐ Clean</span>':'';
  var h='<div class="person"><div class="top" onclick="toggle(\''+r.eecode+'\')"><div class="nm"><b>'+esc(nice(r.name))+' '+st+'</b><span>'+esc(r.dept||'')+(r.position?' · '+esc(r.position):'')+' · '+r.days+' days</span></div>'+
    '<div class="marks">'+mark(+r.ot_unapproved===0,'OT',r.ot_scored)+mark(+r.callouts===0,'Call-outs',r.co_scored)+mark(+r.meal===0,'Meals')+mark(+r.tc_unapproved===0,'Timecards',r.tc_scored)+
    '<span class="pill '+missClass(r)+'">'+r.missed+' missed</span></div></div>';
  if(S.open[r.eecode])h+=detail(r);
  return h+'</div>';
}
function detail(r){
  var h='<div class="detail">';
  h+='<h4>Overtime'+(r.ot_scored?'':' (tracked, not scored this month)')+'</h4>';
  if(!r.ot_list.length)h+='<div class="muted">No OT days.</div>';
  r.ot_list.forEach(function(o){h+='<div class="ln"><span>'+md(o.date)+' · '+o.hours+' hrs</span>'+(o.approved?'<span class="pill p-ok">Approved</span>':'<span class="pill '+(r.ot_scored?'p-red':'p-no')+'">Not approved</span>')+'</div>'});
  h+='<h4>Call-outs</h4>';
  if(!r.co_scored)h+='<div class="muted">Not scheduled in Veras — not measured.</div>';
  else if(!r.co_list.length)h+='<div class="muted">None'+(r.shifts?' of '+r.shifts+' scheduled shifts':'')+'.</div>';
  var canEx=EXCUSERS.indexOf(S.name)>=0;
  r.co_list.forEach(function(c){
    if(c.paycom)h+='<div class="ln"><span>'+md(c.date)+' · '+esc(codeName(c.codes))+' in Paycom, no punch</span></div>';
    else if(c.excuse_id)h+='<div class="ln"><span>'+md(c.date)+' '+esc(c.start)+' · <i>excused: '+esc(c.excuse)+'</i> ('+esc(c.excused_by)+')</span>'+(canEx?'<button class="btn btn-quiet btn-sm" onclick="unexcuse('+c.excuse_id+')">Undo</button>':'')+'</div>';
    else h+='<div class="ln"><span>'+md(c.date)+' '+esc(c.start)+' · scheduled, no punch'+(c.codes?' ('+esc(codeName(c.codes))+')':', no time-off code')+'</span>'+(canEx?'<button class="btn btn-quiet btn-sm" onclick="excuse(\''+c.shift_id+'\')">Excuse</button>':'')+'</div>'});
  h+='<h4>Meal penalties</h4>';
  if(!r.meal_list.length)h+='<div class="muted">None.</div>';
  r.meal_list.forEach(function(m){h+='<div class="ln"><span>'+md(m.date)+' · '+esc(m.reason)+'</span></div>'});
  var mx=+S.boot.config.max_missed_punches;
  h+='<h4>Missed punches'+(r.missed_scored?' ('+mx+' allowed)':' (tracked, not scored this month)')+'</h4><div>'+(+r.missed===0?'None — every punch on the clock. 👏':r.missed+' "Forgot Punch" edits this month.'+(r.missed_scored&&+r.missed>mx?' Over the limit of '+mx+'.':''))+'</div>';
  h+='<h4>Timecard approval'+(r.tc_scored?'':' (tracked, not scored this month)')+'</h4>';
  if(!r.tc_list.length)h+='<div class="muted">No pay period checked yet. Checked about 2 days after each pay period closes.</div>';
  r.tc_list.forEach(function(t){h+='<div class="ln"><span>Pay period '+md(t.start)+'–'+md(t.end)+(+t.unapproved?' · '+t.unapproved+' day'+(+t.unapproved===1?'':'s')+' not approved'+(t.dates&&t.dates.length?' ('+t.dates.map(md).join(', ')+')':''):'')+'</span>'+
    (+t.unapproved?'<span class="pill '+(r.tc_scored?'p-red':'p-no')+'">Not approved</span>':'<span class="pill p-ok">Approved</span>')+'</div>'});
  return h+'</div>';
}
function toggle(id){S.open[id]=!S.open[id];render()}
function setF(k,v){S[k]=v;render()}
function pickMonth(m){guard(async function(){S.month=m;S.open={};await loadMonth();render()})}
var CODE_NAMES={S:'sick',P:'sick',SIC:'sick',CSK:'sick',CSC:'sick',UPT:'unpaid',BER:'bereavement',JUR:'jury duty'};
function codeName(c){return c.split(',').map(function(x){return CODE_NAMES[x]||x}).join(', ')}
function excuse(shiftId){
  var n=prompt('Why is this call-out excused?\n(for example: schedule error, approved swap. Sick time, including protected sick, still counts.)','');
  if(!n||!n.trim())return;
  guard(async function(){await rpc('reliability_excuse_callout',{p_pin:S.pin,p_shift_id:shiftId,p_reason:n,p_by:S.name});await loadMonth();render();toast('Excused')})
}
function unexcuse(id){guard(async function(){await rpc('reliability_unexcuse',{p_pin:S.pin,p_id:id,p_by:S.name});await loadMonth();render();toast('Excuse removed')})}

// ----- Approve OT -----
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function dmd(d){var p=String(d).slice(0,10).split('-');return DOW[new Date(+p[0],p[1]-1,+p[2]).getDay()]+' '+(+p[1])+'/'+(+p[2])}
function hm(t){if(!t)return '?';var a=t.split(':'),h=+a[0];return ((h+11)%12+1)+':'+a[1]+(h<12?'a':'p')}
function renderOT(){
  if(!canApprove())return '<div class="card"><div class="big" style="font-size:20px">Overtime review</div><p class="muted" style="margin-top:6px">You don\'t approve OT. Stephen, Donna, or Kelsey review OT for your department.</p></div>';
  var q=S.queue||{pending:[],recent:[]},list=myPending(),recent=(q.recent||[]).filter(function(i){return inScope(i.dept)});
  var h='<div class="card"><div class="big" style="font-size:20px">Overtime to review'+(list.length?' — '+list.length:'')+'</div>'+
    '<p class="muted" style="margin-top:4px">OT from Paycom punches, the morning after. Tap a reason to approve, or <b>Not approved</b>. OT left here or marked not approved keeps the employee off the clean-month list.</p>';
  if(!list.length)h+='<div class="muted" style="padding:14px 0 4px">Nothing to review. 🎉'+(q.from>S.boot.today?' OT from '+md(q.from)+' on shows up here the morning after.':'')+'</div>';
  list.forEach(function(i,n){
    h+='<div class="otc"><div class="hd"><div><b>'+esc(nice(i.name))+'</b><div class="sub2">'+esc(i.position||i.dept||'')+' · '+dmd(i.date)+' · '+hm(i.in)+'–'+hm(i.out)+(i.out_date&&i.out_date!==i.date?' (next day)':'')+' · '+i.worked_hours+' hrs worked</div></div>'+
      '<div class="hrs">+'+i.ot_hours+' OT</div></div>'+
      '<div class="chips">'+REASONS.map(function(r,k){return '<button class="chip" onclick="decide('+n+',\'approved\','+k+')">'+esc(r)+'</button>'}).join('')+'</div>'+
      '<button class="no" onclick="decide('+n+',\'declined\')">Not approved</button></div>'});
  h+='</div>';
  if(recent.length){
    h+='<div class="h2">Reviewed this week</div><div class="card">';
    recent.forEach(function(a){h+='<div class="appr"><div class="nm"><b>'+esc(nice(a.name))+'</b> · '+dmd(a.date)+(a.ot_hours!=null?' · '+a.ot_hours+' hrs':'')+
      '<div>'+(a.status==='approved'?'<span class="pill p-ok">Approved</span> '+esc(a.reason||''):'<span class="pill p-red">Not approved</span>')+' — '+esc(a.by)+'</div></div>'+
      '<button class="btn btn-quiet btn-sm" onclick="undoDecision('+a.id+')">Undo</button></div>'});
    h+='</div>';
  }
  h+='<button class="btn btn-quiet" style="margin-top:14px" onclick="S.showAhead=!S.showAhead;render()">'+(S.showAhead?'Hide':'Approve OT ahead of time')+'</button>';
  if(S.showAhead)h+=renderAhead();
  return h;
}
function decide(n,status,k){
  var i=myPending()[n];if(!i)return;
  guard(async function(){
    var id=await rpc('reliability_decide_ot',{p_pin:S.pin,p_eecode:i.eecode,p_work_date:i.date,p_status:status,p_reason:status==='approved'?REASONS[k]:null,p_by:S.name,p_role:S.role});
    S.queue.pending=S.queue.pending.filter(function(x){return x!==i});render();
    toast((status==='approved'?'Approved':'Not approved')+' — '+nice(i.name)+' '+md(i.date),'Undo',function(){undoDecision(id)},UNDO_MS);
    loadQueue().then(function(){return loadMonth()}).then(render).catch(function(){});
  })
}
function undoDecision(id){
  guard(async function(){await rpc('reliability_void_ot',{p_pin:S.pin,p_id:id,p_by:S.name});await Promise.all([loadQueue(),loadMonth()]);render();toast('Undone — back in the list')})
}
function renderAhead(){
  var f=S.form,staff=S.boot.staff||[];
  var byDept={};staff.forEach(function(s){(byDept[s.dept||'Other']=byDept[s.dept||'Other']||[]).push(s)});
  var h='<div class="card" style="margin-top:10px"><div class="big" style="font-size:20px">Approve ahead of time</div>'+
    '<p class="muted" style="margin-top:4px">Already know someone will stay late? Approve it here and it won\'t show up for review.</p>'+
    '<label>Employee</label><select id="f_ee" onchange="S.form.eecode=this.value"><option value="">Choose…</option>'+
    Object.keys(byDept).sort().map(function(k){return '<optgroup label="'+esc(k)+'">'+byDept[k].slice().sort(function(a,b){return nice(a.name).localeCompare(nice(b.name))}).map(function(s){return '<option value="'+esc(s.eecode)+'"'+(f.eecode===s.eecode?' selected':'')+'>'+esc(nice(s.name))+(s.position?' — '+esc(s.position):'')+'</option>'}).join('')+'</optgroup>'}).join('')+'</select>'+
    '<div class="row2"><div><label>Date of the shift</label><input id="f_date" type="date" value="'+esc(f.date)+'" onchange="S.form.date=this.value"></div>'+
    '<div><label>Extra hours (optional)</label><input id="f_hrs" type="number" inputmode="decimal" step="0.25" min="0.25" max="16" placeholder="e.g. 4" value="'+esc(f.hours)+'" oninput="S.form.hours=this.value"></div></div>'+
    '<label>Reason</label><div class="chips">'+REASONS.map(function(r,i){return '<button class="chip'+(f.reason===r?' on':'')+'" onclick="pickReason('+i+')">'+esc(r)+'</button>'}).join('')+'</div>'+
    '<input id="f_note" style="margin-top:8px" placeholder="Details (optional)" value="'+esc(f.note)+'" oninput="S.form.note=this.value">'+
    '<button class="btn btn-primary" style="margin-top:14px" onclick="approve()">Approve OT as '+esc(S.name)+'</button></div>';
  var ap=S.boot.approvals||[];
  h+='<div class="h2">Approved ahead — last 30 days and upcoming</div><div class="card">';
  if(!ap.length)h+='<div class="muted">No approvals yet.</div>';
  ap.forEach(function(a){h+='<div class="appr"><div class="nm"><b>'+esc(nice(a.ee_name))+'</b> · '+md(a.work_date)+(a.hours?' · '+a.hours+' hrs':'')+
    '<div>'+esc(a.reason)+' — approved by '+esc(a.approved_by)+'</div></div><button class="btn btn-quiet btn-sm" onclick="voidOT('+a.id+')">Remove</button></div>'});
  return h+'</div>';
}
function pickReason(i){S.form.reason=S.form.reason===REASONS[i]?'':REASONS[i];render()}
function approve(){
  var f=S.form;
  if(!f.eecode)return toast('Choose the employee');
  if(!f.date)return toast('Pick the date');
  if(!f.reason&&!f.note.trim())return toast('Pick a reason');
  var reason=[f.reason,f.note.trim()].filter(Boolean).join(' — ');
  guard(async function(){
    await rpc('reliability_approve_ot',{p_pin:S.pin,p_eecode:f.eecode,p_work_date:f.date,p_hours:f.hours?+f.hours:null,p_reason:reason,p_by:S.name,p_role:S.role});
    S.form={eecode:'',date:S.boot.today,hours:'',reason:'',note:''};
    S.boot=await rpc('reliability_bootstrap',{p_pin:S.pin});await Promise.all([loadMonth(),loadQueue()]);render();toast('OT approved')
  })
}
function voidOT(id){
  if(!confirm('Remove this OT approval?'))return;
  guard(async function(){await rpc('reliability_void_ot',{p_pin:S.pin,p_id:id,p_by:S.name});S.boot=await rpc('reliability_bootstrap',{p_pin:S.pin});await loadMonth();render();toast('Removed')})
}

start();
</script>
</body>
</html>
