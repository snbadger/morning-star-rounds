<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Morning Star — Transportation &amp; Discharges</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../ms-identity.js?v=2"></script>
<link rel="stylesheet" href="../ms-ui.css?v=3">
<script src="../ms-ui.js?v=1"></script>
<style>
/* Transportation & Discharges (11/5/26). Residents appear as room-bed + name code only (e.g. 12A · SMIJ).
   The person who schedules enters everything; there is no second hand-off. */
body{padding-bottom:96px}
.page{max-width:640px;margin:0 auto;padding:16px 14px 24px}
.tabs{margin-bottom:14px}
.day-h{display:flex;align-items:baseline;gap:8px;margin:18px 2px 8px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}
.day-h.today{color:var(--primary)}
.day-h .n{margin-left:auto;font-weight:700;letter-spacing:0;text-transform:none}
.trip{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer}
.trip:active{transform:scale(.99)}
.trip .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.trip .ic.appt{background:#0b7285}.trip .ic.dc{background:#6741d9}
.trip .b{flex:1;min-width:0}
.trip .t1{font-weight:800;font-size:16px}
.trip .t2{font-size:13.5px;color:var(--muted-foreground);margin-top:2px}
.trip .r{text-align:right;font-size:13.5px;font-weight:700;white-space:nowrap}
.trip .r small{display:block;font-weight:500;color:var(--muted-foreground)}
.trip.late{border-color:#f0b4b4;background:#fff7f7}
.trip.dim{opacity:.6}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:50;display:flex;gap:10px;width:min(612px,calc(100% - 28px))}
.fab .btn{flex:1;min-height:52px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.form label{display:block;margin:16px 0 6px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
.form .input,.form .select,.form .textarea{font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.fld{min-width:0}
.fld .input{width:100%}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end}
.codebox{display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--muted);font-size:14px}
.codebox b{font-size:20px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days .chip{min-width:46px;justify-content:center}
.fs{margin-top:22px;padding-top:4px;border-top:1px solid var(--border)}
.fs-h{font-size:15px;font-weight:800;margin-top:14px;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:15px;margin-top:10px}
.kv dt{color:var(--muted-foreground);font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--muted-foreground);margin-top:8px}
.actions{display:grid;gap:10px;margin-top:18px}
@media(max-width:420px){.three{grid-template-columns:1fr 1fr}.kv{grid-template-columns:110px 1fr}}
</style>
</head>
<body>
<div class="ms-header">
  <div><h1><i data-lucide="bus"></i>Transportation &amp; Discharges</h1><div class="sub">Morning Star Post Acute · residents leaving the building</div></div>
  <div class="who" id="whoChip" onclick="pickWho()"></div>
</div>
<main class="page" id="app"><div class="card pad"><div class="skeleton line"></div></div></main>
<div class="fab" id="fab" hidden>
  <button class="btn" onclick="openForm('appt')"><i data-lucide="calendar-plus"></i>New appointment</button>
  <button class="btn secondary" onclick="openForm('dc')"><i data-lucide="door-open"></i>New discharge</button>
</div>

<script>
var SUPABASE_URL='https://pmnudshutxwidxdtouqj.supabase.co', SUPABASE_KEY='sb_publishable_wzX5nLx18cfErNTRPO671w_sH4ED7ET';
var sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
var S={pin:null,me:null,owners:[],rows:[],occ:[],today:null,tab:'appt',busy:false};
var TRANSPORT=['Wheelchair van','Gurney','Ambulatory / car','Family driving','Ambulance','Other'];
var DEST=['Home','Home with home health','Assisted living / board & care','Another SNF','Other'];
var APPT_TYPES=['Dialysis','Physician / specialist','Imaging / lab','Wound clinic','Surgery / procedure','Dental','Eye','Other'];
var DOW=[[1,'Mon'],[2,'Tue'],[3,'Wed'],[4,'Thu'],[5,'Fri'],[6,'Sat'],[7,'Sun']];

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function app(){return document.getElementById('app')}
function icons(){if(window.MS&&MS.icons)MS.icons()}
function toast(m,type){if(window.MS&&MS.toast)MS.toast(m,{type:type||''});else alert(m)}
function addDays(d,n){var x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function dayLabel(d){
  if(d===S.today)return 'Today';
  if(d===addDays(S.today,1))return 'Tomorrow';
  if(d===addDays(S.today,-1))return 'Yesterday';
  var x=new Date(d+'T12:00:00');return x.toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric'});
}
function t12(t){if(!t)return '';var p=String(t).split(':'),h=+p[0],m=p[1];return ((h+11)%12+1)+':'+m+(h<12?' AM':' PM')}
// Name code = first 3 letters of the last name + first initial, no space (SMIJ). Only the code is saved.
function nameCode(last,first){
  var l=String(last||'').toUpperCase().replace(/[^A-Z]/g,''),f=String(first||'').toUpperCase().replace(/[^A-Z]/g,'');
  return l&&f?l.slice(0,3)+f[0]:'';
}
function normRoom(v){return String(v||'').toUpperCase().replace(/[^0-9A-Z]/g,'')}

async function rpc(fn,args){
  if(!sb)throw new Error('offline');
  var r=await sb.rpc(fn,args);
  if(r.error){
    if(String(r.error.message).indexOf('bad_pin')>=0){ls('su_pin',null);S.pin=null;showPin('That PIN did not work.');throw new Error('bad_pin')}
    throw new Error(r.error.message);
  }
  return r.data;
}

/* ---------- start: leadership PIN (same as Standup / My Work), then who you are ---------- */
async function start(){
  var q=new URLSearchParams(location.search);if(q.get('tab')==='dc')S.tab='dc';
  S.pin=ls('su_pin');
  if(!S.pin)return showPin();
  try{await boot()}catch(e){if(e.message!=='bad_pin')app().innerHTML='<div class="alert destructive"><i data-lucide="wifi-off"></i><div>Could not load. Check the connection and refresh.<div class="small">'+esc(e.message)+'</div></div></div>';icons()}
}
function showPin(msg){
  document.getElementById('fab').hidden=true;
  app().innerHTML='<div class="card pad"><div class="card-title">Leadership PIN</div><div class="card-desc mt-1">Same PIN as the leadership tools on the hub.</div>'+
    (msg?'<div class="help error mt-2">'+esc(msg)+'</div>':'')+
    '<div class="row mt-2"><input id="pinIn" class="input pin-input" type="tel" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="PIN"><button class="btn" onclick="submitPin()">Open</button></div></div>';
  var i=document.getElementById('pinIn');i.focus();i.onkeydown=function(e){if(e.key==='Enter')submitPin()};
}
async function submitPin(){
  var v=document.getElementById('pinIn').value.trim();if(!v)return;
  try{await rpc('work_roster',{p_pin:v});S.pin=v;
    // Shared iPads never remember the PIN; personal phones do (same rule as the hub).
    if(!(window.MS&&MS.identity&&MS.identity.isShared()))ls('su_pin',v);
    await boot()}catch(e){if(e.message!=='bad_pin')showPin('Could not connect: '+e.message)}
}
async function boot(){
  var r=await rpc('work_roster',{p_pin:S.pin});
  S.owners=(r.owners||[]).filter(function(o){return o.active!==false});
  var key=ls('mw_owner');
  if(!key&&window.MS&&MS.identity){
    var hit=MS.identity.matchName(S.owners.map(function(o){return o.display_name}));
    if(hit)key=(S.owners.filter(function(o){return o.display_name===hit})[0]||{}).owner_key;
  }
  S.me=S.owners.filter(function(o){return o.owner_key===key})[0]||null;
  setWho();
  if(!S.me)return pickWho();
  await refresh();render();
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.me&&!S.form)refresh().then(render)});
}
function setWho(){var c=document.getElementById('whoChip');c.textContent=S.me?S.me.display_name:'';c.style.display=S.me?'':'none'}
function pickWho(){
  if(!S.owners.length)return;
  document.getElementById('fab').hidden=true;
  app().innerHTML='<div class="card pad"><div class="card-title">Who is entering trips?</div><div class="card-desc mt-1">Your name is saved with each entry.</div>'+
    '<div class="list mt-2">'+S.owners.map(function(o){return '<div class="list-item" onclick="setMe(\''+o.owner_key+'\')"><div class="body"><div class="title">'+esc(o.display_name)+'</div><div class="meta">'+esc(o.department||'')+'</div></div><i data-lucide="chevron-right" class="chev"></i></div>'}).join('')+'</div></div>';
  icons();
}
async function setMe(k){S.me=S.owners.filter(function(o){return o.owner_key===k})[0];ls('mw_owner',k);setWho();await refresh();render()}

async function refresh(){
  var d=await rpc('trips_list',{p_pin:S.pin});
  S.today=d.today;S.rows=d.rows||[];S.occ=d.occ||[];
}
function byId(id){return S.rows.filter(function(r){return r.id===id})[0]}

/* ---------- list ---------- */
function render(){
  S.form=null;
  document.getElementById('fab').hidden=false;
  var kind=S.tab, h='<div class="tabs"><button class="'+(kind==='appt'?'on':'')+'" onclick="setTab(\'appt\')"><i data-lucide="bus" class="icon-sm"></i> Appointments</button>'+
    '<button class="'+(kind==='dc'?'on':'')+'" onclick="setTab(\'dc\')"><i data-lucide="door-open" class="icon-sm"></i> Discharges</button></div>';
  // Upcoming occurrences of this kind, grouped by day
  var occ=S.occ.filter(function(o){var r=byId(o.id);return r&&r.kind===kind&&o.date>=S.today});
  // Discharges whose date has passed but PCC has not shown them leaving yet
  var late=kind==='dc'?S.rows.filter(function(r){return r.kind==='dc'&&r.status==='scheduled'&&r.trip_date<S.today}):[];
  if(late.length){
    h+='<div class="day-h" style="color:var(--destructive)">Past date · not confirmed<span class="n">'+late.length+'</span></div>';
    h+=late.map(function(r){return tripRow(r,r.trip_date,'late')}).join('');
    h+='<div class="note">These clear on their own when PCC shows the discharge. If the date moved, open it and change the date.</div>';
  }
  if(!occ.length&&!late.length){
    h+='<div class="empty mt-3"><i data-lucide="'+(kind==='appt'?'calendar-check':'house')+'"></i><div class="e-title">Nothing scheduled</div><div class="e-desc">'+
      (kind==='appt'?'Tap “New appointment” to add one. It shows on the iPad banner for the next 7 days.':'Tap “New discharge” to add one. It starts the discharge checklist in My Work.')+'</div></div>';
  }
  var cur=null;
  occ.forEach(function(o){
    if(o.date!==cur){cur=o.date;var n=occ.filter(function(x){return x.date===cur}).length;
      h+='<div class="day-h'+(cur===S.today?' today':'')+'">'+esc(dayLabel(cur))+(cur>addDays(S.today,7)?' · not on banner yet':'')+'<span class="n">'+n+'</span></div>'}
    h+=tripRow(byId(o.id),o.date,'');
  });
  // Repeating appointments (series view) and recently closed
  if(kind==='appt'){
    var rep=S.rows.filter(function(r){return r.kind==='appt'&&r.status==='scheduled'&&r.repeat_days});
    if(rep.length){h+='<div class="day-h">Repeats every week<span class="n">'+rep.length+'</span></div>'+rep.map(function(r){return tripRow(r,null,'')}).join('')}
  }
  var closed=S.rows.filter(function(r){return r.kind===kind&&r.status!=='scheduled'});
  if(closed.length){
    h+='<details class="mt-3"><summary class="day-h" style="cursor:pointer">Done or cancelled · last 14 days<span class="n">'+closed.length+'</span></summary>'+
      closed.map(function(r){return tripRow(r,r.trip_date,'dim')}).join('')+'</details>';
  }
  app().innerHTML=h;icons();
}
function setTab(k){S.tab=k;try{history.replaceState(null,'','?tab='+k)}catch(e){}render()}
function repeatTxt(r){
  if(!r.repeat_days)return '';
  var m={};DOW.forEach(function(d){m[d[0]]=d[1]});
  return r.repeat_days.map(function(d){return m[d]}).join(' / ')+(r.repeat_until?' until '+dayLabel(r.repeat_until):'');
}
function tripRow(r,date,cls){
  if(!r)return '';
  var who='Rm '+esc(r.room_bed)+(r.code?' · '+esc(r.code):'');
  var sub, right;
  if(r.kind==='appt'){
    sub=[r.appt_type,r.provider].filter(Boolean).map(esc).join(' · ')||'Appointment';
    if(!date&&r.repeat_days)sub=esc(repeatTxt(r))+' · '+sub;
    right=(r.pickup_time?'Pickup '+t12(r.pickup_time):'')+(r.appt_time?'<small>Appt '+t12(r.appt_time)+(r.return_time?' · back ~'+t12(r.return_time):'')+'</small>':'');
  }else{
    sub=esc(r.dc_destination||'Discharge')+(r.list_total?' · checklist '+(r.list_total-r.list_open)+' of '+r.list_total+' done':'');
    right=(r.appt_time?t12(r.appt_time):'')+(r.pickup_time?'<small>Pickup '+t12(r.pickup_time)+'</small>':'');
  }
  if(r.status!=='scheduled')right='<span class="badge '+(r.status==='done'?'success':'outline')+'">'+(r.status==='done'?(r.done_source==='pcc'?'Done · PCC':'Done'):'Cancelled')+'</span>';
  else if(date&&r.repeat_days)sub='<i data-lucide="repeat" class="icon-sm"></i> '+sub;
  return '<div class="trip '+cls+'" onclick="openDetail(\''+r.id+'\''+(date?',\''+date+'\'':'')+')"><span class="ic '+r.kind+'"><i data-lucide="'+(r.kind==='appt'?'bus':'door-open')+'"></i></span>'+
    '<div class="b"><div class="t1">'+who+(date&&cls!=='dim'&&cls!=='late'?'':(date?' <span class="muted small">'+esc(dayLabel(date))+'</span>':''))+'</div><div class="t2">'+sub+'</div></div><div class="r">'+right+'</div></div>';
}

/* ---------- detail ---------- */
function openDetail(id,date){
  var r=byId(id);if(!r)return;
  S.form={detail:id};document.getElementById('fab').hidden=true;
  function kv(k,v){return v?'<dt>'+k+'</dt><dd>'+v+'</dd>':''}
  var h='<span class="back" onclick="render()"><i data-lucide="chevron-left"></i>Back</span>'+
    '<div class="card pad"><div class="row between"><div class="card-title">Rm '+esc(r.room_bed)+(r.code?' · '+esc(r.code):'')+'</div>'+
    '<span class="badge '+(r.kind==='appt'?'info':'purple')+'">'+(r.kind==='appt'?'Appointment':'Discharge')+'</span></div><dl class="kv">'+
    kv('Date',esc(date?dayLabel(date):dayLabel(r.trip_date))+(r.repeat_days?' <span class="muted">(repeats '+esc(repeatTxt(r))+')</span>':''))+
    kv(r.kind==='appt'?'Appointment':'Leaving at',t12(r.appt_time))+
    kv('Type',esc(r.appt_type))+kv('Provider',esc(r.provider))+kv('Provider phone',r.provider_phone?'<a href="tel:'+esc(r.provider_phone)+'">'+esc(r.provider_phone)+'</a>':'')+
    kv('Address',esc(r.provider_address))+kv('Going to',esc(r.dc_destination))+
    kv('Transport',esc([r.transport_type,r.transport_company].filter(Boolean).join(' · ')))+
    kv('Transport phone',r.transport_phone?'<a href="tel:'+esc(r.transport_phone)+'">'+esc(r.transport_phone)+'</a>':'')+
    kv('Confirmation #',esc(r.confirmation))+kv('Pickup',t12(r.pickup_time))+kv('Back about',t12(r.return_time))+
    kv('Going with',esc(r.escort))+kv('Special needs',esc(r.special_needs))+kv('Notes',esc(r.notes).replace(/\n/g,'<br>'))+
    kv('Checklist',r.list_total?(r.list_total-r.list_open)+' of '+r.list_total+' steps done · <a href="../my-work/">open My Work</a>':'')+
    kv('Entered by',esc(ownerName(r.created_by)))+(r.updated_by&&r.updated_by!==r.created_by?kv('Last change',esc(ownerName(r.updated_by))):'')+
    '</dl></div><div class="actions">';
  if(r.status==='scheduled'){
    h+='<button class="btn outline block" onclick="openForm(\''+r.kind+'\',\''+r.id+'\')"><i data-lucide="pencil"></i>Edit</button>';
    if(r.kind==='dc')h+='<button class="btn success block" onclick="setStatus(\''+r.id+'\',\'done\')"><i data-lucide="check"></i>Resident has left · mark done</button>';
    if(r.repeat_days&&date)h+='<button class="btn secondary block" onclick="setStatus(\''+r.id+'\',\'cancelled\',\''+date+'\')"><i data-lucide="calendar-x"></i>Cancel just '+esc(dayLabel(date))+'</button>';
    h+='<button class="btn ghost block" style="color:var(--destructive)" onclick="setStatus(\''+r.id+'\',\'cancelled\')"><i data-lucide="x"></i>'+(r.repeat_days?'Stop the whole series':'Cancel '+(r.kind==='appt'?'appointment':'discharge'))+'</button>';
  }else{
    h+='<button class="btn outline block" onclick="setStatus(\''+r.id+'\',\'scheduled\')"><i data-lucide="rotate-ccw"></i>Put back on the schedule</button>';
  }
  if(r.repeat_days&&(r.skip_dates||[]).length){
    h+='<div class="note">Cancelled dates: '+r.skip_dates.map(function(d){return '<a href="#" onclick="setStatus(\''+r.id+'\',\'scheduled\',\''+d+'\');return false">'+esc(dayLabel(d))+' (undo)</a>'}).join(', ')+'</div>';
  }
  app().innerHTML=h+'</div>';icons();window.scrollTo(0,0);
}
function ownerName(k){var o=S.owners.filter(function(x){return x.owner_key===k})[0];return o?o.display_name:(k==='pcc'?'PCC feed':k||'')}
async function setStatus(id,st,on){
  var r=byId(id);
  if(st==='cancelled'&&!on){
    var msg=r.kind==='dc'?'This also cancels the discharge checklist in My Work.':r.repeat_days?'Every future date in this series comes off the schedule.':'It comes off the iPad banner.';
    var ok=window.MS&&MS.confirm?await MS.confirm({title:r.repeat_days?'Stop this series?':'Cancel this '+(r.kind==='appt'?'appointment':'discharge')+'?',desc:msg,confirmText:'Yes, cancel',cancelText:'Keep it',destructive:true}):confirm(msg);
    if(!ok)return;
  }
  if(S.busy)return;S.busy=true;
  try{await rpc('trips_set_status',{p_pin:S.pin,p_actor:S.me.owner_key,p_id:id,p_status:st,p_on:on||null});await refresh();
    toast(st==='done'?'Marked done':st==='cancelled'?(on?'Cancelled for '+dayLabel(on):'Cancelled'):'Back on the schedule','success');render()}
  catch(e){if(e.message!=='bad_pin')toast('Not saved: '+e.message,'destructive')}
  finally{S.busy=false}
}

/* ---------- form ---------- */
function opt(list,v){var h='<option value="">Choose…</option>',found=false;list.forEach(function(x){if(x===v)found=true;h+='<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>'});if(v&&!found)h+='<option selected>'+esc(v)+'</option>';return h}
function inp(id,label,v,type,ph,extra){return '<div class="fld"><label for="'+id+'">'+label+'</label><input class="input" id="'+id+'" type="'+(type||'text')+'" value="'+esc(v||'')+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+(extra||'')+'></div>'}
function tm(v){return v?String(v).slice(0,5):''}
function openForm(kind,id){
  var r=id?byId(id):{kind:kind,trip_date:S.today,repeat_days:null};
  S.form={kind:kind,id:id||null,days:(r.repeat_days||[]).slice()};
  document.getElementById('fab').hidden=true;
  var A=kind==='appt';
  var h='<span class="back" onclick="'+(id?'openDetail(\''+id+'\')':'render()')+'"><i data-lucide="chevron-left"></i>'+(id?'Back':'Cancel')+'</span>'+
    '<div class="card pad form"><div class="card-title">'+(id?'Edit ':'New ')+(A?'appointment':'discharge')+'</div>'+
    '<div class="card-desc mt-1">'+(A?'Enter everything: the appointment, the ride, and the pickup and return times. Nobody else fills in the transport.':
      'Saving a new discharge starts the 7-step discharge checklist in My Work for Social Services.')+'</div>'+
    '<div class="fs-h mt-3"><i data-lucide="user-round" class="icon-sm"></i>Resident</div>'+
    '<div class="two">'+inp('f_room','Room-bed',r.room_bed,'text','12A',' autocapitalize="characters" maxlength="4"')+
      '<div><label>Name code</label><div class="codebox" style="margin-top:0;min-height:48px"><b id="codeOut">'+esc(r.code||'—')+'</b></div></div></div>'+
    '<div class="two">'+inp('f_last','Last name','','text','Not saved',' autocomplete="off" autocapitalize="words"')+inp('f_first','First name','','text','Not saved',' autocomplete="off" autocapitalize="words"')+'</div>'+
    '<div class="note">Only the room-bed and the code (first 3 letters of the last name + first initial) are saved. The name you type here is not stored.'+(id?' Leave the name blank to keep the current code.':'')+'</div>';
  if(A){
    h+='<div class="fs"><div class="fs-h"><i data-lucide="calendar" class="icon-sm"></i>Appointment</div>'+
      '<div class="two">'+inp('f_date',r.repeat_days?'First date':'Date',r.trip_date,'date')+inp('f_time','Appointment time',tm(r.appt_time),'time')+'</div>'+
      '<label>Repeats every week?</label><div class="days" id="days">'+DOW.map(function(d){return '<button type="button" class="chip'+(S.form.days.indexOf(d[0])>=0?' on':'')+'" data-d="'+d[0]+'">'+d[1]+'</button>'}).join('')+'</div>'+
      '<div class="note">Leave all days off for a one-time trip. Dialysis on Mon / Wed / Fri: tap those three.</div>'+
      '<div id="untilRow"'+(S.form.days.length?'':' hidden')+'>'+inp('f_until','Repeat until (optional)',r.repeat_until,'date')+'</div>'+
      '<label for="f_type">Type</label><select class="select" id="f_type">'+opt(APPT_TYPES,r.appt_type)+'</select>'+
      inp('f_provider','Provider / facility',r.provider,'text','Clinic or doctor')+
      '<div class="two">'+inp('f_pphone','Provider phone',r.provider_phone,'tel')+inp('f_addr','Address',r.provider_address,'text')+'</div></div>';
  }else{
    h+='<div class="fs"><div class="fs-h"><i data-lucide="calendar" class="icon-sm"></i>Discharge</div>'+
      '<div class="two">'+inp('f_date','Discharge date',r.trip_date,'date')+inp('f_time','Leaving at (if known)',tm(r.appt_time),'time')+'</div>'+
      '<label for="f_dest">Going to</label><select class="select" id="f_dest">'+opt(DEST,r.dc_destination)+'</select></div>';
  }
  h+='<div class="fs"><div class="fs-h"><i data-lucide="bus" class="icon-sm"></i>Transportation</div>'+
    '<label for="f_ttype">How</label><select class="select" id="f_ttype">'+opt(TRANSPORT,r.transport_type)+'</select>'+
    '<div class="two">'+inp('f_tco','Company',r.transport_company,'text')+inp('f_tphone','Company phone',r.transport_phone,'tel')+'</div>'+
    '<div class="three">'+inp('f_pick','Pickup time',tm(r.pickup_time),'time')+(A?inp('f_back','Back about',tm(r.return_time),'time'):'')+inp('f_conf','Confirmation #',r.confirmation,'text')+'</div>'+
    inp('f_escort','Going with',r.escort,'text','Family, staff, or alone')+
    '<label for="f_needs">Special needs</label><textarea class="textarea" id="f_needs" placeholder="Oxygen, wheelchair, sack lunch, paperwork to send">'+esc(r.special_needs||'')+'</textarea>'+
    '<label for="f_notes">Notes</label><textarea class="textarea" id="f_notes">'+esc(r.notes||'')+'</textarea></div>'+
    '<div class="help error mt-2" id="fErr" hidden></div>'+
    '<div class="actions"><button class="btn block lg" id="saveBtn" onclick="saveForm()"><i data-lucide="check"></i>Save</button></div></div>';
  app().innerHTML=h;icons();window.scrollTo(0,0);
  function upd(){var c=nameCode(val('f_last'),val('f_first'));document.getElementById('codeOut').textContent=c||(r.code&&!val('f_last')&&!val('f_first')?r.code:'—')}
  ['f_last','f_first'].forEach(function(i){document.getElementById(i).addEventListener('input',upd)});
  var dd=document.getElementById('days');
  if(dd)dd.addEventListener('click',function(e){var b=e.target.closest('[data-d]');if(!b)return;var d=+b.getAttribute('data-d'),i=S.form.days.indexOf(d);
    if(i>=0)S.form.days.splice(i,1);else S.form.days.push(d);b.classList.toggle('on',i<0);document.getElementById('untilRow').hidden=!S.form.days.length});
}
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
async function saveForm(){
  var f=S.form,A=f.kind==='appt',old=f.id?byId(f.id):null,err=document.getElementById('fErr');
  function bad(m){err.textContent=m;err.hidden=false;err.scrollIntoView({block:'center',behavior:'smooth'})}
  var room=normRoom(val('f_room'));
  if(!/^[0-9]{1,2}[A-H]$/.test(room))return bad('Enter the room-bed like 12A.');
  var code=nameCode(val('f_last'),val('f_first'));
  if((val('f_last')||val('f_first'))&&!code)return bad('Enter both the last and first name to make the code, or leave both blank.');
  if(!code&&old)code=old.code;
  if(!code)return bad('Enter the resident’s last and first name so the code can be made.');
  if(!val('f_date'))return bad('Pick a date.');
  if(A&&!val('f_time'))return bad('Enter the appointment time.');
  if(A&&!val('f_pick'))return bad('Enter the pickup time so the floor knows when to have the resident ready.');
  var row={id:f.id,kind:f.kind,room_bed:room,code:code,trip_date:val('f_date'),appt_time:val('f_time'),
    transport_type:val('f_ttype'),transport_company:val('f_tco'),transport_phone:val('f_tphone'),pickup_time:val('f_pick'),
    confirmation:val('f_conf'),escort:val('f_escort'),special_needs:val('f_needs'),notes:val('f_notes')};
  if(A){row.repeat_days=f.days.slice().sort();row.repeat_until=val('f_until');row.return_time=val('f_back');
    row.appt_type=val('f_type');row.provider=val('f_provider');row.provider_phone=val('f_pphone');row.provider_address=val('f_addr')}
  else row.dc_destination=val('f_dest');
  if(S.busy)return;S.busy=true;var b=document.getElementById('saveBtn');b.disabled=true;
  try{
    var id=await rpc('trips_save',{p_pin:S.pin,p_actor:S.me.owner_key,p_row:row});
    await refresh();S.tab=f.kind;
    toast(f.id?'Saved':(A?'Saved · on the iPad banner':'Saved · discharge checklist started in My Work'),'success');
    openDetail(id,row.repeat_days&&row.repeat_days.length?null:row.trip_date);
  }catch(e){if(e.message!=='bad_pin')bad('Not saved: '+e.message)}
  finally{S.busy=false;if(b)b.disabled=false}
}
start();
</script>
