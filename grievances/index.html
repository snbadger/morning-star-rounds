<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Morning Star — Resident Grievance</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#1a3c5e;--primary-light:#2980b9;--accent:#e67e22;--success:#27ae60;--danger:#e74c3c;--warn:#f39c12;--bg:#f0f2f5;--card:#fff;--text:#2c3e50;--text-light:#7f8c8d;--border:#dce1e6;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:40px}
.header{background:linear-gradient(135deg,#0d2137,var(--primary));color:#fff;padding:14px 18px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:17px;font-weight:800;letter-spacing:.3px}
.header .sub{font-size:11px;opacity:.75;margin-top:2px}
.header .sub a{color:#9ec5e8;text-decoration:none}
.who{font-size:12px;background:rgba(255,255,255,.15);padding:5px 10px;border-radius:16px;cursor:pointer;white-space:nowrap}
.page{max-width:620px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--border)}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;text-align:center;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-accent{background:var(--accent);color:#fff}
.btn-ghost{background:#fff;color:var(--primary);border:2px solid var(--primary)}
.btn:disabled{opacity:.5}
label{display:block;font-size:12px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 6px}
label .opt{text-transform:none;letter-spacing:0;font-weight:600;color:#aab3ba}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;background:#fff;color:var(--text);font-family:inherit}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-light)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{font-size:13px;font-weight:600;padding:9px 13px;border-radius:20px;background:#fff;border:1.5px solid var(--border);color:var(--text-light);cursor:pointer;user-select:none}
.cat.on{background:var(--primary);border-color:var(--primary);color:#fff}
/* stacked, full-width choice cards with a definition line (used where the difference matters) */
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#fff;border:1.5px solid var(--border);cursor:pointer;user-select:none}
.choice .ck{width:22px;height:22px;border-radius:50%;border:2px solid #c5ccd3;flex:none;margin-top:1px}
.choice.on{border-color:var(--primary);background:#eef4fa}
.choice.on .ck{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 4px #fff}
.choice .cl{font-size:15px;font-weight:700;color:var(--text)}
.choice .cd{font-size:12.5px;color:var(--text-light);line-height:1.45;margin-top:2px}
.hint{font-size:12.5px;color:var(--text-light);margin-top:7px;line-height:1.5}
.nophi{font-size:12.5px;line-height:1.5;margin-top:7px;padding:8px 10px;border-radius:8px;background:#eef6fb;border:1px solid #cfe3f1;color:#1f4e79}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2c3e50;color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.thanks{text-align:center;padding:26px 14px}
.thanks .big{font-size:52px;line-height:1}
.thanks h2{color:var(--success);margin:12px 0 8px;font-size:22px}
.thanks p{color:var(--text-light);font-size:14.5px;line-height:1.6;max-width:390px;margin:0 auto}
.urgent-row{display:flex;align-items:center;gap:12px;background:#fdf3f2;border:1.5px solid #f0d4d1;border-radius:10px;padding:12px;margin-top:16px;cursor:pointer;user-select:none}
.urgent-row.on{background:var(--danger);border-color:var(--danger);color:#fff}
.urgent-row .t{font-size:14px;font-weight:700}
.urgent-row .d{font-size:12px;opacity:.8}
.handoff{display:flex;align-items:center;gap:12px;background:#eef6fb;border:1.5px solid #cfe3f1;border-radius:10px;padding:12px;margin-top:16px;cursor:pointer;user-select:none}
.handoff .t{font-size:14px;font-weight:700;color:var(--primary)}
.handoff .d{font-size:12px;color:var(--text-light)}
.load{text-align:center;color:var(--text-light);padding:34px;font-size:14px}
.empty{text-align:center;color:var(--text-light);font-size:14px;padding:30px 10px;line-height:1.6}
/* Resident / family self-entry mode: larger type, simpler language */
body.resident .page{max-width:680px}
body.resident .card{padding:20px}
body.resident label{font-size:14px;margin-top:22px}
body.resident input,body.resident select,body.resident textarea{font-size:19px;padding:14px}
body.resident textarea{min-height:130px}
body.resident .cat{font-size:16px;padding:12px 16px}
body.resident .choice .cl{font-size:17px}
body.resident .choice .cd{font-size:14px}
body.resident .btn{font-size:19px;padding:18px}
body.resident .hint{font-size:14px}
body.resident .urgent-row .t{font-size:16px}
body.resident .urgent-row .d{font-size:13.5px}
.rtitle{font-size:22px;font-weight:800;color:var(--primary);line-height:1.3}
.rsub{font-size:16px;line-height:1.55;margin-top:6px}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>🗣️ Resident Grievance</h1>
    <div class="sub"><a href="../">← All Apps</a> · Morning Star Post Acute</div>
  </div>
  <div class="who" id="whoChip" onclick="editIdentity()">Sign in</div>
</div>
<div class="page" id="app"><div class="load">Loading…</div></div>
<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL='https://pmnudshutxwidxdtouqj.supabase.co';
var SUPABASE_KEY='sb_publishable_wzX5nLx18cfErNTRPO671w_sH4ED7ET';
var NOTIFY_URL=SUPABASE_URL+'/functions/v1/grievance-notify';
var sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;

var WORK_DEPTS=["Nursing (CNA)","Nursing (LVN/RN)","Dietary","Housekeeping","Laundry","Maintenance",
"Activities","Social Services","Business Office","Medical Records","Admissions","HR / Staffing",
"Therapy / Rehab","MDS","Staff Education","Administration","Other"];

// Departments a concern can be ABOUT (what the resident/family is unhappy with).
var ABOUT_DEPTS=["Nursing care","Dietary / meals","Housekeeping / laundry","Maintenance / building","Activities",
"Therapy / Rehab","Social Services / discharge","Billing / Business Office","Admissions","Medical / physician","Other / not sure"];

// Staff-facing categories, each with a plain-language definition so the grievance / complaint
// distinction is made at the point of entry (the TLCG log tracks them separately).
var CATS=[
 {v:'grievance',l:'Grievance',
  d:'They are not satisfied with their care, treatment, rights, or how staff treated them, and they want it looked into and answered. Gets a formal follow-up and a written response.'},
 {v:'complaint',l:'Complaint / concern',
  d:'An everyday problem that can usually be fixed right away — cold food, a TV that doesn\'t work, a late shower. Still logged, still followed up.'},
 {v:'theft',l:'Theft',
  d:'They believe something was taken from them.'},
 {v:'loss',l:'Lost item',
  d:'Something is missing — glasses, dentures, clothing, hearing aid — but no one thinks it was taken.'}
];
// Resident-facing wording for the same four categories.
var RCATS=[
 {v:'grievance',l:'A concern about my care or how I\'m treated',
  d:'I want this looked into and answered — my care, my rights, or the way someone treated me.'},
 {v:'complaint',l:'A problem that should be fixed',
  d:'Something everyday — my food, my room, the TV, a service that didn\'t happen.'},
 {v:'loss',l:'Something of mine is missing',
  d:'Glasses, dentures, clothing, or another belonging I can\'t find.'},
 {v:'theft',l:'I believe something was taken from me',
  d:'A belonging that I think someone took.'}
];
var RAISED=["Resident","Family / visitor","Staff (on a resident's behalf)","Resident Council","Ombudsman","Anonymous"];

// Same identity keys as the Ideas / Repairs / Shout Outs apps — sign in once, recognized everywhere on this site.
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var me={name:lsGet('ii_name')||'',dept:lsGet('ii_dept')||''};
var view='submit', form=blankForm(), busy=false;
var mode='staff'; // 'staff' = a staff member logs it; 'resident' = device handed to the resident / family member

function blankForm(){return{category:'',raised_by:'',room:'',resident_name:'',about:'',description:'',wish:'',urgent:false}}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2800)}
function whoChip(){document.getElementById('whoChip').textContent=me.name?('👤 '+me.name.split(' ')[0]):'Sign in'}
function editIdentity(){if(mode==='resident')return;view='identity';render()}
function go(v){view=v;render();window.scrollTo(0,0)}

function opts(list,sel,ph){
  var h=ph?'<option value="">'+esc(ph)+'</option>':'';
  list.forEach(function(o){h+='<option value="'+esc(o)+'"'+(String(sel)===String(o)?' selected':'')+'>'+esc(o)+'</option>'});
  return h;
}
function choiceList(list,sel,fn){
  return '<div class="choices">'+list.map(function(c){
    return '<div class="choice'+(sel===c.v?' on':'')+'" onclick="'+fn+'(\''+c.v+'\')"><div class="ck"></div><div><div class="cl">'+c.l+'</div><div class="cd">'+c.d+'</div></div></div>';
  }).join('')+'</div>';
}
function identityView(){
  return '<div class="card">'+
   '<h2 style="font-size:18px;margin-bottom:4px">Who are you?</h2>'+
   '<div class="hint">So Social Services can follow up with you if they have a question.</div>'+
   '<label>Your name</label>'+
   '<input id="iName" value="'+esc(me.name)+'" placeholder="First and last name" autocomplete="name">'+
   '<label>Where do you work?</label>'+
   '<select id="iDept">'+opts(WORK_DEPTS,me.dept,'Select your department…')+'</select>'+
   '<div style="height:20px"></div>'+
   '<button class="btn btn-primary" onclick="saveIdentity()">Continue</button>'+
   '</div>';
}
function saveIdentity(){
  var n=document.getElementById('iName').value.trim(), d=document.getElementById('iDept').value;
  if(n.length<3){toast('Please enter your first and last name');return}
  if(!d){toast('Please pick your department');return}
  me.name=n;me.dept=d;
  lsSet('ii_name',n);lsSet('ii_dept',d);
  view='submit';render();
}

// ---------------- Staff form ----------------
function submitView(){
  return '<div class="card">'+
   '<div style="font-size:15px;line-height:1.55"><b>Did a resident or family member share a concern with you?</b> '+
   'Log it here. Social Services gets a task and the Administrator is notified right away — every concern gets a follow-up.</div>'+
   '<div class="handoff" onclick="startResident()"><span style="font-size:24px">🤝</span><div><div class="t">Let them fill it out themselves</div>'+
   '<div class="d">Hand this device to the resident or family member — they get a simple, large-print form</div></div></div>'+
   '<label>What kind of concern?</label>'+
   choiceList(CATS,form.category,'pickCat')+
   '<label>Who raised it?</label>'+
   '<select id="fRaised">'+opts(RAISED,form.raised_by,'Select…')+'</select>'+
   '<label>Resident <span class="opt">— last name, first initial</span></label>'+
   '<input id="fResName" value="'+esc(form.resident_name)+'" placeholder="e.g. Smith, J." autocomplete="off" autocapitalize="words">'+
   '<label>Room number</label>'+
   '<input id="fRoom" value="'+esc(form.room)+'" placeholder="e.g. 12 or 12B" autocomplete="off">'+
   '<label>What is it about? <span class="opt">— optional</span></label>'+
   '<select id="fAbout">'+opts(ABOUT_DEPTS,form.about,'Select a department or area…')+'</select>'+
   '<label>What did they tell you?</label>'+
   '<textarea id="fDesc" placeholder="In their words as best you can — what happened, when, and what they would like to see happen.">'+esc(form.description)+'</textarea>'+
   '<div class="nophi">🔒 <b>Last name and first initial only.</b> Don\'t include diagnoses, medications, or other private health details — Social Services will pull those from the chart.</div>'+
   '<div class="urgent-row'+(form.urgent?' on':'')+'" onclick="toggleUrgent()">'+
   '<span style="font-size:22px">🚨</span><div><div class="t">This needs attention today</div>'+
   '<div class="d">The resident is upset now, or it affects their care or comfort right now</div></div></div>'+
   '<div style="height:20px"></div>'+
   '<button class="btn btn-accent" id="subBtn" onclick="submitGrievance()">Send to Social Services</button>'+
   '<div class="hint" style="text-align:center;margin-top:10px">Logging as <b>'+esc(me.name)+'</b> · '+esc(me.dept)+
   ' &nbsp;<a href="#" onclick="editIdentity();return false" style="color:var(--primary-light)">change</a></div>'+
   '</div>'+
   '<div class="card" style="background:#fdecea;border-color:#f5c6c2">'+
   '<div style="font-size:13px;line-height:1.6;color:#922b21">'+
   '<b>Suspected abuse, neglect, or mistreatment is not a grievance.</b> Don\'t wait on this form — tell the charge nurse and the Administrator <b>immediately</b>. Abuse reporting has its own required steps and time limits.'+
   '</div></div>';
}

// ---------------- Resident / family self-entry form ----------------
function startResident(){readForm();form=blankForm();form.raised_by='Resident';mode='resident';view='submit';document.body.classList.add('resident');render();window.scrollTo(0,0)}
function endResident(){form=blankForm();mode='staff';view='submit';document.body.classList.remove('resident');render();window.scrollTo(0,0)}
function pickRaised(v){readForm();form.raised_by=v;render()}
function residentView(){
  var fam=form.raised_by==='Family / visitor';
  return '<div class="card">'+
   '<div class="rtitle">We want to hear from you.</div>'+
   '<div class="rsub">Tell us what\'s wrong and we\'ll follow up with you. Sharing a concern will never affect your care.</div>'+
   '<label>I am</label>'+
   '<div class="cats">'+
   '<div class="cat'+(!fam?' on':'')+'" onclick="pickRaised(\'Resident\')">A resident</div>'+
   '<div class="cat'+(fam?' on':'')+'" onclick="pickRaised(\'Family / visitor\')">A family member or visitor</div>'+
   '</div>'+
   '<label>'+(fam?'The resident\'s name':'Your name')+' <span class="opt">— last name, first initial</span></label>'+
   '<input id="fResName" value="'+esc(form.resident_name)+'" placeholder="e.g. Smith, J." autocomplete="off" autocapitalize="words">'+
   '<label>Room number</label>'+
   '<input id="fRoom" value="'+esc(form.room)+'" placeholder="e.g. 12" autocomplete="off">'+
   '<label>This is about</label>'+
   choiceList(RCATS,form.category,'pickCat')+
   '<label>What happened?</label>'+
   '<textarea id="fDesc" placeholder="Tell us in your own words — what happened and when.">'+esc(form.description)+'</textarea>'+
   '<label>What would make it right? <span class="opt">— optional</span></label>'+
   '<textarea id="fWish" style="min-height:80px" placeholder="What would you like to see happen?">'+esc(form.wish)+'</textarea>'+
   '<div class="urgent-row'+(form.urgent?' on':'')+'" onclick="toggleUrgent()">'+
   '<span style="font-size:24px">🚨</span><div><div class="t">I need someone today</div>'+
   '<div class="d">This is affecting me right now</div></div></div>'+
   '<div style="height:22px"></div>'+
   '<button class="btn btn-accent" id="subBtn" onclick="submitGrievance()">Send to Social Services</button>'+
   '<div class="hint" style="text-align:center;margin-top:12px">Your concern goes to the Social Services Director and the Administrator. '+
   '<a href="#" onclick="endResident();return false" style="color:var(--primary-light)">Cancel and return to staff</a></div>'+
   '</div>';
}
function residentThanksView(){
  return '<div class="card thanks">'+
   '<div class="big">💙</div>'+
   '<h2>Thank you.</h2>'+
   '<p style="font-size:17px">Your concern has been sent to our Social Services Director and the Administrator. Someone will follow up with you in person.</p>'+
   '<p style="margin-top:14px;font-size:15px">You can now hand the device back to the staff member.</p>'+
   '<div style="height:24px"></div>'+
   '<button class="btn btn-primary" onclick="endResident()">Done</button>'+
   '</div>';
}

// ---------------- Shared handlers ----------------
function pickCat(v){readForm();form.category=(form.category===v?'':v);render()}
function toggleUrgent(){readForm();form.urgent=!form.urgent;render()}
function readForm(){
  var g=function(id){var e=document.getElementById(id);return e?e.value:null};
  var v;
  if((v=g('fRaised'))!==null)form.raised_by=v;
  if((v=g('fRoom'))!==null)form.room=v;
  if((v=g('fResName'))!==null)form.resident_name=v;
  if((v=g('fAbout'))!==null)form.about=v;
  if((v=g('fDesc'))!==null)form.description=v;
  if((v=g('fWish'))!==null)form.wish=v;
}
function looksLikeName(s){
  // Soft check only: a room field that is mostly letters is probably a name.
  var t=(s||'').trim(); if(!t)return false;
  var letters=(t.match(/[a-z]/gi)||[]).length;
  return letters>3 && !/\d/.test(t);
}
async function submitGrievance(){
  if(busy)return;
  readForm();
  var res=mode==='resident';
  if(res&&!form.raised_by)form.raised_by='Resident';
  if(!form.category){toast(res?'Please pick what this is about':'Pick what kind of concern this is');return}
  if(!form.raised_by){toast('Tell us who raised it');return}
  if(looksLikeName(form.room)){toast('Room number only here — the name goes in the name field');return}
  var needsId=form.raised_by!=='Resident Council'&&form.raised_by!=='Anonymous';
  if(needsId&&!form.room.trim()&&!form.resident_name.trim()){toast(res?'Please enter your name or room number':'Enter the resident\'s name or room number');return}
  if(form.description.trim().length<10){toast(res?'Please tell us what happened':'Please describe the concern');return}
  var desc=form.description.trim();
  if(form.wish&&form.wish.trim())desc+='\n\nWhat would make it right: '+form.wish.trim();
  busy=true;
  var b=document.getElementById('subBtn');b.disabled=true;b.textContent='Sending…';
  // RPC only, never a direct insert — the grievances table is locked to the service role.
  var r=await sb.rpc('submit_grievance',{
    p_name:me.name, p_dept:me.dept,
    p_category:form.category,
    p_raised_by:form.raised_by,
    p_description:desc,
    p_room:form.room.trim()||null,
    p_about_dept:(!res&&form.about)?form.about:null,
    p_urgent:form.urgent,
    p_resident_name:form.resident_name.trim()||null,
    p_entered_by:res?(form.raised_by==='Family / visitor'?'family':'resident'):'staff'
  });
  busy=false;b.disabled=false;b.textContent='Send to Social Services';
  if(r.error||!r.data){toast('Could not send — '+((r.error&&r.error.message)||'please try again'));return}
  fetch(NOTIFY_URL,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({grievance_id:r.data})}).catch(function(){});
  form=blankForm();
  view='thanks';render();window.scrollTo(0,0);
}
function thanksView(){
  return '<div class="card thanks">'+
   '<div class="big">🗣️</div>'+
   '<h2>Thank you, '+esc(me.name.split(' ')[0])+'.</h2>'+
   '<p>The concern is logged. Social Services has a task for it and the Administrator has been notified. They will follow up with the resident or family.</p>'+
   '<p style="margin-top:12px">If they\'re with you right now, let them know: <b>"Social Services will be following up with you."</b></p>'+
   '<div style="height:22px"></div>'+
   '<button class="btn btn-accent" onclick="go(\'submit\')">Log Another</button>'+
   '<div style="height:9px"></div>'+
   '<button class="btn btn-ghost" style="color:var(--danger);border-color:var(--danger)" onclick="logout()">Done — log out</button>'+
   '</div>';
}

// Shared phone: hand the app back to the next person. Clears the identity shared by
// the Ideas / Repairs / Shout Outs / Supply apps and returns to the Staff Apps home screen.
function logout(){
  try{localStorage.removeItem('ii_name');localStorage.removeItem('ii_dept');}catch(e){}
  location.href='../';
}
function render(){
  whoChip();
  var el=document.getElementById('app');
  if(!me.name||view==='identity'){el.innerHTML=identityView();return}
  if(mode==='resident'){el.innerHTML=(view==='thanks'?residentThanksView():residentView());return}
  if(view==='thanks'){el.innerHTML=thanksView();return}
  el.innerHTML=submitView();
}
if(!sb){document.getElementById('app').innerHTML='<div class="card"><div class="empty">Could not connect. Check your internet and reload.</div></div>';}
else render();
</script>
</body>
</html>
