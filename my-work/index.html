<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Morning Star — My Work</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#1a3c5e;--primary-light:#2980b9;--accent:#e67e22;--success:#1f8a5b;--success-bg:#e7f5ee;--danger:#b3261e;--danger-bg:#fdeceb;--warn:#b57b00;--warn-bg:#fdf3e0;--bg:#f0f2f5;--card:#fff;--text:#2c3e50;--text-light:#6b7a8a;--border:#dfe4ea;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:90px}
.header{background:linear-gradient(135deg,#0d2137,var(--primary));color:#fff;padding:14px 18px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);display:flex;justify-content:space-between;align-items:center;gap:10px}
.header h1{font-size:17px;font-weight:800;letter-spacing:.3px}
.header .sub{font-size:11px;opacity:.8;margin-top:2px}
.header .sub a{color:#9ec5e8;text-decoration:none}
.who{font-size:12px;background:rgba(255,255,255,.15);padding:5px 10px;border-radius:16px;cursor:pointer;white-space:nowrap;border:0;color:#fff;font-family:inherit}
.page{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--border)}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;text-align:center;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-ghost{background:#fff;color:var(--primary);border:2px solid var(--primary)}
.btn-quiet{background:#eef1f4;color:var(--text)}
.btn-danger{background:#fff;color:var(--danger);border:2px solid var(--danger-bg)}
.btn-sm{display:inline-block;width:auto;padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;background:#fff;color:var(--text);font-family:inherit}
textarea{min-height:72px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-light)}
.seg{display:flex;background:#e3e8ee;border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;font-size:13.5px;font-weight:700;color:var(--text-light);border-radius:8px;cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.h2{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--text-light);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.h2 .n{background:#e3e8ee;color:var(--text);border-radius:12px;padding:1px 8px;font-size:11px}
.h2.red{color:var(--danger)} .h2.red .n{background:var(--danger-bg);color:var(--danger)}
.h2.amber{color:var(--warn)} .h2.amber .n{background:var(--warn-bg);color:var(--warn)}
.h2 .tog{margin-left:auto;font-size:11px;font-weight:700;color:var(--primary-light);cursor:pointer;text-transform:none;letter-spacing:0}
.it{display:flex;align-items:flex-start;gap:11px;padding:11px 2px;border-top:1px solid var(--border)}
.it:first-child{border-top:0}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #b0b8c1;background:#fff;cursor:pointer;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.chk.on{background:var(--success);border-color:var(--success)}
.chk.off{border-style:dashed;cursor:default}
.it .b{flex:1;min-width:0;cursor:pointer}
.it .t{font-size:14.5px;font-weight:600;line-height:1.35}
.it .m{font-size:12px;color:var(--text-light);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.it .m .due.red{color:var(--danger);font-weight:700} .it .m .due.amber{color:var(--warn);font-weight:700}
.it .go{color:#b0b8c1;font-size:20px;margin-top:2px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.p-ok{background:var(--success-bg);color:var(--success)} .p-no{background:#eef1f4;color:var(--text-light)}
.p-todo{background:var(--warn-bg);color:var(--warn)} .p-red{background:var(--danger-bg);color:var(--danger)}
.p-auto{background:#e8f0f8;color:#2d5d8a}
.big{font-size:26px;font-weight:800;color:var(--primary)}
.muted{color:var(--text-light);font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2c3e50;color:#fff;padding:11px 18px;border-radius:24px;font-size:13.5px;font-weight:600;z-index:300;box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none;display:flex;gap:14px;align-items:center;max-width:92vw}
.toast.show{opacity:1;pointer-events:auto}
.toast button{background:#fff;color:var(--primary);border:0;border-radius:14px;padding:5px 12px;font-weight:800;font-family:inherit;cursor:pointer}
.load{text-align:center;color:var(--text-light);padding:34px;font-size:14px}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roster button{padding:12px 10px;border-radius:10px;border:1.5px solid var(--border);background:#fff;text-align:left;cursor:pointer;font-family:inherit}
.roster button b{display:block;font-size:14.5px;color:var(--text)}
.roster button span{font-size:12px;color:var(--text-light)}
.lst{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--border);cursor:pointer}
.lst:first-child{border-top:0}
.lst .b{flex:1;min-width:0}
.lst .t{font-size:14.5px;font-weight:700}
.lst .m{font-size:12px;color:var(--text-light);margin-top:2px}
.prog{height:7px;background:#e3e8ee;border-radius:5px;overflow:hidden;margin-top:6px}
.prog span{display:block;height:100%;background:var(--success)}
.fab{position:fixed;right:18px;bottom:22px;background:var(--accent);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-size:15px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;font-family:inherit;z-index:150}
.badge{display:inline-block;min-width:20px;padding:1px 6px;border-radius:12px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;text-align:center;margin-left:6px;vertical-align:1px}
.owner-card{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--border);cursor:pointer}
.owner-card:first-child{border-top:0}
.owner-card .b{flex:1}
.owner-card .nm{font-size:14.5px;font-weight:700}
.owner-card .dp{font-size:12px;color:var(--text-light)}
.kpis{display:flex;gap:6px}
.kpi{min-width:40px;text-align:center;border-radius:8px;padding:4px 6px;font-size:13px;font-weight:800;background:#eef1f4;color:var(--text-light)}
.kpi.red{background:var(--danger-bg);color:var(--danger)} .kpi.amber{background:var(--warn-bg);color:var(--warn)} .kpi.blue{background:#e8f0f8;color:#2d5d8a}
.kpi small{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.note{font-size:13.5px;line-height:1.5;white-space:pre-wrap;background:#fbfcfd;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:8px}
.kv{display:grid;grid-template-columns:1fr 2fr;gap:4px 10px;font-size:13.5px;margin-top:8px}
.kv b{color:var(--text-light);font-weight:600}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.back{display:inline-block;color:var(--primary-light);font-weight:700;font-size:13.5px;cursor:pointer;margin-bottom:10px}
.empty{color:var(--text-light);font-size:13.5px;padding:8px 2px}
.nophi{font-size:12.5px;line-height:1.5;margin-top:10px;padding:8px 10px;border-radius:8px;background:#eef6fb;border:1px solid #cfe3f1;color:#1f4e79}
@media (max-width:420px){.roster{grid-template-columns:1fr}.row2{grid-template-columns:1fr}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>✅ My Work</h1>
    <div class="sub"><a href="../">← All Apps</a> · Morning Star Post Acute</div>
  </div>
  <button class="who" id="whoChip" onclick="switchUser()">Sign in</button>
</div>
<div class="page" id="app"><div class="load">Loading…</div></div>
<button class="fab" id="fab" style="display:none" onclick="openAdd()">+ Add</button>
<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL='https://pmnudshutxwidxdtouqj.supabase.co';
var SUPABASE_KEY='sb_publishable_wzX5nLx18cfErNTRPO671w_sH4ED7ET';
var sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
var ADMIN='stephen_badger';
var SOURCE={rounding:'Room Rounds',floor_rounds:'Floor Rounds',qapi:'QAPI',huddle:'Meeting',improvement_idea:'Ideas board',a3:'A3',standup:'Standup',list:'List',grievance:'Grievance',repair:'Repairs',incident:'Incident',survey:'Survey',admin_call:'Admin call',asana:'Asana',my_work:'',manual:'',session:''};

var S={pin:null,me:null,roster:null,view:'mine',data:null,deptData:null,allData:null,allOwner:null,list:null,item:null,busy:false,loadedAt:0,showDone:false,showLater:true};

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function md(d){if(!d)return '';var p=String(d).slice(0,10).split('-');return (+p[1])+'/'+(+p[2])}
function app(){return document.getElementById('app')}
function today(){return (S.data&&S.data.today)||(S.roster&&S.roster.today)||new Date().toISOString().slice(0,10)}
function addDays(iso,n){var d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function isAdmin(){return S.me&&S.me.owner_key===ADMIN}
function ownerName(k){var o=(S.roster&&S.roster.owners||[]).filter(function(x){return x.owner_key===k})[0];return o?o.display_name:k}
function firstName(k){return ownerName(k).split(' ')[0]}
function setWho(){document.getElementById('whoChip').textContent=S.me?S.me.display_name.split(' ')[0]+' · switch':'Sign in'}

var toastT=null;
function toast(m,undoFn){
  var t=document.getElementById('toast');
  t.innerHTML=esc(m)+(undoFn?'<button id="undoBtn">Undo</button>':'');
  if(undoFn)document.getElementById('undoBtn').onclick=function(){clearTimeout(toastT);t.classList.remove('show');undoFn()};
  t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},undoFn?8000:2600);
}

async function rpc(fn,args){
  if(!sb)throw new Error('offline');
  var r=await sb.rpc(fn,args);
  if(r.error){
    if(String(r.error.message).indexOf('bad_pin')>=0){ls('su_pin',null);S.pin=null;showPin('That PIN did not work.');throw new Error('bad_pin')}
    throw new Error(r.error.message);
  }
  return r.data;
}
async function guard(fn){if(S.busy)return;S.busy=true;try{await fn()}catch(e){if(e.message!=='bad_pin')toast('Not saved: '+e.message)}finally{S.busy=false}}

// ---------- start / PIN / who ----------
async function start(){
  S.pin=ls('su_pin');
  if(!S.pin)return showPin();
  try{await boot()}catch(e){if(e.message!=='bad_pin')app().innerHTML='<div class="card load">Could not load. Check the connection and refresh.<br><span class="muted">'+esc(e.message)+'</span></div>'}
}
async function boot(){
  S.roster=await rpc('work_roster',{p_pin:S.pin});
  var key=ls('mw_owner');
  if(!key){ // first visit: match the name other leadership apps already know
    var nm=ls('su_name')||ls('rl_name')||ls('ii_name')||'';
    var hit=S.roster.owners.filter(function(o){return o.display_name.toLowerCase()===nm.toLowerCase()})[0];
    if(hit)key=hit.owner_key;
  }
  S.me=S.roster.owners.filter(function(o){return o.owner_key===key})[0]||null;
  setWho();
  if(!S.me)return showWho();
  ls('mw_owner',S.me.owner_key);
  await refresh();route();
}
function showPin(msg){
  document.getElementById('fab').style.display='none';
  app().innerHTML='<div class="card"><div class="big" style="font-size:20px">Leadership PIN</div><p class="muted" style="margin-top:6px">Same PIN as the leadership tools on the hub.</p>'+
    (msg?'<p style="color:var(--danger);font-weight:700;margin-top:8px">'+esc(msg)+'</p>':'')+
    '<input id="pinIn" type="tel" inputmode="numeric" maxlength="8" autocomplete="off" style="margin-top:12px;font-size:22px;letter-spacing:4px;text-align:center" placeholder="PIN">'+
    '<button class="btn btn-primary" style="margin-top:12px" onclick="submitPin()">Continue</button></div>';
  var i=document.getElementById('pinIn');i.focus();i.onkeydown=function(e){if(e.key==='Enter')submitPin()};
}
async function submitPin(){
  var v=(document.getElementById('pinIn').value||'').trim();if(!v)return;
  S.pin=v;
  try{await rpc('work_roster',{p_pin:v});ls('su_pin',v);await boot()}catch(e){if(e.message!=='bad_pin')toast('Could not connect: '+e.message)}
}
function showWho(){
  document.getElementById('fab').style.display='none';
  var os=S.roster.owners.slice().sort(function(a,b){return a.display_name<b.display_name?-1:1});
  app().innerHTML='<div class="card"><div class="big" style="font-size:20px">Who are you?</div><p class="muted" style="margin-top:4px">Your list shows the items assigned to you and anything open in your department that no one has claimed.</p><div class="roster" style="margin-top:12px">'+
    os.map(function(o){return '<button onclick="pickWho(\''+o.owner_key+'\')"><b>'+esc(o.display_name)+'</b><span>'+esc(o.department)+'</span></button>'}).join('')+'</div></div>';
}
async function pickWho(k){S.me=S.roster.owners.filter(function(o){return o.owner_key===k})[0];ls('mw_owner',k);setWho();S.view='mine';S.list=null;S.item=null;await refresh();route()}
function switchUser(){if(!S.pin)return;S.me=null;ls('mw_owner',null);setWho();showWho()}
function logOut(){ls('mw_owner',null);ls('su_pin',null);location.href=new URL('../',location.href).href}

// ---------- data ----------
async function refresh(){
  S.data=await rpc('work_mine',{p_pin:S.pin,p_owner:S.me.owner_key});
  S.loadedAt=Date.now();
  if(S.view==='dept')S.deptData=await rpc('work_department',{p_pin:S.pin,p_dept:S.me.department});
  if(S.view==='all'&&isAdmin())S.allData=await rpc('work_all',{p_pin:S.pin});
}
async function touch(){try{await rpc('work_touch',{p_pin:S.pin,p_owner:S.me.owner_key})}catch(e){}}
document.addEventListener('visibilitychange',function(){ // refresh when the tab comes back, at most once a minute
  if(document.visibilityState==='visible'&&S.me&&Date.now()-S.loadedAt>60000&&!S.list&&!S.item)guard(async function(){await refresh();route()});
});

// ---------- routing ----------
function route(){
  window.scrollTo(0,0);
  if(S.item)return renderItem();
  if(S.list)return renderList();
  document.getElementById('fab').style.display='block';
  if(S.view==='dept')return renderDept();
  if(S.view==='all')return renderAll();
  renderMine();
}
async function setView(v){
  S.view=v;S.allOwner=null;
  await guard(async function(){
    if(v==='dept'&&!S.deptData)S.deptData=await rpc('work_department',{p_pin:S.pin,p_dept:S.me.department});
    if(v==='all'&&!S.allData)S.allData=await rpc('work_all',{p_pin:S.pin});
  });
  route();
}
function segHtml(){
  return '<div class="seg"><button class="'+(S.view==='mine'?'on':'')+'" onclick="setView(\'mine\')">Mine</button>'+
    '<button class="'+(S.view==='dept'?'on':'')+'" onclick="setView(\'dept\')">'+esc(S.me.department)+'</button>'+
    (isAdmin()?'<button class="'+(S.view==='all'?'on':'')+'" onclick="setView(\'all\')">Everyone</button>':'')+'</div>';
}

// ---------- item rows ----------
function dueHtml(it){
  if(!it.due_date)return '';
  var c=it.urgency==='overdue'?'red':it.urgency==='today'?'amber':'';
  var lbl=it.urgency==='overdue'?'Due '+md(it.due_date)+' · overdue':it.urgency==='today'?'Due today':'Due '+md(it.due_date);
  return '<span class="due '+c+'">'+lbl+'</span>';
}
function metaHtml(it,showOwner){
  var m=[dueHtml(it)];
  if(showOwner)m.push('<span>'+esc(it.owner_name||('Unassigned · '+it.department))+'</span>');
  if(it.resident_ref)m.push('<span>'+esc(it.resident_ref)+'</span>');
  if(it.list_id){var l=listById(it.list_id);if(l)m.push('<span>📋 '+esc(l.title)+'</span>')}
  var src=SOURCE[it.source_type];if(src)m.push('<span>'+esc(src)+'</span>');
  if(it.private)m.push('<span>🔒 private</span>');
  return m.filter(Boolean).join('');
}
function listById(id){var all=[].concat(S.data&&S.data.lists||[],S.deptData&&S.deptData.lists||[],S.allData&&S.allData.lists||[]);return all.filter(function(l){return l.id===id})[0]}
function itemRow(it,opts){
  opts=opts||{};
  var done=it.status==='completed';
  var canCheck=!opts.claim;
  return '<div class="it" data-id="'+it.id+'">'+
    '<div class="chk '+(done?'on':canCheck?'':'off')+'" '+(canCheck?'onclick="toggle(\''+it.id+'\','+(done?'true':'false')+')"':'')+'>'+(done?'✓':'')+'</div>'+
    '<div class="b" onclick="openItem(\''+it.id+'\')"><div class="t"'+(done?' style="text-decoration:line-through;color:var(--text-light)"':'')+'>'+esc(it.title)+'</div><div class="m">'+metaHtml(it,opts.showOwner)+'</div></div>'+
    (opts.claim?'<button class="btn btn-ghost btn-sm" onclick="claim(\''+it.id+'\')">Claim</button>':'<div class="go">›</div>')+
    '</div>';
}
function group(title,items,cls,opts){
  if(!items.length)return '';
  return '<div class="h2 '+(cls||'')+'">'+esc(title)+'<span class="n">'+items.length+'</span></div><div class="card" style="padding:4px 13px">'+items.map(function(i){return itemRow(i,opts)}).join('')+'</div>';
}
function listRow(l){
  var pct=l.total?Math.round(100*l.done/l.total):0;
  return '<div class="lst" onclick="openList(\''+l.id+'\')"><div class="b"><div class="t">'+esc(l.title)+'</div><div class="m">'+l.done+' of '+l.total+(l.target_date?' · target '+md(l.target_date):'')+(l.overdue?' · <span style="color:var(--danger);font-weight:700">'+l.overdue+' overdue</span>':'')+(l.owner_name?' · '+esc(l.owner_name):'')+'</div><div class="prog"><span style="width:'+pct+'%"></span></div></div><div class="go">›</div></div>';
}

// ---------- Mine ----------
function renderMine(){
  var d=S.data, items=d.items;
  var ov=items.filter(function(i){return i.urgency==='overdue'}), td=items.filter(function(i){return i.urgency==='today'}),
      wk=items.filter(function(i){return i.urgency==='week'}), later=items.filter(function(i){return i.urgency==='later'||i.urgency==='none'});
  var h=segHtml();
  h+='<div style="display:flex;align-items:baseline;justify-content:space-between;margin:2px 2px 6px"><div class="big" style="font-size:20px">'+esc(S.me.display_name.split(' ')[0])+'</div><div class="muted">'+esc(S.me.department)+(d.new_count?'<span class="badge">'+d.new_count+' new</span>':'')+'</div></div>';
  if(!items.length&&!d.dept_unassigned.length&&!d.lists.length)h+='<div class="card"><div class="empty">Nothing open. Tap <b>+ Add</b> to put something on your list.</div></div>';
  h+=group('Overdue',ov,'red')+group('Today',td,'amber')+group('This week',wk,'');
  if(later.length){
    h+='<div class="h2">Later<span class="n">'+later.length+'</span><span class="tog" onclick="S.showLater=!S.showLater;route()">'+(S.showLater?'Hide':'Show')+'</span></div>';
    if(S.showLater)h+='<div class="card" style="padding:4px 13px">'+later.map(function(i){return itemRow(i)}).join('')+'</div>';
  }
  if(d.dept_unassigned.length)h+=group('Unassigned in '+S.me.department,d.dept_unassigned,'',{claim:true});
  if(d.lists.length)h+='<div class="h2">My lists<span class="n">'+d.lists.length+'</span></div><div class="card" style="padding:4px 13px">'+d.lists.map(listRow).join('')+'</div>';
  if(d.done_recent.length){
    h+='<div class="h2">Done this week<span class="n">'+d.done_recent.length+'</span><span class="tog" onclick="S.showDone=!S.showDone;route()">'+(S.showDone?'Hide':'Show')+'</span></div>';
    if(S.showDone)h+='<div class="card" style="padding:4px 13px">'+d.done_recent.map(function(i){return itemRow(i)}).join('')+'</div>';
  }
  h+='<p class="muted" style="text-align:center;margin-top:18px"><span onclick="logOut()" style="cursor:pointer;color:var(--primary-light);font-weight:700">Log out</span></p>';
  app().innerHTML=h;
  if(d.new_count)touch();
}

// ---------- Department ----------
function renderDept(){
  var d=S.deptData;if(!d){app().innerHTML=segHtml()+'<div class="load">Loading…</div>';return}
  var byOwner={},order=[];
  d.items.forEach(function(i){var k=i.owner_key||'';if(!byOwner[k]){byOwner[k]=[];order.push(k)}byOwner[k].push(i)});
  var h=segHtml()+'<div class="big" style="font-size:20px;margin:2px 2px 6px">'+esc(S.me.department)+'</div>';
  if(!d.items.length)h+='<div class="card"><div class="empty">Nothing open in '+esc(S.me.department)+'.</div></div>';
  order.forEach(function(k){
    var its=byOwner[k], ov=its.filter(function(i){return i.urgency==='overdue'}).length;
    h+=group(k?ownerName(k):'Unassigned',its,ov?'red':'',{claim:!k});
  });
  if(d.lists.length)h+='<div class="h2">Lists<span class="n">'+d.lists.length+'</span></div><div class="card" style="padding:4px 13px">'+d.lists.map(listRow).join('')+'</div>';
  app().innerHTML=h;
}

// ---------- Everyone (admin) ----------
function renderAll(){
  var d=S.allData;if(!d){app().innerHTML=segHtml()+'<div class="load">Loading…</div>';return}
  var h=segHtml();
  if(S.allOwner){
    var its=d.items.filter(function(i){return S.allOwner==='__dept:'?false:S.allOwner.indexOf('__dept:')===0?(i.owner_key==null&&i.department===S.allOwner.slice(7)):i.owner_key===S.allOwner});
    var title=S.allOwner.indexOf('__dept:')===0?'Unassigned · '+S.allOwner.slice(7):ownerName(S.allOwner);
    h+='<span class="back" onclick="S.allOwner=null;route()">← Everyone</span>'+group(title,its,'',{claim:S.allOwner.indexOf('__dept:')===0});
    if(!its.length)h+='<div class="card"><div class="empty">Nothing open.</div></div>';
    app().innerHTML=h;return;
  }
  var tot=d.items.length, ov=d.items.filter(function(i){return i.urgency==='overdue'}).length, td=d.items.filter(function(i){return i.urgency==='today'}).length;
  h+='<div style="display:flex;align-items:baseline;justify-content:space-between;margin:2px 2px 6px"><div class="big" style="font-size:20px">Everyone</div><div class="kpis"><div class="kpi blue">'+tot+'<small>open</small></div><div class="kpi '+(ov?'red':'')+'">'+ov+'<small>overdue</small></div><div class="kpi '+(td?'amber':'')+'">'+td+'<small>today</small></div></div></div>';
  h+='<div class="card" style="padding:4px 13px">'+d.by_owner.filter(function(o){return o.owner_key!==ADMIN}).map(function(o){
    return '<div class="owner-card" onclick="S.allOwner=\''+o.owner_key+'\';route()"><div class="b"><div class="nm">'+esc(o.owner_name)+'</div><div class="dp">'+esc(o.department)+'</div></div><div class="kpis"><div class="kpi '+(o.overdue?'red':'')+'">'+o.overdue+'<small>late</small></div><div class="kpi '+(o.today?'amber':'')+'">'+o.today+'<small>today</small></div><div class="kpi">'+o.open+'<small>open</small></div></div></div>';
  }).join('')+'</div>';
  if(d.unassigned.length){
    h+='<div class="h2">Unassigned by department</div><div class="card" style="padding:4px 13px">'+d.unassigned.map(function(u){
      return '<div class="owner-card" onclick="S.allOwner=\'__dept:'+esc(u.department)+'\';route()"><div class="b"><div class="nm">'+esc(u.department)+'</div><div class="dp">No owner yet</div></div><div class="kpis"><div class="kpi">'+u.open+'<small>open</small></div></div><div class="go">›</div></div>';
    }).join('')+'</div>';
  }
  if(d.lists.length)h+='<div class="h2">Open lists<span class="n">'+d.lists.length+'</span></div><div class="card" style="padding:4px 13px">'+d.lists.map(listRow).join('')+'</div>';
  app().innerHTML=h;
}

// ---------- actions ----------
function findItem(id){
  var pools=[S.data&&S.data.items,S.data&&S.data.dept_unassigned,S.data&&S.data.done_recent,S.deptData&&S.deptData.items,S.allData&&S.allData.items,S.list&&S.list.items];
  for(var p=0;p<pools.length;p++){var hit=(pools[p]||[]).filter(function(i){return i.id===id})[0];if(hit)return hit}
  return null;
}
async function reload(){await refresh();if(S.list)S.list=await rpc('work_list_get',{p_pin:S.pin,p_id:S.list.id});if(S.view==='dept')S.deptData=await rpc('work_department',{p_pin:S.pin,p_dept:S.me.department});if(S.view==='all'&&isAdmin())S.allData=await rpc('work_all',{p_pin:S.pin});route()}
function toggle(id,isDone){
  guard(async function(){
    if(isDone){await rpc('work_reopen',{p_pin:S.pin,p_actor:S.me.owner_key,p_id:id});toast('Reopened');}
    else{
      await rpc('work_complete',{p_pin:S.pin,p_actor:S.me.owner_key,p_id:id,p_note:null});
      toast('Done',function(){guard(async function(){await rpc('work_reopen',{p_pin:S.pin,p_actor:S.me.owner_key,p_id:id});await reload()})});
    }
    await reload();
  });
}
function claim(id){guard(async function(){await rpc('work_reassign',{p_pin:S.pin,p_actor:S.me.owner_key,p_id:id,p_owner:S.me.owner_key,p_department:null});toast('Added to your list');await reload()})}

// ---------- item detail ----------
function openItem(id){var it=findItem(id);if(!it)return;S.item=it;route()}
function closeItem(){S.item=null;route()}
function ownerOptions(sel,allowDept){
  var h='';
  if(allowDept)h+='<optgroup label="Department (no owner yet)">'+S.roster.departments.map(function(d){return '<option value="dept:'+esc(d.department)+'">'+esc(d.department)+'</option>'}).join('')+'</optgroup>';
  var by={};S.roster.owners.forEach(function(o){(by[o.department]=by[o.department]||[]).push(o)});
  Object.keys(by).sort().forEach(function(dp){h+='<optgroup label="'+esc(dp)+'">'+by[dp].map(function(o){return '<option value="'+o.owner_key+'"'+(o.owner_key===sel?' selected':'')+'>'+esc(o.display_name)+'</option>'}).join('')+'</optgroup>'});
  return h;
}
function renderItem(){
  var it=S.item, open=['open','in_progress','escalated'].indexOf(it.status)>=0;
  document.getElementById('fab').style.display='none';
  var h='<span class="back" onclick="closeItem()">← Back</span><div class="card">'+
    '<div style="font-size:18px;font-weight:800;line-height:1.35">'+esc(it.title)+'</div>'+
    '<div class="kv">'+
      '<b>Status</b><span>'+(it.status==='completed'?'<span class="pill p-ok">Done '+md(it.completed_date)+'</span>':it.status==='cancelled'?'<span class="pill p-no">Cancelled</span>':it.urgency==='overdue'?'<span class="pill p-red">Overdue</span>':'<span class="pill p-todo">Open</span>')+'</span>'+
      '<b>Owner</b><span>'+esc(it.owner_name||('Unassigned · '+it.department))+'</span>'+
      '<b>Due</b><span>'+(it.due_date?md(it.due_date):'—')+'</span>'+
      (it.resident_ref?'<b>Resident</b><span>'+esc(it.resident_ref)+'</span>':'')+
      (it.list_id&&listById(it.list_id)?'<b>List</b><span style="color:var(--primary-light);font-weight:700;cursor:pointer" onclick="openList(\''+it.list_id+'\')">'+esc(listById(it.list_id).title)+' ›</span>':'')+
      '<b>From</b><span>'+esc(SOURCE[it.source_type]||'Added by '+(it.created_by?firstName(it.created_by):'—'))+(it.created_at?' · '+md(it.created_at):'')+'</span>'+
      (it.origin_url?'<b>Link</b><span><a href="'+esc(it.origin_url)+'" style="color:var(--primary-light);font-weight:700">Open source ›</a></span>':'')+
    '</div>'+
    (it.description?'<div class="note">'+esc(it.description)+'</div>':'')+
    (it.resolution_notes?'<div class="note" style="background:var(--success-bg);border-color:#c4e6d3">'+esc(it.resolution_notes)+'</div>':'')+
    '</div>';
  if(open){
    h+='<div class="card"><label>Note (optional)</label><textarea id="itNote" placeholder="What happened, what is next…"></textarea>'+
      '<div class="acts"><button class="btn btn-primary btn-sm" onclick="itComplete()">✓ Mark done</button><button class="btn btn-quiet btn-sm" onclick="itAddNote()">Add note only</button></div></div>';
    h+='<div class="card"><div class="row2"><div><label>Owner</label><select id="itOwner">'+ownerOptions(it.owner_key,true)+'</select></div><div><label>Due</label><input id="itDue" type="date" value="'+esc(it.due_date||'')+'"></div></div>'+
      '<label>Title</label><input id="itTitle" value="'+esc(it.title)+'">'+
      '<div class="acts"><button class="btn btn-ghost btn-sm" onclick="itSave()">Save changes</button><button class="btn btn-danger btn-sm" onclick="itCancel()">Cancel item</button></div></div>';
  } else {
    h+='<div class="card"><button class="btn btn-ghost" onclick="itReopen()">Reopen</button></div>';
  }
  app().innerHTML=h;
  if(open&&!it.owner_key)document.getElementById('itOwner').value='dept:'+it.department;
}
function itComplete(){
  // A new owner picked but not saved means "hand this off", not "done" — never drop it silently.
  var ov=document.getElementById('itOwner').value;
  if(ov!==(S.item.owner_key||('dept:'+S.item.department))){
    if(confirm('You picked '+(ov.indexOf('dept:')===0?ov.slice(5):ownerName(ov))+' as the new owner but did not save.\n\nOK = assign it to them (stays open)\nCancel = go back'))itSave();
    return;
  }
  var n=document.getElementById('itNote').value;guard(async function(){await rpc('work_complete',{p_pin:S.pin,p_actor:S.me.owner_key,p_id:S.item.id,p_note:n||null});toast('Done');S.item=null;await reload()})}
function itAddNote(){var n=document.getElementById('itNote').value.trim();if(!n)return toast('Type a note first');guard(async function(){await rpc('work_update',{p_pin:S.pin,p_actor:S.me.owner_key,p_id:S.item.id,p_title:null,p_due:null,p_clear_due:false,p_note:n});toast('Note added');await reload();S.item=findItem(S.item.id)||null;route()})}
function itReopen(){guard(async function(){await rpc('work_reopen',{p_pin:S.pin,p_actor:S.me.owner_key,p_id:S.item.id});toast('Reopened');await reload();S.item=findItem(S.item.id)||null;route()})}
function itCancel(){if(!confirm('Cancel this item? It will leave everyone\'s list.'))return;var n=document.getElementById('itNote').value;guard(async function(){await rpc('work_cancel',{p_pin:S.pin,p_actor:S.me.owner_key,p_id:S.item.id,p_note:n||null});toast('Cancelled');S.item=null;await reload()})}
function itSave(){
  var it=S.item, ov=document.getElementById('itOwner').value, due=document.getElementById('itDue').value, title=document.getElementById('itTitle').value.trim();
  guard(async function(){
    var curOwner=it.owner_key||('dept:'+it.department);
    if(ov!==curOwner){
      if(ov.indexOf('dept:')===0)await rpc('work_reassign',{p_pin:S.pin,p_actor:S.me.owner_key,p_id:it.id,p_owner:null,p_department:ov.slice(5)});
      else await rpc('work_reassign',{p_pin:S.pin,p_actor:S.me.owner_key,p_id:it.id,p_owner:ov,p_department:null});
    }
    if((title&&title!==it.title)||(due&&due!==it.due_date))await rpc('work_update',{p_pin:S.pin,p_actor:S.me.owner_key,p_id:it.id,p_title:title!==it.title?title:null,p_due:due!==it.due_date?due:null,p_clear_due:false,p_note:null});
    toast('Saved');S.item=null;await reload();
  });
}

// ---------- add ----------
function openAdd(){
  document.getElementById('fab').style.display='none';
  var lists=(S.data&&S.data.lists)||[];
  app().innerHTML='<span class="back" onclick="route()">← Back</span><div class="card"><div class="big" style="font-size:20px">Add to a list</div>'+
    '<label>What needs to happen</label><input id="adTitle" placeholder="Short, specific, one action" maxlength="200">'+
    '<div class="row2"><div><label>Owner</label><select id="adOwner">'+ownerOptions(S.me.owner_key,true)+'</select></div><div><label>Due</label><input id="adDue" type="date" value="'+today()+'"></div></div>'+
    (lists.length?'<label>Part of a list (optional)</label><select id="adList"><option value="">—</option>'+lists.map(function(l){return '<option value="'+l.id+'">'+esc(l.title)+'</option>'}).join('')+'</select>':'')+
    '<label>Details (optional)</label><textarea id="adNote" placeholder="Context the owner needs"></textarea>'+
    (isAdmin()?'<label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px"><input type="checkbox" id="adPriv" style="width:auto"> Private (only on my list)</label>':'')+
    '<div style="height:16px"></div><button class="btn btn-primary" onclick="adSave()">Add</button></div>'+
    '<div class="nophi">Room and "Last, F." only if a resident must be named. No diagnoses, medications, or other clinical detail here.</div>';
  document.getElementById('adTitle').focus();
}
function adSave(){
  var t=document.getElementById('adTitle').value.trim(), ov=document.getElementById('adOwner').value, due=document.getElementById('adDue').value,
      note=document.getElementById('adNote').value.trim(), lid=(document.getElementById('adList')||{}).value||null, priv=!!(document.getElementById('adPriv')||{}).checked;
  if(!t)return toast('Type what needs to happen');
  guard(async function(){
    var args={p_pin:S.pin,p_actor:S.me.owner_key,p_title:t,p_owner:ov.indexOf('dept:')===0?null:ov,p_department:ov.indexOf('dept:')===0?ov.slice(5):null,
      p_due:due||null,p_note:note||null,p_list_id:lid,p_source_type:'my_work',p_resident_ref:null,p_origin_url:null,p_private:priv,p_priority:'normal'};
    await rpc('work_add',args);
    toast(ov===S.me.owner_key?'Added to your list':'Added to '+(ov.indexOf('dept:')===0?ov.slice(5):firstName(ov)));
    await reload();
  });
}

// ---------- list screen ----------
function openList(id){guard(async function(){S.list=await rpc('work_list_get',{p_pin:S.pin,p_id:id});S.item=null;route()})}
function closeList(){S.list=null;route()}
function renderList(){
  var l=S.list; document.getElementById('fab').style.display='none';
  var byOwner={},order=[];
  l.items.forEach(function(i){var k=i.owner_key||'';if(!byOwner[k]){byOwner[k]=[];order.push(k)}byOwner[k].push(i)});
  var pct=l.total?Math.round(100*l.done/l.total):0;
  var hdr=Object.keys(l.header||{}).filter(function(k){return l.header[k]!==null&&l.header[k]!==''});
  var h='<span class="back" onclick="closeList()">← Back</span><div class="card">'+
    '<div style="font-size:18px;font-weight:800">'+esc(l.title)+'</div>'+
    '<div class="muted" style="margin-top:3px">'+l.done+' of '+l.total+' done'+(l.target_date?' · target '+md(l.target_date):'')+(l.owner_name?' · '+esc(l.owner_name):'')+(l.status!=='open'?' · <b>'+esc(l.status)+'</b>':'')+'</div>'+
    '<div class="prog"><span style="width:'+pct+'%"></span></div>'+
    (hdr.length?'<div class="kv" style="margin-top:12px">'+hdr.map(function(k){return '<b>'+esc(k.replace(/_/g,' '))+'</b><span>'+esc(typeof l.header[k]==='object'?JSON.stringify(l.header[k]):l.header[k])+'</span>'}).join('')+'</div>':'')+
    '</div>';
  order.forEach(function(k){h+=group(k?ownerName(k):'Unassigned · '+byOwner[k][0].department,byOwner[k],'',{claim:!k&&byOwner[k][0].department===S.me.department})});
  if(l.status==='open')h+='<div class="card"><label>Add a step to this list</label><input id="lsTitle" placeholder="What needs to happen" maxlength="200"><div class="row2"><div><label>Owner</label><select id="lsOwner">'+ownerOptions(l.owner_key||S.me.owner_key,true)+'</select></div><div><label>Due</label><input id="lsDue" type="date" value="'+esc(l.target_date||today())+'"></div></div><div style="height:12px"></div><button class="btn btn-ghost" onclick="lsAdd()">Add step</button></div>';
  if(l.status==='open'&&(isAdmin()||l.owner_key===S.me.owner_key))h+='<div class="card"><div class="row2"><div><label>Target date</label><input id="lsTarget" type="date" value="'+esc(l.target_date||'')+'"></div><div><label>&nbsp;</label><button class="btn btn-quiet" onclick="lsSaveTarget()">Save target</button></div></div><div style="height:10px"></div><button class="btn btn-danger btn-sm" onclick="lsCancel()">Cancel whole list</button></div>';
  app().innerHTML=h;
}
function lsAdd(){
  var t=document.getElementById('lsTitle').value.trim(), ov=document.getElementById('lsOwner').value, due=document.getElementById('lsDue').value;
  if(!t)return toast('Type the step first');
  guard(async function(){
    await rpc('work_add',{p_pin:S.pin,p_actor:S.me.owner_key,p_title:t,p_owner:ov.indexOf('dept:')===0?null:ov,p_department:ov.indexOf('dept:')===0?ov.slice(5):null,
      p_due:due||null,p_note:null,p_list_id:S.list.id,p_source_type:'list',p_resident_ref:S.list.resident_ref||null,p_origin_url:null,p_private:false,p_priority:'normal'});
    toast('Step added');await reload();
  });
}
function lsSaveTarget(){var d=document.getElementById('lsTarget').value;guard(async function(){await rpc('work_list_update',{p_pin:S.pin,p_actor:S.me.owner_key,p_id:S.list.id,p_title:null,p_header:null,p_target_date:d||null,p_status:null,p_owner:null});toast('Saved');await reload()})}
function lsCancel(){if(!confirm('Cancel this whole list and every open step in it?'))return;guard(async function(){await rpc('work_list_update',{p_pin:S.pin,p_actor:S.me.owner_key,p_id:S.list.id,p_title:null,p_header:null,p_target_date:null,p_status:'cancelled',p_owner:null});toast('List cancelled');S.list=null;await reload()})}

start();
</script>
</body>
</html>
