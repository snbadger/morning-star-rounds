<style>
/* Shower Sheet — compat layer: maps this app's original class names onto ms-ui.css (11/4/26).
   Shower Log colours unchanged: green shower, purple bed bath, red refused. */
:root{--danger:var(--destructive);--text:var(--foreground);--text-light:var(--muted-foreground);--bg:var(--background);--primary-light:var(--ring)}
body{padding-bottom:86px}
.page{max-width:560px;margin:0 auto;padding:16px 14px 24px}
#app .card{padding:16px;margin-bottom:12px}
#app label{display:block;margin:14px 0 6px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
#app input:not([type=checkbox]):not([type=radio]),#app select,#app textarea{width:100%;padding:12px 14px;font:inherit;font-size:17px;color:var(--foreground);background:var(--card);border:1.5px solid var(--input);border-radius:var(--radius-sm);transition:border-color .12s,box-shadow .12s}
#app input:focus,#app select:focus,#app textarea:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 22%,transparent)}
#app textarea{min-height:76px;resize:vertical}
#app .btn{display:flex;width:100%;height:auto;min-height:50px;padding:14px 18px;white-space:normal}
.btn-ghost{background:transparent!important;color:var(--primary)!important;border-color:var(--primary)!important}
.btn-ghost:hover{background:var(--accent)!important}
.hint{font-size:13.5px;color:var(--muted-foreground);margin-top:6px;line-height:1.4}
/* segmented controls */
.seg{display:flex;gap:3px;padding:3px;background:var(--muted);border-radius:var(--radius-sm);margin-bottom:12px}
.seg div{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 4px;border-radius:8px;font-size:15px;font-weight:700;color:var(--muted-foreground);cursor:pointer;transition:background .12s,color .12s}
.seg div.on{background:var(--card);color:var(--primary);box-shadow:var(--shadow-sm)}
.seg svg{width:16px;height:16px}
/* outcome radio cards */
.outcome-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.outcome-row-2{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.outcome-btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:54px;padding:12px 6px;border-radius:var(--radius-sm);border:2px solid var(--border);background:var(--card);font-size:15px;font-weight:800;cursor:pointer;text-align:center;color:var(--muted-foreground);transition:border-color .12s,background .12s,color .12s,transform .08s}
.outcome-btn:active{transform:scale(.97)}
.outcome-btn svg{width:17px;height:17px;flex:none}
.outcome-btn.sel-shower{border-color:var(--success);background:var(--success-bg);color:var(--success)}
.outcome-btn.sel-bed_bath{border-color:var(--purple);background:var(--purple-bg);color:var(--purple)}
.outcome-btn.sel-refused{border-color:var(--destructive);background:var(--destructive-bg);color:var(--destructive)}
.outcome-btn.sel-empty_bed{border-color:var(--muted-foreground);background:var(--muted);color:var(--foreground)}
/* room list */
.room-card{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card);margin-bottom:8px;cursor:pointer;transition:transform .08s,border-color .12s}
.room-card:active{transform:scale(.985)}
.room-num{font-size:22px;font-weight:800;min-width:58px;color:var(--primary)}
.room-status{flex:1;min-width:0;font-size:15px;font-weight:700;color:var(--foreground);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.room-status .room-by{flex-basis:100%}
.room-by{font-size:12.5px;color:var(--muted-foreground);font-weight:400}
.room-card .chev{color:var(--muted-foreground);width:16px;height:16px;flex:none}
.dot{width:12px;height:12px;border-radius:50%;background:var(--border);flex:none}
.st-shower{border-color:var(--success);background:var(--success-bg)}.st-shower .dot{background:var(--success)}.st-shower .room-status{color:var(--success)}
.st-bed_bath{border-color:var(--purple);background:var(--purple-bg)}.st-bed_bath .dot{background:var(--purple)}.st-bed_bath .room-status{color:var(--purple)}
.st-refused{border-color:var(--destructive);background:var(--destructive-bg)}.st-refused .dot{background:var(--destructive)}.st-refused .room-status{color:var(--destructive)}
.st-empty_bed{border-color:var(--input);background:var(--muted)}.st-empty_bed .dot{background:var(--muted-foreground)}.st-empty_bed .room-status{color:var(--muted-foreground)}
.room-status .badge{font-size:11px;padding:2px 8px}
.room-status .badge svg{width:12px;height:12px}
.progress-wrap{height:8px;margin-top:12px;border-radius:var(--radius-pill);background:var(--muted);overflow:hidden}
.progress-bar{height:100%;background:var(--success);border-radius:inherit;transition:width .3s var(--ease)}
/* care-task rows */
.check-row{cursor:pointer;padding:11px 2px;gap:12px}
.cbox{width:30px;height:30px;min-width:30px;border:2px solid var(--input);border-radius:8px;display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff;background:var(--card)}
.check-row.na .cbox{font-size:10px}.check-row.ref .cbox{font-size:9px}
.check-label{font-size:16px;line-height:1.35;flex:1}
.check-sub{font-size:12.5px;color:var(--muted-foreground)}
/* skin chips + body map */
.skin-chip{display:inline-flex;align-items:center;gap:5px;padding:10px 15px;margin:0 6px 8px 0;border-radius:var(--radius-pill);border:1.5px solid var(--border);background:var(--card);font-size:15px;font-weight:700;color:var(--muted-foreground);cursor:pointer;user-select:none;transition:border-color .12s,background .12s,color .12s}
.skin-chip.on{border-color:var(--destructive);background:var(--destructive-bg);color:var(--destructive)}
.skin-chip.ok.on{border-color:var(--success);background:var(--success-bg);color:var(--success)}
.bodymap{display:flex;justify-content:space-around;gap:4px;margin:10px 0 4px;background:var(--muted);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 2px 4px}
.bodymap svg{width:50%;max-width:280px;height:auto;touch-action:manipulation}
.bodymap .bview{text-align:center}
.bodymap .bcap{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--muted-foreground);margin-top:2px}
.body-region{fill:#eef1f4;stroke:#b8c2cc;stroke-width:1.2;cursor:pointer}
.body-region.sel{fill:#f5b7b1;stroke:var(--destructive);stroke-width:2}
.loc-chip{display:inline-flex;align-items:center;padding:6px 12px;margin:2px 5px 3px 0;border-radius:var(--radius-pill);background:var(--destructive-bg);border:1.5px solid var(--destructive);color:var(--destructive);font-size:14px;font-weight:700}
/* banners -> alerts */
.banner{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;margin:10px 0;border-radius:var(--radius-sm);font-size:15px;font-weight:700;line-height:1.4;text-align:center;border:1px solid transparent}
.banner svg{flex:none;width:18px;height:18px}
.banner-red{background:var(--destructive-bg);color:var(--destructive);border-color:color-mix(in srgb,var(--destructive) 30%,transparent)}
.banner-green{background:var(--success-bg);color:var(--success);border-color:color-mix(in srgb,var(--success) 30%,transparent)}
.banner-amber{background:var(--warning-bg);color:#9a6a0a;border-color:color-mix(in srgb,var(--warning) 35%,transparent)}
.missing-card{border-left:5px solid var(--destructive)!important}
.missing-card.ok{border-left-color:var(--success)!important}
.section-title{margin:18px 0 8px}
.back svg{width:16px;height:16px}
.card .empty{border:0;background:transparent;padding:22px 0;font-size:15px}
/* refusal steps */
.step{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px;margin-bottom:8px;background:var(--card)}
.step.on{border-color:var(--destructive);background:var(--destructive-bg)}
.step-hd{display:flex;align-items:center;gap:10px;cursor:pointer}
.step-hd .cbox{border-radius:50%}
.step.on .cbox{background:var(--destructive);border-color:var(--destructive)}
.step-t{font-size:15px;font-weight:700;flex:1;line-height:1.3}
.step input{margin-top:8px;padding:11px!important;font-size:16px!important}
/* charge nurse review */
.nurse-row{padding:13px 0;border-bottom:1px solid var(--border)}
.nurse-row:last-child{border-bottom:none}
.nr-hd{display:flex;justify-content:space-between;align-items:center}
.nr-room{font-weight:800;font-size:17px;color:var(--primary)}
.nr-out{font-size:12px;font-weight:800;letter-spacing:.04em}
.nr-detail{font-size:14.5px;color:var(--muted-foreground);margin-top:3px;line-height:1.45}
.nr-review{margin-top:8px;font-size:14px;font-weight:700}
.nr-review .rbtn{display:inline-flex;align-items:center;padding:8px 16px;border-radius:var(--radius-pill);border:1.5px solid var(--primary);color:var(--primary);cursor:pointer;background:transparent}
.nr-review .rbtn:hover{background:var(--accent)}
.nr-review .done{color:var(--success)}
/* tab bar + toasts above it */
.tabbar svg{width:22px;height:22px}
body .toaster{bottom:calc(84px + env(safe-area-inset-bottom))}
</style>
</head>

<script>
var SUPABASE_URL='https://pmnudshutxwidxdtouqj.supabase.co';
var SUPABASE_KEY='sb_publishable_wzX5nLx18cfErNTRPO671w_sH4ED7ET';
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// FACILITY SHOWER SCHEDULE — "MStar Schedule (2)", revised 2025.04.03.
// Suffix P = private room (rooms 1–4). Sunday = weekly-tasks day, no scheduled showers.

var SCHEDULE={

];

 {key:'open_area',label:'Open area'},{key:'dryness',label:'Dryness'}
];

 {key:'dsd_don',label:'4. DSD / DON notified and attempted',needName:true,ph:'DSD/DON name'}
];

// location (both instances highlight together).
var BODY_FRONT=[
 ['Head / face','e',70,20,15,17],['Neck','r',62,36,16,10],
 ['Chest','r',47,46,46,36],['Abdomen','r',49,82,42,32],['Groin / peri area','r',53,114,34,14],
 ['Right upper arm','r',28,50,17,40],['Right forearm','r',26,92,15,38],['Right hand','e',33,140,9,11],
 ['Left upper arm','r',95,50,17,40],['Left forearm','r',99,92,15,38],['Left hand','e',107,140,9,11],
 ['Right thigh','r',51,130,18,52],['Right shin','r',52,184,16,50],['Right foot / toes','e',59,243,11,8],
 ['Left thigh','r',71,130,18,52],['Left shin','r',72,184,16,50],['Left foot / toes','e',81,243,11,8]
];
var BODY_BACK=[
 ['Back of head','e',70,20,15,17],['Upper back','r',47,46,46,42],['Lower back','r',49,90,42,20],
 ['Left upper arm','r',28,50,17,36],['Left elbow','c',36,92,8],['Left forearm','r',26,102,15,30],['Left hand','e',33,140,9,11],
 ['Right upper arm','r',95,50,17,36],['Right elbow','c',104,92,8],['Right forearm','r',99,102,15,30],['Right hand','e',107,140,9,11],
 ['Buttocks','r',51,112,38,22],['Sacrum / coccyx','r',63,106,14,12],
 ['Left back of thigh','r',51,136,18,48],['Left calf','r',52,186,16,46],['Left heel','e',59,241,11,8],
 ['Right back of thigh','r',71,136,18,48],['Right calf','r',72,186,16,46],['Right heel','e',81,241,11,8]
];
function bodySVG(regions,cap){
  var s='<div class="bview"><svg viewBox="22 0 96 256" xmlns="http://www.w3.org/2000/svg">';
  regions.forEach(function(g){
    var lbl=g[0],sel=form.skin_locations.indexOf(lbl)>=0?' sel':'';
    var on=' onclick="toggleLoc(&quot;'+lbl+'&quot;)"',cls=' class="body-region'+sel+'"';
    if(g[1]==='r')s+='<rect x="'+g[2]+'" y="'+g[3]+'" width="'+g[4]+'" height="'+g[5]+'" rx="7"'+cls+on+'><title>'+lbl+'</title></rect>';
    else if(g[1]==='e')s+='<ellipse cx="'+g[2]+'" cy="'+g[3]+'" rx="'+g[4]+'" ry="'+g[5]+'"'+cls+on+'><title>'+lbl+'</title></ellipse>';
    else s+='<circle cx="'+g[2]+'" cy="'+g[3]+'" r="'+g[4]+'"'+cls+on+'><title>'+lbl+'</title></circle>';
  });
  return s+'</svg><div class="bcap">'+cap+'</div></div>';
}
function toggleLoc(lbl){captureText();var i=form.skin_locations.indexOf(lbl);if(i>=0)form.skin_locations.splice(i,1);else form.skin_locations.push(lbl);render()}

var me={name:localStorage.getItem('sh_name')||''};
var tab=localStorage.getItem('sh_tab')||'cna';
var view='home', logs=[], form=null;
var today=localDate(new Date());
var selDate=today;
var selShift=(new Date()).getHours()<13?'AM':'PM';

function localDate(d){return d.toLocaleDateString('en-CA')}
function yesterday(){var d=new Date();d.setDate(d.getDate()-1);return localDate(d)}
function dowOf(ds){var p=ds.split('-');return new Date(+p[0],+p[1]-1,+p[2]).getDay()}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function toast(m){var t=/fail|not a valid|^Pick|^Complete|^Check at least|^Please/i.test(m)?'destructive':/^Saved|^Marked|removed/i.test(m)?'success':'';if(window.MS&&MS.toast)MS.toast(m,{type:t});else alert(m)}
function whoChip(){document.getElementById('whoChip').textContent=me.name?('👤 '+me.name.split(' ')[0]):'Sign in'}
function editIdentity(){view='identity';render()}
function legacyLogout(){try{localStorage.removeItem('sh_name');}catch(e){}location.href='../';}
function setTab(t){tab=t;localStorage.setItem('sh_tab',t);view='home';loadAndRender()}
function fmtTime(ts){return new Date(ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
// Outcomes where care actually happened — these carry task checklists and a skin check.
function careGiven(o){return o==='shower'||o==='bed_bath'}
function outLabel(o){return o==='shower'?'Shower':o==='bed_bath'?'Bed bath':o==='empty_bed'?'Empty bed':'Refused'}
function outColor(o){return o==='shower'?'var(--success)':o==='bed_bath'?'var(--purple)':o==='empty_bed'?'var(--text-light)':'var(--danger)'}

async function loadData(){
  var r=await sb.from('shower_logs').select('*').eq('log_date',selDate).order('room_bed');
  logs=r.data||[];
}
async function loadAndRender(){await loadData();render()}

function render(){
  setTimeout(function(){if(window.MS&&MS.icons)MS.icons()},0);
  whoChip();
  document.getElementById('tabbar').style.display=(me.name&&view!=='identity')?'flex':'none';
  document.getElementById('tabCna').className=tab==='cna'?'on':'';
  document.getElementById('tabNurse').className=tab==='nurse'?'on':'';
  var el=document.getElementById('app');
  if(!me.name||view==='identity'){el.innerHTML=identityView();return}
  if(view==='form'){el.innerHTML=formView();return}
  el.innerHTML=tab==='nurse'?nurseView():homeView();
}

// ---- Sign-in via the hub's Paycom roster (ms-identity.js, 11/4/26). Originals kept below as legacy* fallbacks. ----
function identityView(){
  if(!window.MS||!MS.identity)return legacyIdentityView();
  return MS.identity.card({"title": "Who are you?", "hint": "Your name is stamped on every shower you document, just like signing the paper sheet. No resident names anywhere in this app.", "chip": "Nursing SNF"});

function legacySaveIdentity(){
  var n=document.getElementById('idName').value.trim();
  if(!n){toast('Please enter your name');return}
  me.name=n;localStorage.setItem('sh_name',n);view='home';loadAndRender();
}

function shiftLogs(){return logs.filter(function(l){return l.shift===selShift})}
function logFor(rb){return shiftLogs().find(function(l){return l.room_bed===rb})}

function dateSeg(){
  return '<div class="seg">'+
  '<div class="'+(selDate===yesterday()?'on':'')+'" onclick="setDate(\''+yesterday()+'\')">Yesterday</div>'+
  '<div class="'+(selDate===today?'on':'')+'" onclick="setDate(\''+today+'\')">Today</div>'+
  '</div><div class="seg">'+
  '<div class="'+(selShift==='AM'?'on':'')+'" onclick="setShift(\'AM\')"><i data-lucide="sun"></i>AM Shift</div>'+
  '<div class="'+(selShift==='PM'?'on':'')+'" onclick="setShift(\'PM\')"><i data-lucide="moon"></i>PM Shift</div></div>';
}
function setDate(d){selDate=d;loadAndRender()}
function setShift(s){selShift=s;render()}

function homeView(){
  var sched=SCHEDULE[dowOf(selDate)][selShift]||[];
  var extras=shiftLogs().filter(function(l){return sched.indexOf(l.room_bed)<0}).map(function(l){return l.room_bed});
  var all=sched.concat(extras);
  var done=all.filter(function(rb){return !!logFor(rb)}).length;
  var h=dateSeg();
  var dow=dowOf(selDate);
  if(!sched.length&&dow===0)h+='<div class="banner banner-amber">Sunday — no scheduled showers (weekly tasks day). You can still log one below.</div>';
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:15px">'+
     (selShift==='AM'?'AM':'PM')+' Shower Schedule</b><span class="badge '+(done>=all.length&&all.length?'success':'')+'">'+done+' of '+all.length+' documented</span></div>'+
     '<div class="progress-wrap"><div class="progress-bar" style="width:'+(all.length?Math.round(done/all.length*100):0)+'%"></div></div></div>';
  all.forEach(function(rb){
    var l=logFor(rb);
    var cls=l?('st-'+l.outcome):'';
    var status=l?outLabel(l.outcome):'Tap to document';
    var flags='';
    if(l&&l.skin_issues&&l.skin_issues.length)flags+=' <span class="badge warning" title="Skin issue"><i data-lucide="triangle-alert"></i>Skin</span>';
    if(l&&l.nurse_reviewed_by)flags+=' <span class="badge outline" title="Nurse reviewed"><i data-lucide="check"></i>Reviewed</span>';
    var by=l?('<div class="room-by">'+esc(l.cna_name)+' · '+fmtTime(l.updated_at)+'</div>'):'';
    var extra=sched.indexOf(rb)<0?' <span class="badge gold">EXTRA</span>':'';
    h+='<div class="room-card '+cls+'" onclick="openForm(\''+rb+'\')"><div class="dot"></div>'+
       '<div class="room-num">'+rb.replace('P','')+(rb.slice(-1)==='P'?'<span style="font-size:11px;color:var(--text-light)"> priv</span>':'')+'</div>'+
       '<div class="room-status">'+status+flags+extra+by+'</div><i data-lucide="chevron-right" class="chev"></i></div>';
  });
  // Missing list — scheduled beds with no entry this shift (a bed charted on the other shift the same day doesn't count as missing).
  var otherShift=logs.filter(function(l){return l.shift!==selShift}).map(function(l){return l.room_bed});
  var missing=sched.filter(function(rb){return !logFor(rb)&&otherShift.indexOf(rb)<0});
  if(sched.length){
    var past=selDate<today;
    h+='<div class="card missing-card'+(missing.length?'':' ok')+'" style="margin-top:14px">'+
       '<b style="font-size:15px">'+(missing.length?(past?'Missed':'Still missing')+' — '+missing.length+' bed'+(missing.length===1?'':'s'):'✅ Nothing missing')+'</b>'+
       (missing.length?'<div class="hint" style="margin:4px 0 8px">Not documented yet this shift. Tap a bed to document it. Empty bed? Mark it "Empty bed".</div>'+
         missing.map(function(rb){return '<span class="skin-chip on" onclick="openForm(\''+rb+'\')">'+rb+'</span>'}).join('')
       :'<div class="hint" style="margin-top:4px">Every scheduled bed on this shift is documented.</div>')+'</div>';
  }
  h+='<div style="margin-top:14px"><button class="btn btn-ghost" onclick="addExtra()"><i data-lucide="plus"></i>Log an off-schedule shower</button></div>';
  h+=logoutRow();
  return h;
}
function logoutRow(){
  return '<div style="text-align:center;margin-top:20px;font-size:14px;color:var(--text-light)">Signed in as <b>'+esc(me.name)+'</b> &nbsp;·&nbsp; '+
  '<span style="color:var(--danger);font-weight:700;cursor:pointer;text-decoration:underline" onclick="logout()">Log out</span></div>';
}
function addExtra(){
  var sched=SCHEDULE[dowOf(selDate)][selShift]||[];
  var taken=shiftLogs().map(function(l){return l.room_bed});
  var opts=ALL_BEDS.filter(function(rb){return sched.indexOf(rb)<0&&taken.indexOf(rb)<0});
  if(!window.MS||!MS.open){return addExtraPrompt()}
  var o=document.getElementById('extraSheet');
  if(!o){o=document.createElement('div');o.className='overlay sheet';o.id='extraSheet';o.setAttribute('aria-hidden','true');document.body.appendChild(o)}
  o.innerHTML='<div class="dialog" role="dialog" aria-modal="true"><div class="grabber"></div>'+
    '<div class="d-title">Log an off-schedule shower</div>'+
    '<div class="d-desc">Pick the bed. It shows as EXTRA on this shift\'s list.</div>'+
    '<label class="label">Room / bed</label><select class="select" id="extraBed"><option value="">— pick a bed —</option>'+
    opts.map(function(rb){return '<option value="'+rb+'">'+(rb.slice(-1)==='P'?rb.slice(0,-1)+' (private)':rb)+'</option>'}).join('')+'</select>'+
    '<div class="d-actions"><button type="button" class="btn secondary" data-close>Cancel</button>'+
    '<button type="button" class="btn" id="extraGo">Document it</button></div></div>';
  document.getElementById('extraGo').onclick=function(){
    var rb=document.getElementById('extraBed').value;
    if(!rb){toast('Pick a room/bed first');return}
    MS.close(o);openForm(rb);
  };
  MS.open(o);
}
function addExtraPrompt(){
  var rb=prompt('Room/bed (e.g. 5A, 11G, or 2 for a private room):');
  if(!rb)return;
  rb=rb.trim().toUpperCase();
  if(/^\d+$/.test(rb)&&ROOM_BEDS[rb]&&ROOM_BEDS[rb][0]==='P')rb+='P';
  if(ALL_BEDS.indexOf(rb)<0){toast(rb+' is not a valid room/bed');return}
  openForm(rb);
}

function blankForm(rb){
  var sched=SCHEDULE[dowOf(selDate)][selShift]||[];
  return {room_bed:rb,scheduled:sched.indexOf(rb)>=0,outcome:null,bed_bath_reason:'',tasks:{},
    skin_ok:null,skin_issues:[],skin_locations:[],skin_note:'',notes:'',refusal_steps:{}};
}
function openForm(rb){
  var l=logFor(rb);
  if(l){
    form={id:l.id,room_bed:rb,scheduled:l.scheduled,outcome:l.outcome,bed_bath_reason:l.bed_bath_reason||'',
      tasks:l.tasks||{},skin_ok:(l.skin_issues&&l.skin_issues.length)?false:true,
      skin_issues:l.skin_issues||[],skin_locations:l.skin_locations||[],skin_note:l.skin_note||'',notes:l.notes||'',refusal_steps:l.refusal_steps||{}};
  }else form=blankForm(rb);
  view='form';render();window.scrollTo(0,0);
}
function fv(id){var e=document.getElementById(id);return e?e.value:''}
function captureText(){
  if(!form)return;
  if(document.getElementById('fNotes'))form.notes=fv('fNotes');
  if(document.getElementById('fSkinNote'))form.skin_note=fv('fSkinNote');
  if(document.getElementById('fBBReason'))form.bed_bath_reason=fv('fBBReason');
  REFUSAL_STEPS.forEach(function(s){
    var e=document.getElementById('rs_'+s.key);
    if(e&&form.refusal_steps[s.key])form.refusal_steps[s.key].by=e.value;
  });
}
function setOutcome(o){captureText();form.outcome=o;render()}
function toggleTask(k){captureText();var v=form.tasks[k];form.tasks[k]=(v===true)?'na':(v==='na')?'refused':(v==='refused')?false:true;render()}
function setSkinOk(ok){captureText();form.skin_ok=ok;if(ok){form.skin_issues=[];form.skin_locations=[];form.skin_note=''}render()}
function toggleSkin(k){captureText();var i=form.skin_issues.indexOf(k);if(i>=0)form.skin_issues.splice(i,1);else form.skin_issues.push(k);form.skin_ok=form.skin_issues.length?false:null;render()}
function toggleStep(k){
  captureText();
  if(form.refusal_steps[k])delete form.refusal_steps[k];
  else form.refusal_steps[k]={done:true,by:k==='alt_time'?me.name:'',at:new Date().toISOString()};
  render();
}
function backHome(){view='home';form=null;loadAndRender()}

function formView(){
  var f=form;
  var h='<span class="back" onclick="backHome()"><i data-lucide="chevron-left"></i>Back to schedule</span>';
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">'+
     '<div style="font-size:22px;font-weight:800;color:var(--primary)">Room '+f.room_bed.replace('P','')+(f.room_bed.slice(-1)==='P'?' <span style="font-size:12px;color:var(--text-light)">private</span>':'')+'</div>'+
     '<div style="font-size:12px;font-weight:700;color:var(--text-light)">'+selDate+' · '+selShift+'</div></div>'+
     (f.scheduled?'':'<div class="hint">Off-schedule entry</div>');
  h+='<label>What happened?</label><div class="outcome-row">'+
     '<div class="outcome-btn '+(f.outcome==='shower'?'sel-shower':'')+'" onclick="setOutcome(\'shower\')"><i data-lucide="shower-head"></i>Shower</div>'+
     '<div class="outcome-btn '+(f.outcome==='bed_bath'?'sel-bed_bath':'')+'" onclick="setOutcome(\'bed_bath\')"><i data-lucide="bed"></i>Bed Bath</div>'+
     '<div class="outcome-btn '+(f.outcome==='refused'?'sel-refused':'')+'" onclick="setOutcome(\'refused\')"><i data-lucide="ban"></i>Refused</div></div>'+
     '<div class="outcome-row-2"><div class="outcome-btn '+(f.outcome==='empty_bed'?'sel-empty_bed':'')+
     '" onclick="setOutcome(\'empty_bed\')"><i data-lucide="bed-single"></i>Empty Bed — nobody in this bed</div></div>';
  h+='</div>';

  if(f.outcome==='empty_bed'){
    h+='<div class="card"><div class="hint" style="margin:0">No care to document — this bed was empty (discharged, in the hospital, or not yet admitted). '+
       'Empty beds are not counted against the shower rate.</div></div>';
  }

  if(f.outcome==='bed_bath'){
    h+='<div class="card"><label>Reason for bed bath (not shower)</label><select id="fBBReason">'+
    '<option value="">— pick a reason —</option>'+
    BB_REASONS.map(function(r){return '<option'+(f.bed_bath_reason===r?' selected':'')+'>'+r+'</option>'}).join('')+
    '</select></div>';
  }

  if(f.outcome==='shower'||f.outcome==='bed_bath'){
    h+='<div class="card"><label style="margin-top:0">Care completed <span style="font-weight:400;text-transform:none">(tap: ✓ yes → N/A → REF refused → blank)</span></label>';
    TASKS.forEach(function(t){
      var v=f.tasks[t.key];
      h+='<div class="check-row '+(v===true?'on':v==='na'?'na':v==='refused'?'ref':'')+'" onclick="toggleTask(\''+t.key+'\')">'+
         '<div class="cbox">'+(v===true?'✓':v==='na'?'N/A':v==='refused'?'REF':'')+'</div>'+
         '<div class="check-label">'+t.label+(t.sub?'<div class="check-sub">'+t.sub+'</div>':'')+'</div></div>';
    });
    h+='</div>';
    h+='<div class="card"><label style="margin-top:0">Skin check</label>'+
       '<div class="hint" style="margin-bottom:9px">Look for bruising, skin tears, redness, open areas, dryness — everywhere.</div>'+
       '<span class="skin-chip ok '+(f.skin_ok===true?'on':'')+'" onclick="setSkinOk(true)">✓ Skin intact — nothing new</span>'+
       '<div style="margin:6px 0 2px;font-size:12px;font-weight:700;color:var(--text-light)">OR mark what you found:</div>';
    SKIN_ISSUES.forEach(function(s){
      h+='<span class="skin-chip '+(f.skin_issues.indexOf(s.key)>=0?'on':'')+'" onclick="toggleSkin(\''+s.key+'\')">'+s.label+'</span>';
    });
    if(f.skin_issues.length){
      h+='<div class="banner banner-red"><i data-lucide="octagon-alert"></i>STOP — show the charge nurse before dressing the resident.</div>'+
         '<label>Tap the body where you found it</label>'+
         '<div class="bodymap">'+bodySVG(BODY_FRONT,'FRONT')+bodySVG(BODY_BACK,'BACK')+'</div>'+
         (f.skin_locations.length?'<div style="margin:4px 0 2px">'+f.skin_locations.map(function(l){return '<span class="loc-chip">📍 '+esc(l)+'</span>'}).join('')+'</div>':'<div class="hint">Tap an area to mark it — tap again to remove. Front & back views.</div>')+
         '<label>Describe what you see</label><textarea id="fSkinNote" placeholder="e.g. quarter-size bruise, new since last shower">'+esc(f.skin_note)+'</textarea>';
    }
    h+='</div>';
  }

  if(f.outcome==='refused'){
    h+='<div class="card"><label style="margin-top:0">Refusal steps — work down the list</label>'+
       '<div class="hint" style="margin-bottom:10px">Check each step as it happens. Steps 2–4 need the name of who tried.</div>';
    REFUSAL_STEPS.forEach(function(s){
      var st=f.refusal_steps[s.key];
      h+='<div class="step '+(st?'on':'')+'"><div class="step-hd" onclick="toggleStep(\''+s.key+'\')">'+
         '<div class="cbox">'+(st?'✓':'')+'</div><div class="step-t">'+s.label+'</div></div>';
      if(st&&s.needName)h+='<input id="rs_'+s.key+'" placeholder="'+s.ph+'" value="'+esc(st.by||'')+'">';
      h+='</div>';
    });
    h+='</div>';
  }

  if(f.outcome){
    h+='<div class="card"><label style="margin-top:0">Notes / comments / behaviors</label>'+
       '<textarea id="fNotes" placeholder="Anything the nurse or next shift should know. No resident names.">'+esc(f.notes)+'</textarea></div>';
    h+='<button class="btn btn-primary" id="saveBtn" onclick="saveForm()">Save — signed as '+esc(me.name)+'</button>';
  }
  return h;
}

// Paycom employee number of the signed-in CNA (null for typed names or legacy sign-ins).
function msEmployeeNumber(){var u=window.MS&&MS.identity&&MS.identity.get();return(u&&u.name===me.name&&u.employee_number)?u.employee_number:null}
var saving=false;
async function saveForm(){
  if(saving)return;
  captureText();
  var f=form;
  if(!f.outcome){toast('Pick what happened first');return}
  if(f.outcome==='bed_bath'&&!f.bed_bath_reason){toast('Pick the bed bath reason');return}
  if((f.outcome==='shower'||f.outcome==='bed_bath')&&f.skin_ok===null&&!f.skin_issues.length){toast('Complete the skin check');return}
  if(f.outcome==='refused'&&!Object.keys(f.refusal_steps).length){toast('Check at least refusal step 1');return}
  saving=true;document.getElementById('saveBtn').disabled=true;
  var row={log_date:selDate,shift:selShift,room_bed:f.room_bed,scheduled:f.scheduled,outcome:f.outcome,
    bed_bath_reason:f.outcome==='bed_bath'?f.bed_bath_reason:null,
    tasks:careGiven(f.outcome)?f.tasks:{},
    skin_issues:careGiven(f.outcome)?f.skin_issues:[],
    skin_locations:(!careGiven(f.outcome)||!f.skin_issues.length)?[]:f.skin_locations,
    skin_note:(careGiven(f.outcome)&&f.skin_issues.length)?f.skin_note:null,
    notes:f.notes||null,
    refusal_steps:f.outcome==='refused'?f.refusal_steps:null,
    cna_name:me.name,employee_number:msEmployeeNumber(),updated_at:new Date().toISOString(),source:'shower-app'};
  var res=await sb.from('shower_logs').upsert(row,{onConflict:'log_date,shift,room_bed'});
  saving=false;
  if(res.error){document.getElementById('saveBtn').disabled=false;toast('Save failed — try again');console.error(res.error);return}
  toast('Saved — Room '+f.room_bed.replace('P',''));
  backHome();
}

function nurseView(){
  var h=dateSeg();
  var list=shiftLogs();
  var flags=list.filter(function(l){return (l.skin_issues&&l.skin_issues.length)||l.outcome==='refused'});
  h+='<div class="card" style="padding:12px 16px"><b style="font-size:15px;display:flex;align-items:center;gap:6px"><i data-lucide="stethoscope"></i>Charge Nurse Review — '+selShift+'</b>'+
     '<div class="hint">Replaces the paper sheet turn-in. Review each entry; skin issues and refusals are flagged.</div></div>';
  if(flags.length)h+='<div class="banner banner-red"><i data-lucide="circle-alert"></i>'+flags.length+' entr'+(flags.length===1?'y needs':'ies need')+' your attention (skin issue or refusal)</div>';
  if(!list.length){h+='<div class="card"><div class="empty">Nothing documented for '+selDate+' '+selShift+' yet.</div></div>'+logoutRow();return h}
  h+='<div class="card">';
  list.forEach(function(l){
    var det=[];
    if(l.skin_issues&&l.skin_issues.length)det.push('⚠️ SKIN: '+l.skin_issues.map(function(k){var s=SKIN_ISSUES.find(function(x){return x.key===k});return s?s.label:k}).join(', ')+
      (l.skin_locations&&l.skin_locations.length?' 📍 '+l.skin_locations.map(esc).join(', '):'')+
      (l.skin_note?' — '+esc(l.skin_note):''));
    if(l.outcome==='bed_bath'&&l.bed_bath_reason)det.push('Reason: '+esc(l.bed_bath_reason));
    if(l.outcome==='refused'&&l.refusal_steps){
      var steps=REFUSAL_STEPS.filter(function(s){return l.refusal_steps[s.key]}).map(function(s){return s.label.split('.')[0]+(l.refusal_steps[s.key].by&&s.needName?' ('+esc(l.refusal_steps[s.key].by)+')':'')});
      det.push('Steps done: '+steps.join(' · '));
    }
    if(l.notes)det.push('📝 '+esc(l.notes));
    var tdone=Object.keys(l.tasks||{}).filter(function(k){return l.tasks[k]===true}).length;
    var tref=TASKS.filter(function(t){return l.tasks&&l.tasks[t.key]==='refused'});
    if(careGiven(l.outcome))det.push('Care tasks: '+tdone+'/'+TASKS.length+' done'+
      (tref.length?' · 🚫 refused: '+tref.map(function(t){return t.short}).join(', '):''));
    if(l.outcome==='empty_bed')det.push('Bed was empty — no care due');
    h+='<div class="nurse-row"><div class="nr-hd"><span class="nr-room">Room '+l.room_bed.replace('P','')+'</span>'+
       '<span class="nr-out" style="color:'+outColor(l.outcome)+'">'+outLabel(l.outcome).toUpperCase()+'</span></div>'+
       '<div class="nr-detail">'+esc(l.cna_name)+' · '+fmtTime(l.updated_at)+(det.length?'<br>'+det.join('<br>'):'')+'</div>'+
       '<div class="nr-review">'+(l.nurse_reviewed_by?'<span class="done">✔️ Reviewed by '+esc(l.nurse_reviewed_by)+' at '+fmtTime(l.nurse_reviewed_at)+'</span> <span class="rbtn" style="font-size:12px;padding:5px 10px;margin-left:8px;border-color:var(--text-light);color:var(--text-light)" onclick="unreviewLog(\''+l.id+'\',\''+esc(l.room_bed)+'\')">Undo</span>':
       '<span class="rbtn" onclick="reviewLog(\''+l.id+'\',\''+esc(l.room_bed)+'\')">Mark reviewed</span>')+'</div></div>';
  });
  h+='</div>';
  h+=logoutRow();
  return h;
}
async function reviewLog(id,rb){
  if(!confirm('Sign off as CHARGE NURSE review for Room '+rb.replace('P','')+'?\n\nThis stamps "'+me.name+'" as the reviewing nurse. CNAs: please don\'t sign this — hand the phone to the charge nurse.'))return;
  var res=await sb.from('shower_logs').update({nurse_reviewed_by:me.name,nurse_reviewed_at:new Date().toISOString()}).eq('id',id);
  if(res.error){toast('Update failed — try again');return}
  toast('Marked reviewed');loadAndRender();
}
async function unreviewLog(id,rb){
  if(!confirm('Remove the nurse review sign-off for Room '+rb.replace('P','')+'? The entry goes back to "needs review."'))return;
  var res=await sb.from('shower_logs').update({nurse_reviewed_by:null,nurse_reviewed_at:null}).eq('id',id);
  if(res.error){toast('Update failed — try again');return}
  toast('Review sign-off removed');loadAndRender();
}

loadAndRender();
</script>
<script src="../ms-nav.js?v=1" defer></script>
